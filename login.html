<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>CM_Pro Login</title>

<link
rel="manifest"
href="/CM_Pro/manifest.json"
>

<meta
name="theme-color"
content="#0e1b3c"
>

<meta
name="apple-mobile-web-app-capable"
content="yes"
>

<meta
name="apple-mobile-web-app-status-bar-style"
content="black-translucent"
>

<meta
name="apple-mobile-web-app-title"
content="CM_Pro"
>

<meta
name="mobile-web-app-capable"
content="yes"
>

<link
rel="apple-touch-icon"
href="/CM_Pro/assets/images/icon-192.png"
>

<!-- theme flash-prevention (same as every other page): light or dark
     login screen to match the app theme -->
<script>
  document.documentElement.setAttribute(
    "data-theme",
    (function(){var t=localStorage.getItem("cm_theme")||"auto";return t==="auto"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;})()
  );
</script>

<script src="./config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>
<script src="/CM_Pro/shared/language.js"></script>
<script src="/CM_Pro/shared/i18n.js"></script>
<script src="/CM_Pro/shared/i18n/common.js"></script>
<script src="/CM_Pro/shared/i18n/core.js"></script>

<!-- ========================= -->
<!-- STYLES -->
<!-- ========================= -->

<link rel="stylesheet" href="./assets/css/base.css">

<link rel="stylesheet" href="./assets/css/login.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/global-splash.css">

</head>

<body>

<!-- ========================= -->
<!-- IOS INSTALL -->
<!-- ========================= -->

<div id="iosInstallBanner">

<div class="ios-title"><span class="ui-ico ui-ico-install" aria-hidden="true"></span> <span data-i18n="login.installTitle">Install CM_Pro</span></div>

<div class="ios-text" data-i18n-html="login.installText">
Tap <b>Share</b> then
<b>Add to Home Screen</b>
</div>

<button id="closeIOSBanner" data-i18n="login.installOk">
OK
</button>

</div>

<!-- ========================= -->
<!-- LOGIN CARD -->
<!-- ========================= -->

<div class="lang-switch" id="loginLangSwitch" role="group" aria-label="Language">
<button type="button" data-lang="km"><img src="/CM_Pro/assets/icons/flags/kh.png" alt="">ខ្មែរ</button>
<button type="button" data-lang="en"><img src="/CM_Pro/assets/icons/flags/gb.png" alt="">EN</button>
</div>

<div class="login-card">

<img
src="./assets/images/icon-192-maskable.png"
class="logo"
>

<div class="title" data-i18n="login.title">
ប្រព័ន្ធត្រួតពិនិត្យឥណទាន
</div>
<div class="subtitle"><span data-i18n="login.subtitle">សាខាខេត្តស្វាយរៀង</span></div>

<form id="loginForm">

<!-- ===== STEP 1: USERNAME ===== -->

<div id="loginStep1">
<div class="field">
<span class="field-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>
<input
type="text"
id="username"
class="input-box"
placeholder="Username"
data-i18n-placeholder="login.usernamePlaceholder"
autocomplete="username"
required
>
</div>

<button
type="button"
class="login-btn"
id="usernameNextBtn"
data-i18n="common.next"
>
Next
</button>

</div>

<!-- ===== STEP 2: PASSWORD ===== -->

<div id="loginStep2" hidden>

<div class="username-summary" id="usernameSummary">
<span class="user-avatar" id="userAvatar" aria-hidden="true"></span>
<span class="user-meta">
<span class="user-welcome" data-i18n="login.welcomeBack">សូមស្វាគមន៍មកវិញ</span>
<span class="user-name" id="usernameSummaryText"></span>
</span>
<span class="username-change-link" id="usernameChangeBtn" data-i18n="common.change">Change</span>
</div>

<div class="password-wrapper field">
<span class="field-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg></span>
<input
type="password"
id="password"
class="input-box"
placeholder="Password"
data-i18n-placeholder="login.passwordPlaceholder"
autocomplete="current-password"
>

<button
type="button"
class="show-password"
id="togglePassword"
aria-label="Show"
data-i18n-aria-label="login.show"
>
<svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
<svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
</button>

</div>

<div class="forgot-password-row">
<span class="forgot-password-link" id="forgotPasswordBtn" data-i18n="login.forgotPassword">
Forgot Password?
</span>
</div>

<button
type="submit"
class="login-btn"
id="loginBtn"
data-i18n="login.submit"
>
ចូលប្រើប្រាស់
</button>
<div class="alt-login" id="altLogin" hidden>
<div class="alt-or"><span data-i18n="login.or">ឬចូលដោយ</span></div>
<div class="alt-btns">
<button type="button" class="alt-btn" id="btnBioLogin" hidden><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2"/><path d="M17 4h2a1 1 0 0 1 1 1v2"/><path d="M20 17v2a1 1 0 0 1-1 1h-2"/><path d="M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M12 11c.8 0 1.5.7 1.5 1.5v2c0 1-.3 2-.8 2.8"/><path d="M9.5 16.5c.3-1 .5-2.1.5-3.2a3 3 0 0 1 6 0c0 .4 0 .8-.1 1.2"/><path d="M7.5 17.5c.5-1.5.8-3 .8-4.7a4.7 4.7 0 0 1 9.2-1.3"/><path d="M5.5 18.3c.8-2 1.3-4.1 1.3-6.3a6.2 6.2 0 0 1 11-3.9"/></svg><span data-i18n="login.withBiometric">ស្នាមម្រាមដៃ / ផ្ទៃមុខ</span></button>
<button type="button" class="alt-btn" id="btnPinLogin" hidden><svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="6" r="1.8"/><circle cx="12" cy="6" r="1.8"/><circle cx="18" cy="6" r="1.8"/><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/><circle cx="6" cy="18" r="1.8"/><circle cx="12" cy="18" r="1.8"/><circle cx="18" cy="18" r="1.8"/></svg><span data-i18n="login.withPin">លេខកូដ PIN</span></button>
</div>
</div>
</div>

<div
class="loading"
id="loading"
></div>

<div
class="status-box"
id="statusBox"
></div>

</form>

</div>

<!-- ========================= -->
<!-- PIN LOGIN OVERLAY -->
<!-- ========================= -->

<div id="pinOverlay" class="pin-overlay" hidden>

<div class="pin-overlay-inner">

<button type="button" class="pin-back-btn" id="pinBackBtn" aria-label="Back"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<div class="pin-avatar" id="pinAvatar" aria-hidden="true"></div>
<div class="pin-greeting" id="pinGreeting"></div>

<div class="pin-overlay-title" data-i18n="login.pin.enterTitle">
សូមបញ្ចូលលេខកូដ
</div>

<div class="pin-dots" id="pinDots">
<span class="pin-dot"></span>
<span class="pin-dot"></span>
<span class="pin-dot"></span>
<span class="pin-dot"></span>
<span class="pin-dot"></span>
<span class="pin-dot"></span>
</div>

<div class="pin-overlay-status" id="pinOverlayStatus"></div>

<div class="pin-keypad">
<button type="button" class="pin-key" data-digit="1">1</button>
<button type="button" class="pin-key" data-digit="2">2</button>
<button type="button" class="pin-key" data-digit="3">3</button>
<button type="button" class="pin-key" data-digit="4">4</button>
<button type="button" class="pin-key" data-digit="5">5</button>
<button type="button" class="pin-key" data-digit="6">6</button>
<button type="button" class="pin-key" data-digit="7">7</button>
<button type="button" class="pin-key" data-digit="8">8</button>
<button type="button" class="pin-key" data-digit="9">9</button>
<span class="pin-slot"><button type="button" class="pin-key pin-key-bio" id="pinBioKey" aria-label="Fingerprint / Face" hidden><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2"/><path d="M17 4h2a1 1 0 0 1 1 1v2"/><path d="M20 17v2a1 1 0 0 1-1 1h-2"/><path d="M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M12 11c.8 0 1.5.7 1.5 1.5v2c0 1-.3 2-.8 2.8"/><path d="M9.5 16.5c.3-1 .5-2.1.5-3.2a3 3 0 0 1 6 0c0 .4 0 .8-.1 1.2"/><path d="M7.5 17.5c.5-1.5.8-3 .8-4.7a4.7 4.7 0 0 1 9.2-1.3"/><path d="M5.5 18.3c.8-2 1.3-4.1 1.3-6.3a6.2 6.2 0 0 1 11-3.9"/></svg></button></span>
<button type="button" class="pin-key" data-digit="0">0</button>
<button type="button" class="pin-key pin-key-back" id="pinBackspace" aria-label="Backspace"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9.5l-5 5M12 9.5l5 5"/></svg></button>
</div>

<div class="pin-forgot" id="pinForgotBtn" data-i18n="login.pin.forgot">
ភ្លេចលេខកូដ?
</div>

</div>

</div>

<!-- ========================= -->
<!-- PIN SETUP OVERLAY (first login without a PIN yet — skippable) -->
<!-- ========================= -->

<div id="pinSetupOverlay" class="pin-overlay" hidden>

<div class="pin-overlay-inner">

<div class="pin-overlay-title" id="pinSetupTitle"></div>

<!-- Step: current password (only shown when completeLogin() didn't
     already have it in memory — i.e. fingerprint/PIN login, not a
     fresh password login) -->
<div id="pinSetupPasswordStep" hidden>
<input
type="password"
id="pinSetupPassword"
class="input-box"
placeholder="Password"
data-i18n-placeholder="login.passwordPlaceholder"
autocomplete="current-password"
style="margin-bottom:20px;"
>
<button type="button" class="login-btn" id="pinSetupPasswordNext" data-i18n="common.next">
Next
</button>
</div>

<!-- Steps: create PIN / confirm PIN (same dots+keypad, reused for both) -->
<div id="pinSetupEntryStep" hidden>

<div class="pin-dots" id="pinSetupDots">
<span class="pin-dot"></span>
<span class="pin-dot"></span>
<span class="pin-dot"></span>
<span class="pin-dot"></span>
<span class="pin-dot"></span>
<span class="pin-dot"></span>
</div>

<div class="pin-overlay-status" id="pinSetupStatus"></div>

<div class="pin-keypad">
<button type="button" class="pin-key" data-setup-digit="1">1</button>
<button type="button" class="pin-key" data-setup-digit="2">2</button>
<button type="button" class="pin-key" data-setup-digit="3">3</button>
<button type="button" class="pin-key" data-setup-digit="4">4</button>
<button type="button" class="pin-key" data-setup-digit="5">5</button>
<button type="button" class="pin-key" data-setup-digit="6">6</button>
<button type="button" class="pin-key" data-setup-digit="7">7</button>
<button type="button" class="pin-key" data-setup-digit="8">8</button>
<button type="button" class="pin-key" data-setup-digit="9">9</button>
<span></span>
<button type="button" class="pin-key" data-setup-digit="0">0</button>
<button type="button" class="pin-key pin-key-back" id="pinSetupBackspace" aria-label="Backspace"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9.5l-5 5M12 9.5l5 5"/></svg></button>
</div>

</div>

<!-- Step: enable biometrics (after a successful PIN setup) -->
<div id="pinSetupBiometricStep" hidden>
<div class="pin-overlay-status" id="pinSetupBiometricStatus" style="color:#b9c6e0;"></div>
<button type="button" class="login-btn" id="pinSetupEnableBiometric" data-i18n="login.pinSetup.enableBiometric" style="margin-bottom:12px;">
Enable
</button>
<div class="pin-forgot" id="pinSetupSkipBiometric" data-i18n="login.pinSetup.skipBiometric">Not now</div>
</div>

<div class="pin-forgot" id="pinSetupSkipBtn" data-i18n="login.pinSetup.skip">
រំលងឥឡូវនេះ
</div>

</div>

</div>

<!-- ========================= -->
<!-- GLOBAL SPLASH -->
<!-- ========================= -->

<script src="/CM_Pro/assets/js/global-splash.js"></script>

<!-- ========================= -->
<!-- LOGIN LOGIC -->
<!-- ========================= -->

<script src="./assets/js/webauthn.js"></script>
<script src="./assets/js/login.js"></script>

</body>
</html>
