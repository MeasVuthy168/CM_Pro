<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>CM_Pro Login</title>

<link
rel="manifest"
href="/CM_Pro/manifest.json"
>

<meta
name="theme-color"
content="#032d73"
>

<meta
name="apple-mobile-web-app-capable"
content="yes"
>

<meta
name="apple-mobile-web-app-status-bar-style"
content="black-translucent"
>

<meta
name="apple-mobile-web-app-title"
content="CM_Pro"
>

<meta
name="mobile-web-app-capable"
content="yes"
>

<link
rel="apple-touch-icon"
href="/CM_Pro/assets/images/icon-192.png"
>

<script src="./config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>
<script src="/CM_Pro/shared/language.js"></script>
<script src="/CM_Pro/shared/i18n.js"></script>
<script src="/CM_Pro/shared/i18n/common.js"></script>
<script src="/CM_Pro/shared/i18n/core.js"></script>

<!-- ========================= -->
<!-- STYLES -->
<!-- ========================= -->

<link rel="stylesheet" href="./assets/css/base.css">

<link rel="stylesheet" href="./assets/css/login.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/global-splash.css">

</head>

<body>

<!-- ========================= -->
<!-- IOS INSTALL -->
<!-- ========================= -->

<div id="iosInstallBanner">

<div class="ios-title" data-i18n="login.installTitle">
📲 Install CM_Pro
</div>

<div class="ios-text" data-i18n-html="login.installText">
Tap <b>Share</b> then
<b>Add to Home Screen</b>
</div>

<button id="closeIOSBanner" data-i18n="login.installOk">
OK
</button>

</div>

<!-- ========================= -->
<!-- LOGIN CARD -->
<!-- ========================= -->

<div class="login-card">

<img
src="./assets/images/icon-192-maskable.png"
class="logo"
>

<div class="title" data-i18n="login.title">
ត្រួតពិនិត្យ​ឥណទានស្វាយរៀង​
</div>

<div class="subtitle" data-i18n="login.subtitle">
SVG Credit Monitoring System
</div>

<form id="loginForm">

<input
type="text"
id="username"
class="input-box"
placeholder="Username"
data-i18n-placeholder="login.usernamePlaceholder"
autocomplete="username"
required
>

<div class="password-wrapper">

<input
type="password"
id="password"
class="input-box"
placeholder="Password"
data-i18n-placeholder="login.passwordPlaceholder"
autocomplete="current-password"
required
>

<span
class="show-password"
id="togglePassword"
data-i18n="login.show"
>
Show
</span>

</div>

<div class="remember-row">

<input
type="checkbox"
id="rememberMe"
>

<label for="rememberMe" data-i18n="login.rememberMe">
Remember Me
</label>

</div>

<button
type="submit"
class="login-btn"
id="loginBtn"
data-i18n="login.submit"
>
ចូលប្រើប្រាស់
</button>

<button
type="button"
class="fingerprint-login-btn"
id="fingerprintLoginBtn"
hidden
data-i18n="login.fingerprint"
>
👆 ចូលដោយស្នាមម្រាមដៃ ឬ ផ្ទៃមុខ
</button>

<div
class="loading"
id="loading"
></div>

<div
class="status-box"
id="statusBox"
></div>

</form>

</div>

<!-- ========================= -->
<!-- GLOBAL SPLASH -->
<!-- ========================= -->

<script src="/CM_Pro/assets/js/global-splash.js"></script>

<!-- ========================= -->
<!-- LOGIN LOGIC -->
<!-- ========================= -->

<script src="./assets/js/webauthn.js"></script>
<script src="./assets/js/login.js"></script>

</body>
</html>
