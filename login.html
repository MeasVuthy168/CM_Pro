
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>CM_Pro Login</title>

<meta name="theme-color" content="#032d73">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>

<meta
    name="apple-mobile-web-app-title"
    content="CM_Pro"
>

<link
    rel="manifest"
    href="/CM_Pro/manifest.json"
>

<link
    rel="apple-touch-icon"
    href="/CM_Pro/assets/images/icon-192.png"
>

<script src="./config/api.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    background:#032d73;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px 20px 100px;
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-user-select:none;
}

.login-card{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:28px;
    padding:35px 25px;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
}

.logo{
    width:120px;
    display:block;
    margin:auto auto 20px;
}

.title{
    text-align:center;
    font-size:22px;
    color:#17356f;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:35px;
}

.input-box{
    width:100%;
    height:60px;
    border:none;
    background:#f2f4f8;
    border-radius:16px;
    padding:0 18px;
    font-size:18px;
    margin-bottom:20px;
    outline:none;
}

.password-wrapper{
    position:relative;
}

.show-password{
    position:absolute;
    right:18px;
    top:20px;
    cursor:pointer;
    color:#032d73;
    font-size:14px;
    font-weight:600;
}

.remember-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:25px;
}

.login-btn,
#closeIOSBanner{
    width:100%;
    height:60px;
    border:none;
    border-radius:16px;
    background:#032d73;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

.loading{
    display:none;
    width:35px;
    height:35px;
    margin:20px auto;
    border:4px solid #ddd;
    border-top:4px solid #032d73;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

.status-box{
    text-align:center;
    min-height:24px;
    font-weight:600;
}

.success{color:#10a844;}
.error{color:#d90429;}

@keyframes spin{
    to{transform:rotate(360deg);}
}

/* SPLASH */

#splashScreen{
    position:fixed;
    inset:0;
    background:#032d73;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:99999;
    transition:.4s;
}

.splash-title{
    color:#fff;
    font-size:32px;
    font-weight:700;
    margin:10px 0;
}

.splash-subtitle{
    color:#ddd;
}

/* IOS INSTALL */

#iosInstallBanner{
    position:fixed;
    left:15px;
    right:15px;
    bottom:20px;
    background:#fff;
    border-radius:20px;
    padding:20px;
    z-index:99999;
    display:none;
    box-shadow:0 8px 30px rgba(0,0,0,.25);
}

.ios-title{
    font-size:20px;
    font-weight:700;
    color:#032d73;
    margin-bottom:10px;
}

.ios-text{
    line-height:1.5;
    color:#444;
}

</style>

</head>

<body>

<!-- SPLASH -->

<div id="splashScreen">

    <img
        src="./assets/images/LogoAC.png"
        style="width:120px"
    >

    <div class="splash-title">
        CM_Pro
    </div>

    <div class="splash-subtitle">
        SVG Credit Monitoring
    </div>

</div>

<!-- IOS INSTALL -->

<div id="iosInstallBanner">

    <div class="ios-title">
        📲 Install CM_Pro
    </div>

    <div class="ios-text">
        Tap <b>Share</b> then
        <b>Add to Home Screen</b>
    </div>

    <button id="closeIOSBanner">
        OK
    </button>

</div>

<!-- LOGIN -->

<div class="login-card">

    <img
        src="./assets/images/LogoAC.png"
        class="logo"
    >

    <div class="title">
        ប្រព័ន្ធតាមដាន
    </div>

    <div class="subtitle">
        SVG Credit Monitoring System
    </div>

    <form id="loginForm">

        <input
            type="text"
            id="username"
            class="input-box"
            placeholder="Username"
            autocomplete="username"
            required
        >

        <div class="password-wrapper">

            <input
                type="password"
                id="password"
                class="input-box"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <span
                class="show-password"
                id="togglePassword"
            >
                Show
            </span>

        </div>

        <div class="remember-row">

            <input
                type="checkbox"
                id="rememberMe"
            >

            <label for="rememberMe">
                Remember Me
            </label>

        </div>

        <button
            type="submit"
            class="login-btn"
            id="loginBtn"
        >
            ចូលប្រើប្រាស់
        </button>

        <div
            class="loading"
            id="loading"
        ></div>

        <div
            class="status-box"
            id="statusBox"
        ></div>

    </form>

</div>

<script>

// =========================
// SHORTCUTS
// =========================

const $ = id => document.getElementById(id);

const form = $("loginForm");

const loading = $("loading");

const statusBox = $("statusBox");

const passwordInput = $("password");

// =========================
// SERVICE WORKER
// =========================

if("serviceWorker" in navigator){

    navigator.serviceWorker
        .register("/CM_Pro/service-worker.js");

}

// =========================
// SPLASH
// =========================

window.addEventListener("load",()=>{

    setTimeout(()=>{

        $("splashScreen").style.opacity="0";

        setTimeout(()=>{

            $("splashScreen").remove();

        },400);

    },700);

});

// =========================
// IOS DETECT
// =========================

const isIOS = ()=>
    /iphone|ipad|ipod/i
    .test(navigator.userAgent);

const standalone = ()=>
    window.navigator.standalone === true;

// =========================
// IOS INSTALL
// =========================

if(
    isIOS() &&
    !standalone() &&
    !localStorage.getItem("iosInstallShown")
){

    window.addEventListener("load",()=>{

        setTimeout(()=>{

            $("iosInstallBanner").style.display="block";

        },2500);

    });

}

$("closeIOSBanner").onclick=()=>{

    $("iosInstallBanner").style.display="none";

    localStorage.setItem(
        "iosInstallShown",
        "true"
    );

};

// =========================
// ANDROID INSTALL
// =========================

let deferredPrompt;

window.addEventListener(

    "beforeinstallprompt",

    e=>{

        if(isIOS()) return;

        e.preventDefault();

        deferredPrompt=e;

        const btn=document.createElement("button");

        btn.innerText="📲 Install App";

        Object.assign(btn.style,{

            position:"fixed",
            bottom:"20px",
            left:"50%",
            transform:"translateX(-50%)",
            zIndex:"9999",
            width:"220px",
            height:"55px",
            border:"none",
            borderRadius:"16px",
            background:"#ffd700",
            color:"#032d73",
            fontSize:"18px",
            fontWeight:"600"

        });

        document.body.appendChild(btn);

        btn.onclick=async()=>{

            btn.remove();

            deferredPrompt.prompt();

            await deferredPrompt.userChoice;

            deferredPrompt=null;

        };

    }

);

// =========================
// AUTO LOGIN
// =========================

const token =
    localStorage.getItem("token") ||
    sessionStorage.getItem("token");

if(token){

    try{

        const user=JSON.parse(

            localStorage.getItem(
                "loggedInUser"
            ) || "{}"

        );

        location.replace(

            user.role==="admin"

            ? "/CM_Pro/Admin/adminupload.html"

            : "/CM_Pro/index.html"

        );

    }catch{

        location.replace(
            "/CM_Pro/index.html"
        );

    }

}

// =========================
// REMEMBER LOGIN
// =========================

const saved = JSON.parse(

    localStorage.getItem(
        "remember_login"
    ) || "null"

);

if(saved){

    $("username").value=saved.username||"";

    $("password").value=saved.password||"";

    $("rememberMe").checked=true;

}

// =========================
// SHOW PASSWORD
// =========================

$("togglePassword").onclick=()=>{

    const isPass=
        passwordInput.type==="password";

    passwordInput.type=
        isPass ? "text":"password";

    $("togglePassword").innerText=
        isPass ? "Hide":"Show";

};

// =========================
// MESSAGE
// =========================

function msg(text,type){

    statusBox.innerText=text;

    statusBox.className=
        "status-box "+type;

}

// =========================
// LOADING
// =========================

function setLoading(v){

    $("loginBtn").disabled=v;

    loading.style.display=
        v ? "block":"none";

}

// =========================
// LOGIN
// =========================

form.addEventListener(

    "submit",

    async e=>{

        e.preventDefault();

        const username=
            $("username").value.trim();

        const password=
            $("password").value;

        if(!username || !password){

            return msg(
                "Enter username/password",
                "error"
            );

        }

        try{

            setLoading(true);

            const res=await fetch(

                `${API.BASE_URL}/api/auth/login`,

                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({
                        username,
                        password
                    })

                }

            );

            const data=await res.json();

            if(!res.ok || !data.ok){

                return msg(
                    data.message ||
                    "Login failed",
                    "error"
                );

            }

            localStorage.removeItem("token");

            sessionStorage.removeItem("token");

            (
                $("rememberMe").checked

                ? localStorage

                : sessionStorage

            ).setItem("token",data.token);

            const user =

                data.user ||

                data.data ||

                data;

            localStorage.setItem(

                "loggedInUser",

                JSON.stringify({

                    username:
                        user.username || "",

                    fullname:
                        user.fullname || "",

                    role:
                        user.role || "user",

                    image:
                        user.image || ""

                })

            );

            if($("rememberMe").checked){

                localStorage.setItem(

                    "remember_login",

                    JSON.stringify({
                        username,
                        password
                    })

                );

            }else{

                localStorage.removeItem(
                    "remember_login"
                );

            }

            msg(
                "Login successful",
                "success"
            );

            setTimeout(()=>{

                location.href=

                    user.role==="admin"

                    ? "/CM_Pro/Admin/adminupload.html"

                    : "/CM_Pro/index.html";

            },500);

        }catch(err){

            console.error(err);

            msg(
                "Cannot connect server",
                "error"
            );

        }finally{

            setLoading(false);

        }

    }

);

</script>

</body>

</html>
```
