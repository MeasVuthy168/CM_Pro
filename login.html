<!DOCTYPE html>
<html lang="km">

<head>

    <meta charset="UTF-8">

    <title>CM_Pro Login</title>

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no
        "
    >

    <link
        rel="stylesheet"
        href="./assets/css/main.css"
    >

    <style>

        body{

            background:#002D6B;

            display:flex;

            justify-content:center;

            align-items:center;

            min-height:100vh;

        }

        .login-box{

            background:white;

            width:90%;

            max-width:380px;

            border-radius:24px;

            padding:30px 24px;

            box-shadow:
                0 6px 20px rgba(0,0,0,0.25);

            text-align:center;

        }

        .login-logo{

            width:80px;

            margin-bottom:12px;

        }

        .login-title{

            font-size:28px;

            color:#002D6B;

            margin-bottom:5px;

        }

        .login-version{

            color:#777;

            margin-bottom:25px;

            font-size:14px;

        }

        .login-input{

            width:100%;

            padding:14px;

            border:none;

            border-radius:12px;

            background:#F1F5F9;

            margin-bottom:14px;

            font-size:16px;

            font-family:'KRASAR', sans-serif;

        }

        .login-btn{

            width:100%;

            padding:14px;

            border:none;

            border-radius:14px;

            background:#002D6B;

            color:white;

            font-size:17px;

            font-family:'KRASAR', sans-serif;

            cursor:pointer;

        }

        .login-btn:active{

            transform:scale(0.98);

        }

        .remember-box{

            display:flex;

            align-items:center;

            gap:8px;

            margin-bottom:18px;

            color:#444;

        }

        .error-text{

            color:red;

            margin-top:15px;

            min-height:20px;

        }

        #loading{

            position:fixed;

            inset:0;

            background:
                rgba(0,0,0,0.4);

            display:none;

            justify-content:center;

            align-items:center;

            z-index:9999;

        }

        .spinner{

            width:40px;
            height:40px;

            border:
                4px solid rgba(255,255,255,0.2);

            border-top:
                4px solid #FFD700;

            border-radius:50%;

            animation:
                spin 0.7s linear infinite;

        }

        @keyframes spin{

            to{
                transform:rotate(360deg);
            }

        }

    </style>

</head>

<body>

    <!-- Loading -->
    <div id="loading">

        <div class="spinner"></div>

    </div>

    <!-- Login Box -->
    <div class="login-box">

        <img
            src="./assets/images/LogoAC.png"
            class="login-logo"
        >

        <div class="login-title">
            ជំនួយការឥណទាន
        </div>

        <div class="login-version">
        ​  SVG Credit Monitoring System
        </div>

        <input
            type="text"
            id="username"
            class="login-input"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            class="login-input"
            placeholder="Password"
        >

        <div class="remember-box">

            <input
                type="checkbox"
                id="rememberMe"
            >

            <label for="rememberMe">

                Remember Me

            </label>

        </div>

        <button
            class="login-btn"
            onclick="login()"
        >

            ចូលប្រើកម្មវិធី

        </button>

        <div
            class="error-text"
            id="errorText"
        ></div>

    </div>

    <script src="./config/api.js"></script>

<script>

    // Auto redirect if already logged in
    if(
        sessionStorage.getItem("token")
    ){

        location.href = "./index.html";
    }

    async function login(){

            const username =
                document
                .getElementById("username")
                .value
                .trim();

            const password =
                document
                .getElementById("password")
                .value
                .trim();

            const loading =
                document
                .getElementById("loading");

            const errorText =
                document
                .getElementById("errorText");

            errorText.textContent = "";

            loading.style.display = "flex";

            try{

                const response =
                    await fetch(

                        API.BASE_URL +
                        "/api/auth/login",

                        {
                            method:"POST",

                            headers:{
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    username,
                                    password
                                })
                        }
                    );

                const data =
                    await response.json();

                if(data.success){

                    sessionStorage.setItem(
                        "token",
                        data.token
                    );

                    sessionStorage.setItem(
                        "loggedInUser",
                        JSON.stringify(data)
                    );

                    location.href =
                        "./index.html";

                }else{

                    errorText.textContent =
                        data.message ||
                        "Login failed";

                }

            }catch(err){

                console.error(err);

                errorText.textContent =
                    "Cannot connect server";

            }

            loading.style.display = "none";

        }

    </script>

</body>

</html>
