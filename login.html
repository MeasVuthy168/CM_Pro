<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CM_Pro Login</title>

    <!-- API -->
    <script src="./config/api.js"></script>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI, Arial, sans-serif;
        }

        body{

            background:#032d73;

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:20px;

        }

        .login-card{

            width:100%;

            max-width:420px;

            background:#fff;

            border-radius:28px;

            padding:35px 25px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.18);

        }

        .logo{

            width:120px;

            display:block;

            margin:auto;

            margin-bottom:20px;

        }

        .title{

            text-align:center;

            font-size:22px;

            color:#17356f;

            margin-bottom:10px;

            font-weight:500;

        }

        .subtitle{

            text-align:center;

            color:#888;

            margin-bottom:35px;

            font-size:14px;

        }

        .input-box{

            width:100%;

            height:60px;

            border:none;

            background:#f2f4f8;

            border-radius:16px;

            padding:0 18px;

            font-size:18px;

            outline:none;

            margin-bottom:20px;

        }

        .password-wrapper{

            position:relative;

        }

        .show-password{

            position:absolute;

            right:18px;

            top:20px;

            font-size:14px;

            color:#032d73;

            cursor:pointer;

            user-select:none;

            font-weight:600;

        }

        .remember-row{

            display:flex;

            align-items:center;

            gap:10px;

            margin-bottom:25px;

            color:#444;

            font-size:15px;

        }

        .remember-row input{

            width:20px;
            height:20px;

        }

        .login-btn{

            width:100%;

            height:68px;

            border:none;

            border-radius:18px;

            background:#032d73;

            color:#fff;

            font-size:22px;

            cursor:pointer;

            transition:0.2s;

        }

        .login-btn:disabled{

            opacity:0.7;

        }

        .login-btn:hover{

            opacity:0.95;

        }

        .status-box{

            margin-top:22px;

            text-align:center;

            min-height:24px;

            font-size:15px;

            font-weight:600;

        }

        .success{
            color:#10a844;
        }

        .error{
            color:#d90429;
        }

        .loading{

            display:none;

            width:35px;

            height:35px;

            margin:auto;

            margin-top:20px;

            border:4px solid #ddd;

            border-top:4px solid #032d73;

            border-radius:50%;

            animation:spin .8s linear infinite;

        }

        @keyframes spin{

            100%{
                transform:rotate(360deg);
            }

        }

    </style>

</head>

<body>

    <div class="login-card">

        <img
            src="./assets/images/LogoAC.png"
            class="logo"
        >

        <div class="title">
            ប្រព័ន្ធតាមដាន
        </div>

        <div class="subtitle">
            SVG Credit Monitoring System
        </div>

        <form id="loginForm">

            <!-- Username -->
            <input
                type="text"
                id="username"
                class="input-box"
                placeholder="Username"
                autocomplete="username"
                required
            >

            <!-- Password -->
            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    class="input-box"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

                <span
                    class="show-password"
                    id="togglePassword"
                >
                    Show
                </span>

            </div>

            <!-- Remember -->
            <div class="remember-row">

                <input
                    type="checkbox"
                    id="rememberMe"
                >

                <label for="rememberMe">
                    Remember Me
                </label>

            </div>

            <!-- Login -->
            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                ចូលប្រើប្រាស់
            </button>

            <!-- Loading -->
            <div
                class="loading"
                id="loading"
            ></div>

            <!-- Status -->
            <div
                class="status-box"
                id="statusBox"
            ></div>

        </form>

    </div>

<script>

    // =========================
// AUTO LOGIN
// =========================

const existingToken =

    localStorage.getItem("token") ||

    sessionStorage.getItem("token");

// ONLY auto redirect if token exists

if(existingToken){

    window.location.replace(
        "/CM_Pro/index.html"
    );

}

    
    // =========================
    // ELEMENTS
    // =========================

    const form =
        document.getElementById("loginForm");

    const btn =
        document.getElementById("loginBtn");

    const loading =
        document.getElementById("loading");

    const statusBox =
        document.getElementById("statusBox");

    const passwordInput =
        document.getElementById("password");

    const togglePassword =
        document.getElementById("togglePassword");

    const rememberMe =
        document.getElementById("rememberMe");

    // =========================
    // LOAD REMEMBERED LOGIN
    // =========================

    let rememberedLogin = null;

try{

    rememberedLogin = JSON.parse(

        localStorage.getItem(
            "remember_login"
        )

    );

}catch(e){

    rememberedLogin = null;

}

    if(rememberedLogin){

        document.getElementById("username").value =

            rememberedLogin.username || "";

        document.getElementById("password").value =

            rememberedLogin.password || "";

        rememberMe.checked = true;

    }

    // =========================
    // SHOW PASSWORD
    // =========================

    togglePassword.addEventListener(
        "click",
        ()=>{

            if(passwordInput.type === "password"){

                passwordInput.type = "text";

                togglePassword.innerText = "Hide";

            }else{

                passwordInput.type = "password";

                togglePassword.innerText = "Show";

            }

        }
    );

    // =========================
    // MESSAGE
    // =========================

    function showMessage(message, type){

        statusBox.innerText = message;

        statusBox.className =
            "status-box " + type;

    }

    // =========================
    // LOADING
    // =========================

    function setLoading(isLoading){

        btn.disabled = isLoading;

        loading.style.display =
            isLoading ? "block" : "none";

    }

    // =========================
    // LOGIN
    // =========================

    form.addEventListener(
        "submit",
        async (e)=>{

            e.preventDefault();

            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();

            const password =
                passwordInput.value;

            if(!username || !password){

                showMessage(
                    "Please enter username/password",
                    "error"
                );

                return;

            }

            try{

                setLoading(true);

                showMessage("", "");

                const response =
                    await fetch(

                        `${API.BASE_URL}/api/auth/login`,

                        {
                            method:"POST",

                            headers:{
                                "Content-Type":
                                    "application/json"
                            },

                            body:JSON.stringify({
                                username,
                                password
                            })
                        }
                    );

                const data =
                    await response.json();

                if(!response.ok || !data.ok){

                    showMessage(
                        data.message ||
                        "Login failed",
                        "error"
                    );

                    return;

                }

                // =========================
// CLEAR OLD TOKEN
// =========================

localStorage.removeItem("token");

sessionStorage.removeItem("token");

// =========================
// SAVE TOKEN
// =========================

if(rememberMe.checked){

    localStorage.setItem(
        "token",
        data.token
    );

}else{

    sessionStorage.setItem(
        "token",
        data.token
    );

}

                // =========================
// SAVE USER
// =========================

const userData =

    data.user ||

    data.data ||

    data;

localStorage.setItem(

    "loggedInUser",

    JSON.stringify({

        username:
            userData.username || "",

        fullname:
            userData.fullname || "",

        role:
            userData.role || "user",

        image:
            userData.image || ""

    })
);

console.log(
    "SAVED USER:",
    JSON.parse(
        localStorage.getItem(
            "loggedInUser"
        )
    )
);

                // =========================
                // REMEMBER LOGIN
                // =========================

                if(rememberMe.checked){

                    localStorage.setItem(

                        "remember_login",

                        JSON.stringify({

                            username,
                            password

                        })
                    );

                }else{

                    localStorage.removeItem(
                        "remember_login"
                    );

                }

                showMessage(
                    "Login successful",
                    "success"
                );

                // =========================
                // REDIRECT
                // =========================

                setTimeout(()=>{

                    window.location.href =
                        "/CM_Pro/index.html";

                },700);

            }catch(error){

                console.error(error);

                showMessage(
                    "Cannot connect to server",
                    "error"
                );

            }finally{

                setLoading(false);

            }

        }
    );

</script>

</body>

</html>
