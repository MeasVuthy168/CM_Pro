<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Credit Monitoring Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    background:#f2f5fa;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-card{
    width:100%;
    max-width:380px;
    background:#fff;
    border-radius:22px;
    padding:35px 25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.logo{
    width:90px;
    height:90px;
    margin:auto;
    display:block;
    object-fit:contain;
}

.title{
    text-align:center;
    margin-top:15px;
    font-size:24px;
    font-weight:700;
    color:#1d3557;
}

.subtitle{
    text-align:center;
    color:#777;
    font-size:14px;
    margin-top:6px;
    margin-bottom:30px;
}

.input-group{
    margin-bottom:18px;
}

.input-label{
    display:block;
    margin-bottom:7px;
    font-size:14px;
    color:#444;
    font-weight:600;
}

.input-box{
    width:100%;
    height:50px;
    border:1px solid #dcdcdc;
    border-radius:14px;
    padding:0 15px;
    font-size:16px;
    outline:none;
    transition:0.2s;
}

.input-box:focus{
    border-color:#2b7cff;
    box-shadow:0 0 0 3px rgba(43,124,255,0.15);
}

.login-btn{
    width:100%;
    height:52px;
    border:none;
    border-radius:14px;
    background:#2b7cff;
    color:#fff;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    transition:0.2s;
}

.login-btn:hover{
    opacity:0.95;
}

.login-btn:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

.status-box{
    margin-top:18px;
    text-align:center;
    font-size:14px;
    min-height:20px;
    font-weight:600;
}

.success{
    color:#0a9b43;
}

.error{
    color:#d90429;
}

.footer{
    text-align:center;
    margin-top:25px;
    font-size:12px;
    color:#888;
}

.loading{
    display:none;
    margin:auto;
    margin-top:15px;
    width:32px;
    height:32px;
    border:4px solid #ddd;
    border-top:4px solid #2b7cff;
    border-radius:50%;
    animation:spin 0.8s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="login-card">

    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="logo">

    <div class="title">Credit Monitoring</div>
    <div class="subtitle">Secure Login System</div>

    <form id="loginForm">

        <div class="input-group">
            <label class="input-label">Username</label>
            <input
                type="text"
                id="username"
                class="input-box"
                placeholder="Enter username"
                autocomplete="username"
                required
            >
        </div>

        <div class="input-group">
            <label class="input-label">Password</label>
            <input
                type="password"
                id="password"
                class="input-box"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
            Login
        </button>

        <div class="loading" id="loading"></div>

        <div class="status-box" id="statusBox"></div>

    </form>

    <div class="footer">
        © 2026 Credit Monitoring
    </div>

</div>

<script>

const API_BASE = "https://cm-backend-new.onrender.com";

const form = document.getElementById("loginForm");
const btn = document.getElementById("loginBtn");
const loading = document.getElementById("loading");
const statusBox = document.getElementById("statusBox");

function showMessage(message, type){

    statusBox.innerText = message;
    statusBox.className = "status-box " + type;
}

function setLoading(isLoading){

    btn.disabled = isLoading;

    loading.style.display = isLoading ? "block" : "none";

    btn.innerText = isLoading ? "Please wait..." : "Login";
}

form.addEventListener("submit", async (e)=>{

    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if(!username || !password){
        showMessage("Please enter username and password","error");
        return;
    }

    try{

        setLoading(true);
        showMessage("","");

        const response = await fetch(`${API_BASE}/api/auth/login`,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                username,
                password
            })
        });

        const data = await response.json();

        if(!response.ok || !data.ok){

            console.log("LOGIN FAILED:", data);

            showMessage(
                data.message || "Login failed",
                "error"
            );

            return;
        }

        // SAVE TOKEN
        localStorage.setItem("token", data.token);

        // SAVE USER
        localStorage.setItem("loggedInUser", JSON.stringify({
            username: data.username || "",
            fullname: data.fullname || "",
            role: data.role || "user"
        }));

        showMessage("Login successful","success");

        console.log("LOGIN SUCCESS:", data);

        // REDIRECT
        setTimeout(()=>{
            window.location.href = "/CM_Pro/index.html";
        },800);

    }catch(err){

        console.error("LOGIN ERROR:", err);

        showMessage(
            "Cannot connect to server",
            "error"
        );

    }finally{

        setLoading(false);

    }

});

</script>

</body>
</html>
