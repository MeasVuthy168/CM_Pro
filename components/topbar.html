<div class="topbar">

    <div class="topbar-left">

        <img
            src="./assets/images/acleda-logo.PNG"
            class="topbar-logo"
        >

    </div>

    <div
        class="topbar-right"
        onclick="logout()"
    >

        <img
            src="./assets/images/profile.jpg"
            class="topbar-profile"
            id="topbarProfile"
        >

        <div
            class="topbar-name"
            id="topbarName"
        >
            សួស្តី, User
        </div>

    </div>

</div>

<script>

    // =========================
    // LOAD USER
    // =========================

    const loggedInUser = JSON.parse(

        localStorage.getItem("loggedInUser") ||

        "{}"

    );

    // =========================
    // USERNAME
    // =========================

    const fullname =

        loggedInUser.fullname ||

        loggedInUser.username ||

        "User";

    document.getElementById(
        "topbarName"
    ).innerText =

        `សួស្តី, ${fullname}`;

    // =========================
    // PROFILE IMAGE (OPTIONAL)
    // =========================

    if(loggedInUser.image){

        document.getElementById(
            "topbarProfile"
        ).src = loggedInUser.image;

    }

</script>
