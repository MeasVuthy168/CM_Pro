<script>

setTimeout(()=>{

    try{

        const loggedInUser = JSON.parse(

            localStorage.getItem(
                "loggedInUser"
            ) || "{}"

        );

        console.log(
            "TOPBAR USER:",
            loggedInUser
        );

        const fullname =

            loggedInUser.fullname ||

            loggedInUser.username ||

            "User";

        const topbarName =

            document.getElementById(
                "topbarName"
            );

        if(topbarName){

            topbarName.innerText =

                `សួស្តី, ${fullname}`;

        }

        // PROFILE IMAGE

        if(loggedInUser.image){

            const profile =

                document.getElementById(
                    "topbarProfile"
                );

            if(profile){

                profile.src =
                    loggedInUser.image;

            }

        }

    }catch(error){

        console.error(
            "TOPBAR ERROR:",
            error
        );

    }

},100);

</script>
