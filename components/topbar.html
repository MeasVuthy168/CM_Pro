<div class="topbar">

    <!-- LEFT -->

    <div class="topbar-left">

        <button
            id="topbarBackBtn"
            class="topbar-back-btn"
            style="display:none;"
        >
            ←
        </button>

        <img
            src="/CM_Pro/assets/images/acleda-logo.PNG"
            class="topbar-logo"
            id="topbarLogo"
            alt="Logo"
        >

    </div>

    <!-- CENTER -->

    <div class="topbar-center">

        <div
            class="topbar-title"
            id="topbarTitle"
        >
            CM_Pro
        </div>

    </div>

    <!-- RIGHT -->

    <div class="topbar-right">

        <button
            id="topbarActionBtn"
            class="topbar-action-btn"
            style="display:none;"
        >
            Action
        </button>

        <div
            id="topbarUserBox"
            class="topbar-user-box"
            onclick="typeof logout==='function' && logout()"
        >

            <img
                src="/CM_Pro/assets/images/profile.jpg"
                class="topbar-profile"
                id="topbarProfile"
                alt="Profile"
            >

            <div
                id="topbarUserName"
                class="topbar-user-name"
            >
                User
            </div>

        </div>

    </div>

</div>
