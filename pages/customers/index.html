<!DOCTYPE html>
<html>

<head>

    <title>Customers - CM_Pro</title>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/main.css"
    >

</head>

<body>

    <!-- Topbar -->
    <div id="topbar-container"></div>

    <!-- Page -->
    <div class="dashboard-container">

        <h1
            style="
                color:white;
                margin-bottom:20px;
            "
        >
            Customer Search
        </h1>

        <div
            style="
                background:white;
                border-radius:20px;
                padding:20px;
            "
        >

            Customer module ready.

        </div>

    </div>

    <!-- Bottom Nav -->
    <div id="bottomnav-container"></div>

    <script>

        async function loadComponent(id, file){

            const response = await fetch(file);

            const html = await response.text();

            document.getElementById(id).innerHTML = html;
        }

        loadComponent(
            "topbar-container",
            "../../components/topbar.html"
        );

        loadComponent(
            "bottomnav-container",
            "../../components/bottomnav.html"
        );

    </script>

</body>

</html>
