<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Customer Search</title>

<meta
name="theme-color"
content="#0e1b3c">

<!-- Applied before any CSS loads, so there's no flash of the wrong
     theme on page load. Keep this as the very first thing in <head>. -->
<script>
  document.documentElement.setAttribute(
    "data-theme",
    (function(){var t=localStorage.getItem("cm_theme")||"auto";return t==="auto"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;})()
  );
</script>

<link
rel="stylesheet"
href="../../assets/css/main.css">

<link
rel="stylesheet"
href="../../assets/css/customers.css">

<link
rel="stylesheet"
href="/CM_Pro/assets/css/global-splash.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/toast.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/loading.css">

<!-- Hold the first paint until the whole page is parsed (its scripts,
     translations and header), so a page transition slides in a finished
     page instead of one still filling itself in. No element has this id:
     the hold simply ends when parsing does. -->
<link rel="expect" href="#cm-pt-parsed" blocking="render">
<link rel="preload" href="/CM_Pro/assets/fonts/Krasar-Regular.ttf" as="font" type="font/ttf" crossorigin>
<script src="/CM_Pro/shared/page-transition.js"></script>
<script src="/CM_Pro/shared/sw-register.js"></script>
</head>

<body>

<!-- ========================= -->
<!-- OFFLINE -->
<!-- ========================= -->

<div id="offlineBanner" data-i18n="common.offline">

No Internet Connection

</div>

<!-- ========================= -->
<!-- CONFIG -->
<!-- ========================= -->

<script src="../../config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>

<script src="../../config/auth.js"></script>

<script src="../../config/session.js"></script>

<!-- ========================= -->
<!-- COMPONENT -->
<!-- ========================= -->

<script src="/CM_Pro/shared/topbar.js"></script>

<script src="/CM_Pro/shared/theme.js"></script>

<script src="/CM_Pro/shared/language.js"></script>

<script src="/CM_Pro/shared/i18n.js"></script>

<script src="/CM_Pro/shared/i18n/common.js"></script>

<script src="/CM_Pro/shared/i18n/core.js"></script>

<script src="/CM_Pro/shared/i18n/features.js"></script>

<script src="/CM_Pro/shared/loading.js"></script>

<script src="/CM_Pro/assets/js/global-splash.js"></script>

<script src="/CM_Pro/assets/js/toast.js"></script>

<!-- ========================= -->
<!-- TOPBAR -->
<!-- ========================= -->

<div id="topbar-container"></div>

<!-- ========================= -->
<!-- PAGE -->
<!-- ========================= -->

<div class="page-container">

<!-- SEARCH -->

<div class="cst-search-card">

<label for="inputKeyword" class="cst-search-label" data-i18n="customers.keywordLabel">Input Keyword</label>

<div class="cst-search-row">

<div class="cst-search-field">

<span class="ui-ico ui-ico-search cst-search-ico" aria-hidden="true"></span>

<input
type="search"
id="inputKeyword"
placeholder="CIF, Name, Phone..."
data-i18n-placeholder="customers.keywordPlaceholder"
autocomplete="off"
enterkeyhint="search"
>

<button type="button" id="btnClearKeyword" class="cst-clear-btn" aria-label="Clear" data-i18n-aria-label="customers.clearAria" hidden>
<span class="ui-ico ui-ico-close" aria-hidden="true"></span>
</button>

</div>

<button type="button" id="btnSearch" class="cst-search-btn" data-i18n="common.search">Search</button>

</div>

<div class="cst-search-hint" data-i18n="customers.searchHint">Searches Outstanding, Payroll and Write-off data</div>

</div>

<!-- RESULTS TOOLBAR (card / list toggle — same pattern as Spot Check) -->

<div class="cst-toolbar" id="cstToolbar" hidden>

<div class="cst-result-count">
<span data-i18n="customers.resultLabel">Result</span>
<span id="resultCount" class="cst-result-value">0</span>
</div>

<div class="cst-view-toggle">

<button type="button" class="cst-view-btn" id="cstViewCardBtn" data-view="card" aria-label="Card view" data-i18n-aria-label="customers.viewCardAria">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
</button>

<button type="button" class="cst-view-btn" id="cstViewListBtn" data-view="list" aria-label="List view" data-i18n-aria-label="customers.viewListAria">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
</button>

</div>

</div>

<!-- RESULTS -->

<div id="cstResults" class="cst-results"></div>

<!-- STATES -->

<div id="cstStateStart" class="cst-state">
<div class="cst-state-ico"><span class="ui-ico ui-ico-search" aria-hidden="true"></span></div>
<div class="cst-state-title" data-i18n="customers.startTitle">Search for a customer</div>
<div class="cst-state-text" data-i18n="customers.startText">Enter a CIF, name or phone number</div>
</div>

<div id="cstStateEmpty" class="cst-state" hidden>
<div class="cst-state-ico"><span class="ui-ico ui-ico-users" aria-hidden="true"></span></div>
<div class="cst-state-title" data-i18n="customers.noResultTitle">No customer found</div>
<div class="cst-state-text" data-i18n="customers.noResultText">Check the keyword and try again</div>
</div>

<div id="cstStateError" class="cst-state" hidden>
<div class="cst-state-ico cst-state-ico-error"><span class="ui-ico ui-ico-alert" aria-hidden="true"></span></div>
<div class="cst-state-title" data-i18n="customers.errorTitle">Search failed</div>
<div class="cst-state-text" data-i18n="customers.errorText">Check your internet connection and try again</div>
<button type="button" id="btnRetrySearch" class="cst-retry-btn" data-i18n="common.retry">Retry</button>
</div>

</div>

<!-- ========================= -->
<!-- CUSTOMER DETAIL SHEET -->
<!-- ========================= -->

<div id="cstSheet" class="cst-sheet" aria-hidden="true">

<div class="cst-sheet-backdrop" data-close></div>

<div class="cst-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="cstSheetName">

<div class="cst-sheet-handle"></div>

<div class="cst-sheet-head">

<div class="cst-sheet-head-text">
<span id="cstSheetSource" class="cst-source"></span>
<div id="cstSheetName" class="cst-sheet-name"></div>
<div id="cstSheetEngName" class="cst-sheet-eng"></div>
</div>

<button type="button" class="cst-sheet-close" data-close aria-label="Close" data-i18n-aria-label="common.close">
<span class="ui-ico ui-ico-close" aria-hidden="true"></span>
</button>

</div>

<div class="cst-sheet-balance">
<span data-i18n="customers.colBalance">Balance</span>
<strong id="cstSheetBalance"></strong>
</div>

<div id="cstSheetRows" class="cst-sheet-rows"></div>

</div>

</div>

<!-- ========================= -->
<!-- BOTTOM -->
<!-- ========================= -->

<div id="bottomnav-container"></div>

<!-- NOTIFICATION BADGE -->

<script src="/CM_Pro/assets/js/notification-badge.js"></script>

<!-- CUSTOMER SEARCH LOGIC -->

<script src="../../assets/js/customers.js"></script>

<!-- PAGE LOADER (component loader, offline, notification badge) -->

<script src="../../assets/js/customers-loader.js"></script>

</body>

</html>
