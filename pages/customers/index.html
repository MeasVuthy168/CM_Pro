<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Customer Search</title>

<meta
name="theme-color"
content="#032d73">

<!-- Applied before any CSS loads, so there's no flash of the wrong
     theme on page load. Keep this as the very first thing in <head>. -->
<script>
  document.documentElement.setAttribute(
    "data-theme",
    (function(){var t=localStorage.getItem("cm_theme")||"auto";return t==="auto"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;})()
  );
</script>

<link
rel="stylesheet"
href="../../assets/css/main.css">

<link
rel="stylesheet"
href="../../assets/css/customers.css">

<link
rel="stylesheet"
href="/CM_Pro/assets/css/global-splash.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/toast.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/loading.css">

</head>

<body>

<!-- ========================= -->
<!-- OFFLINE -->
<!-- ========================= -->

<div id="offlineBanner" data-i18n="common.offline">

⚠️ No Internet Connection

</div>

<!-- ========================= -->
<!-- CONFIG -->
<!-- ========================= -->

<script src="../../config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>

<script src="../../config/auth.js"></script>

<script src="../../config/session.js"></script>

<!-- ========================= -->
<!-- COMPONENT -->
<!-- ========================= -->

<script src="/CM_Pro/shared/topbar.js"></script>

<script src="/CM_Pro/shared/theme.js"></script>

<script src="/CM_Pro/shared/language.js"></script>

<script src="/CM_Pro/shared/i18n.js"></script>

<script src="/CM_Pro/shared/i18n/common.js"></script>

<script src="/CM_Pro/shared/i18n/core.js"></script>

<script src="/CM_Pro/shared/i18n/features.js"></script>

<script src="/CM_Pro/shared/loading.js"></script>

<script src="/CM_Pro/assets/js/global-splash.js"></script>

<script src="/CM_Pro/assets/js/toast.js"></script>

<!-- ========================= -->
<!-- TOPBAR -->
<!-- ========================= -->

<div id="topbar-container"></div>

<!-- ========================= -->
<!-- PAGE -->
<!-- ========================= -->

<div class="page-container">

<div class="form-card">

<div class="form-group">

<label for="inputKeyword" data-i18n="customers.keywordLabel">

Input Keyword

</label>

<input

type="text"

id="inputKeyword"

placeholder="CIF, Name, Phone..."

data-i18n-placeholder="customers.keywordPlaceholder"

autocomplete="off"

>

</div>

<div class="button-row">

<button id="btnSearch" data-i18n="common.search">

Search

</button>

</div>

<div class="result-row">

<span class="result-label" data-i18n="customers.resultLabel">Result</span>

<span id="resultCount" class="result-value">0</span>

</div>

</div>

<!-- ========================= -->
<!-- CUSTOMER INFORMATION -->
<!-- ========================= -->

<div id="infoCard" class="info-card">

<div class="info-title" data-i18n="customers.infoTitle">

Customer Information

</div>

<div class="info-row">

<div class="info-label">CIF</div>

<div id="infoCIF" class="info-value">-</div>

</div>

<div class="info-row">

<div class="info-label" data-i18n="customers.khNameLabel">Khmer Name</div>

<div id="infoKhName" class="info-value">-</div>

</div>

<div class="info-row">

<div class="info-label" data-i18n="customers.dobLabel">DOB</div>

<div id="infoDOB" class="info-value">-</div>

</div>

<div class="info-row">

<div class="info-label" data-i18n="customers.legalIdLabel">Legal ID</div>

<div id="infoLegalID" class="info-value">-</div>

</div>

<div class="info-row">

<div class="info-label" data-i18n="customers.telephoneLabel">Telephone</div>

<div id="infoTelephone" class="info-value">-</div>

</div>

<div class="info-row">

<div class="info-label" data-i18n="customers.addressLabel">Address</div>

<div id="infoAddress" class="info-value">-</div>

</div>

<div class="info-row">

<div class="info-label" data-i18n="customers.coBorrowerLabel">Co-Borrower</div>

<div id="infoCoBorrower" class="info-value">-</div>

</div>

</div>

<!-- ========================= -->
<!-- TABLE -->
<!-- ========================= -->

<div class="table-card">

<div class="table-scroll">

<table id="customerTable">

<thead>

<tr>

<th data-i18n="customers.colSource">Source</th>
<th>CIF</th>
<th data-i18n="customers.colEnglishName">English Name</th>
<th data-i18n="customers.khNameLabel">Khmer Name</th>
<th data-i18n="customers.dobLabel">DOB</th>
<th data-i18n="customers.legalIdLabel">Legal ID</th>
<th data-i18n="customers.colBalance">Balance</th>
<th data-i18n="customers.telephoneLabel">Telephone</th>
<th data-i18n="customers.addressLabel">Address</th>
<th data-i18n="customers.coBorrowerLabel">Co-Borrower</th>

</tr>

</thead>

<tbody id="tbodyCustomers">

<tr class="row-empty">

<td colspan="10" data-i18n="customers.pleaseSearch">

Please search

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

<!-- ========================= -->
<!-- BOTTOM -->
<!-- ========================= -->

<div id="bottomnav-container"></div>

<!-- NOTIFICATION BADGE -->

<script src="/CM_Pro/assets/js/notification-badge.js"></script>

<!-- CUSTOMER SEARCH LOGIC -->

<script src="../../assets/js/customers.js"></script>

<!-- PAGE LOADER (component loader, offline, notification badge) -->

<script src="../../assets/js/customers-loader.js"></script>

</body>

</html>
