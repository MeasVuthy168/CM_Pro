<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>List Officer</title>

<meta
name="theme-color"
content="#0e1b3c">

<script>
  document.documentElement.setAttribute(
    "data-theme",
    (function(){var t=localStorage.getItem("cm_theme")||"auto";return t==="auto"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;})()
  );
</script>

<link
rel="stylesheet"
href="../../assets/css/main.css">

<link
rel="stylesheet"
href="../../assets/css/masterdata/masterdata.css">

<link
rel="stylesheet"
href="../../assets/css/masterdata/officer.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/global-splash.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/toast.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/loading.css">

<!-- Hold the first paint until the whole page is parsed (its scripts,
     translations and header), so a page transition slides in a finished
     page instead of one still filling itself in. No element has this id:
     the hold simply ends when parsing does. -->
<link rel="expect" href="#cm-pt-parsed" blocking="render">
<link rel="preload" href="/CM_Pro/assets/fonts/Krasar-Regular.ttf" as="font" type="font/ttf" crossorigin>
<script src="/CM_Pro/shared/page-transition.js"></script>
</head>

<body>

<div id="offlineBanner" data-i18n="common.offline">
No Internet Connection
</div>

<div id="topbar-container"></div>

<div class="page-container">

<!-- Summary tiles double as quick filters (tap again to clear). -->
<div class="md-summary-row" id="mdSummaryRow">
<button type="button" class="md-summary-tile" data-quick="all">
<div class="md-summary-value" id="mdSummaryTotal">0</div>
<div class="md-summary-label" data-i18n="masterdata.officer.summaryTotal">Total Officer</div>
</button>
<button type="button" class="md-summary-tile" data-quick="co">
<div class="md-summary-value" id="mdSummaryCO">0</div>
<div class="md-summary-label" data-i18n="masterdata.officer.summaryCO">CO</div>
</button>
<button type="button" class="md-summary-tile" data-quick="fsro">
<div class="md-summary-value" id="mdSummaryFSRO">0</div>
<div class="md-summary-label" data-i18n="masterdata.officer.summaryFSRO">FSRO</div>
</button>
</div>

<div class="md-toolbar">
<div class="md-search-wrap">
<svg class="md-search-ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
<input type="search" id="mdSearchInput" class="md-search-input" autocomplete="off" enterkeyhint="search" data-i18n-placeholder="masterdata.officer.searchPlaceholder" placeholder="Search ID, name, phone, position...">
<button type="button" id="mdSearchClear" class="md-search-clear" data-i18n-aria-label="masterdata.officer.clearSearch" aria-label="Clear search" hidden>&times;</button>
</div>

<div class="md-tool-row">
<button type="button" class="md-tool-btn" id="mdFilterBtn">
<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
<span data-i18n="masterdata.officer.filter">Filter</span>
<span class="md-tool-count" id="mdFilterCount" hidden>0</span>
</button>
<button type="button" class="md-tool-btn" id="mdSortBtn">
<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg>
<span id="mdSortLabel">Name (A-Z)</span>
</button>
<div class="md-view-toggle" id="mdViewToggle">
<button type="button" class="md-view-btn" id="mdViewCardBtn" data-view="card" data-i18n-aria-label="masterdata.officer.viewCard" aria-label="Card view">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
</button>
<button type="button" class="md-view-btn" id="mdViewListBtn" data-view="list" data-i18n-aria-label="masterdata.officer.viewList" aria-label="List view">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
</button>
</div>
</div>

<!-- Active filters as removable chips + result count -->
<div class="md-chips" id="mdChips"></div>
<div class="md-result-row">
<span class="md-result-count" id="mdResultCount"></span>
<button type="button" id="mdClearFilterBtn" class="md-link-btn" hidden data-i18n="masterdata.officer.clearAll">Clear all</button>
</div>
</div>

<div class="md-add-row" id="mdAddRow" style="display:none">
<button type="button" class="md-add-btn" id="btnMdAdd">
<span class="ui-ico ui-ico-plus" aria-hidden="true"></span> <span data-i18n="masterdata.officer.addBtn">Add Officer</span>
</button>
</div>

<div class="md-list" id="mdList">
<div class="md-empty" id="mdEmpty" data-i18n="common.loading">Loading...</div>
</div>

</div>

<div id="bottomnav-container"></div>

<!-- ⋮ menu (moved into the topbar once it loads) -->
<div id="mdMenuWrap" class="md-menu-wrap">
<button type="button" id="mdMenuBtn" class="md-menu-toggle" aria-label="More actions" data-i18n-aria-label="masterdata.officer.moreActions" aria-haspopup="true" aria-expanded="false">⋮</button>
<div id="mdMenu" class="md-menu" role="menu">
<button type="button" role="menuitem" id="mdExportExcel"><img src="/CM_Pro/assets/icons/arrear/export_excel.png" alt="" class="md-menu-icon"><span data-i18n="masterdata.officer.exportExcel">Export Excel</span></button>
<button type="button" role="menuitem" id="mdExportPdf"><img src="/CM_Pro/assets/icons/arrear/export_pdf.png" alt="" class="md-menu-icon"><span data-i18n="masterdata.officer.exportPdf">Export PDF</span></button>
</div>
</div>

<!-- Filter sheet -->
<div id="mdFilterSheet" class="md-sheet-dim" hidden>
<div class="md-sheet" role="dialog" aria-modal="true" aria-labelledby="mdFilterTitle">
<div class="md-sheet-grab"></div>
<div class="md-sheet-head">
<div class="md-sheet-title" id="mdFilterTitle" data-i18n="masterdata.officer.filter">Filter</div>
<button type="button" class="md-sheet-close" data-close aria-label="Close">&times;</button>
</div>

<div class="md-sheet-label" data-i18n="masterdata.officer.status">Status</div>
<div class="md-seg" id="mdFilterStatus">
<button type="button" data-value="" data-i18n="masterdata.officer.statusAll">All</button>
<button type="button" data-value="active" data-i18n="masterdata.officer.statusActive">Active</button>
<button type="button" data-value="stop" data-i18n="masterdata.officer.statusStop">Stop Disburse</button>
</div>

<label class="md-sheet-label" for="mdFilterPosition" data-i18n="masterdata.officer.colPosition">Position</label>
<select id="mdFilterPosition" class="md-filter-select"></select>

<label class="md-sheet-label" for="mdFilterTeam" data-i18n="masterdata.officer.colTeam">Team</label>
<select id="mdFilterTeam" class="md-filter-select"></select>

<label class="md-sheet-label" for="mdFilterBranch" data-i18n="masterdata.officer.colBranch">Branch</label>
<select id="mdFilterBranch" class="md-filter-select"></select>

<div class="md-sheet-buttons">
<button type="button" class="md-btn-cancel" id="mdFilterReset" data-i18n="masterdata.officer.reset">Reset</button>
<button type="button" class="md-btn-save" id="mdFilterApply" data-i18n="masterdata.officer.showResults">Show results</button>
</div>
</div>
</div>

<!-- Sort sheet -->
<div id="mdSortSheet" class="md-sheet-dim" hidden>
<div class="md-sheet" role="dialog" aria-modal="true" aria-labelledby="mdSortTitle">
<div class="md-sheet-grab"></div>
<div class="md-sheet-head">
<div class="md-sheet-title" id="mdSortTitle" data-i18n="masterdata.officer.sortBy">Sort by</div>
<button type="button" class="md-sheet-close" data-close aria-label="Close">&times;</button>
</div>
<div class="md-sort-list" id="mdSortList"></div>
</div>
</div>

<!-- Add/Edit dialog -->
<div id="mdOfficerDialog" class="md-dialog">
<div class="md-dialog-box">
<div class="md-dialog-title" id="mdDialogTitle" data-i18n="masterdata.officer.modalAddTitle">Add Officer</div>

<label class="md-field-label" data-i18n="masterdata.officer.fieldId">Officer ID</label>
<input type="text" id="mdFieldId" class="md-field-input">

<label class="md-field-label" data-i18n="masterdata.officer.fieldName">Name</label>
<input type="text" id="mdFieldName" class="md-field-input">

<label class="md-field-label" data-i18n="masterdata.officer.fieldNameKh">Khmer Name</label>
<input type="text" id="mdFieldNameKh" class="md-field-input">

<label class="md-field-label" data-i18n="masterdata.officer.fieldPosition">Position</label>
<select id="mdFieldPosition" class="md-field-select">
<option value=""></option>
<option value='Branch Manager "A"'>Branch Manager "A"</option>
<option value='Branch Manager "B"'>Branch Manager "B"</option>
<option value='Branch Manager "C"'>Branch Manager "C"</option>
<option value='Branch Credit Manager "A"'>Branch Credit Manager "A"</option>
<option value='Branch Credit Manager "B"'>Branch Credit Manager "B"</option>
<option value='Assistant Branch Credit Manager "A"'>Assistant Branch Credit Manager "A"</option>
<option value='Financial Service Relation Manager "A"'>Financial Service Relation Manager "A"</option>
<option value='Financial Service Relation Manager "B"'>Financial Service Relation Manager "B"</option>
<option value='Financial Service Relation Manager "C"'>Financial Service Relation Manager "C"</option>
<option value="Credit Officer">Credit Officer</option>
<option value="Financial Service Relation Officer">Financial Service Relation Officer</option>
<option value="Loan Recovery Officer">Loan Recovery Officer</option>
</select>

<label class="md-field-label" data-i18n="masterdata.officer.fieldPhone">Phone Number</label>
<input type="tel" id="mdFieldPhone" class="md-field-input">

<label class="md-field-label" data-i18n="masterdata.officer.fieldTeam">Team</label>
<select id="mdFieldTeam" class="md-field-select">
<option value=""></option>
<option value="FSRO">FSRO</option>
<option value="Meas Vuthy">Meas Vuthy</option>
<option value="Sok Danel">Sok Danel</option>
<option value="Soum ChanSereyVoan">Soum ChanSereyVoan</option>
<option value="Theum Dany">Theum Dany</option>
<option value="admin">admin</option>
</select>

<label class="md-field-label" data-i18n="masterdata.officer.fieldBranch">Branch</label>
<select id="mdFieldBranch" class="md-field-select">
<option value=""></option>
<option value="Kraol Kou">Kraol Kou</option>
<option value="Nhor">Nhor</option>
<option value="Romeas Haek">Romeas Haek</option>
<option value="Rumduol">Rumduol</option>
<option value="Svay Chrom">Svay Chrom</option>
<option value="Svay Rieng">Svay Rieng</option>
<option value="Svay Teab">Svay Teab</option>
<option value="Stop Disburse">Stop Disburse</option>
</select>

<div class="md-dialog-buttons">
<button type="button" class="md-btn-save" id="btnMdSave" data-i18n="masterdata.officer.save">Save</button>
<button type="button" class="md-btn-cancel" id="btnMdCancel" data-i18n="masterdata.officer.cancel">Cancel</button>
</div>
</div>
</div>

<!-- Delete confirm dialog -->
<div id="mdDeleteDialog" class="md-dialog">
<div class="md-dialog-box">
<div class="md-dialog-title" data-i18n="masterdata.officer.deleteConfirmTitle">Delete this officer?</div>
<div class="md-dialog-body-text" id="mdDeleteBody"></div>
<div class="md-dialog-buttons">
<button type="button" class="md-btn-delete" id="btnMdConfirmDelete" data-i18n="masterdata.officer.confirmDelete">Delete</button>
<button type="button" class="md-btn-cancel" id="btnMdCancelDelete" data-i18n="masterdata.officer.cancel">Cancel</button>
</div>
</div>
</div>

<script src="../../config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>
<script src="../../config/auth.js"></script>
<script src="../../config/session.js"></script>

<script src="/CM_Pro/shared/topbar.js"></script>
<script src="/CM_Pro/shared/theme.js"></script>
<script src="/CM_Pro/shared/language.js"></script>
<script src="/CM_Pro/shared/i18n.js"></script>
<script src="/CM_Pro/shared/i18n/common.js"></script>
<script src="/CM_Pro/shared/i18n/core.js"></script>
<script src="/CM_Pro/shared/i18n/masterdata.js"></script>
<script src="/CM_Pro/shared/loading.js"></script>
<script src="/CM_Pro/assets/js/global-splash.js"></script>
<script src="/CM_Pro/assets/js/toast.js"></script>
<script src="/CM_Pro/assets/js/notification-badge.js"></script>

<script src="../../assets/js/masterdata/officer.js"></script>

</body>

</html>
