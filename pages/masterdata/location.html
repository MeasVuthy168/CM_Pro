<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>List Location</title>

<meta
name="theme-color"
content="#0e1b3c">

<script>
  document.documentElement.setAttribute(
    "data-theme",
    (function(){var t=localStorage.getItem("cm_theme")||"auto";return t==="auto"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;})()
  );
</script>

<link
rel="stylesheet"
href="../../assets/css/main.css">

<link
rel="stylesheet"
href="../../assets/css/masterdata/masterdata.css">

<link
rel="stylesheet"
href="../../assets/css/masterdata/location.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/global-splash.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/toast.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/loading.css">

<!-- Hold the first paint until the whole page is parsed (its scripts,
     translations and header), so a page transition slides in a finished
     page instead of one still filling itself in. No element has this id:
     the hold simply ends when parsing does. -->
<link rel="expect" href="#cm-pt-parsed" blocking="render">
<link rel="preload" href="/CM_Pro/assets/fonts/Krasar-Regular.ttf" as="font" type="font/ttf" crossorigin>
<script src="/CM_Pro/shared/page-transition.js"></script>
<script src="/CM_Pro/shared/sw-register.js"></script>
</head>

<body>

<div id="offlineBanner" data-i18n="common.offline">
No Internet Connection
</div>

<div id="topbar-container"></div>

<div class="page-container">

<div class="md-summary-row md-summary-4" id="mdSummaryRow">
<div class="md-summary-tile">
<div class="md-summary-value" id="mdSummaryTotal">0</div>
<div class="md-summary-label" data-i18n="masterdata.location.summaryTotal">Locations</div>
</div>
<div class="md-summary-tile">
<div class="md-summary-value" id="mdSummaryDistricts">0</div>
<div class="md-summary-label" data-i18n="masterdata.location.summaryDistricts">Districts</div>
</div>
<div class="md-summary-tile">
<div class="md-summary-value" id="mdSummaryCommunes">0</div>
<div class="md-summary-label" data-i18n="masterdata.location.summaryCommunes">Communes</div>
</div>
<div class="md-summary-tile">
<div class="md-summary-value" id="mdSummaryFamily">0</div>
<div class="md-summary-label" data-i18n="masterdata.location.summaryFamily">Families</div>
</div>
</div>

<div class="md-toolbar">
<div class="md-search-wrap">
<svg class="md-search-ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
<input type="search" id="mdSearchInput" class="md-search-input" autocomplete="off" enterkeyhint="search" data-i18n-placeholder="masterdata.location.searchPlaceholder" placeholder="Search village, commune, district, officer...">
<button type="button" id="mdSearchClear" class="md-search-clear" data-i18n-aria-label="masterdata.location.clearSearch" aria-label="Clear search" hidden>&times;</button>
</div>

<div class="md-tool-row">
<button type="button" class="md-tool-btn" id="mdFilterBtn">
<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
<span data-i18n="masterdata.location.filter">Filter</span>
<span class="md-tool-count" id="mdFilterCount" hidden>0</span>
</button>
<button type="button" class="md-tool-btn" id="mdSortBtn">
<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg>
<span id="mdSortLabel">District (A-Z)</span>
</button>
<div class="md-view-toggle" id="mdViewToggle">
<button type="button" class="md-view-btn" id="mdViewCardBtn" data-view="card" data-i18n-aria-label="masterdata.location.viewCard" aria-label="Card view">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
</button>
<button type="button" class="md-view-btn" id="mdViewListBtn" data-view="list" data-i18n-aria-label="masterdata.location.viewList" aria-label="List view">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
</button>
</div>
</div>

<div class="md-chips" id="mdChips"></div>
<div class="md-result-row">
<span class="md-result-count" id="mdResultCount"></span>
<button type="button" id="mdClearFilterBtn" class="md-link-btn" hidden data-i18n="masterdata.location.clearAll">Clear all</button>
</div>
</div>

<div class="md-add-row" id="mdAddRow" style="display:none">
<button type="button" class="md-add-btn" id="btnMdAdd">
<span class="ui-ico ui-ico-plus" aria-hidden="true"></span> <span data-i18n="masterdata.location.addBtn">Add Location</span>
</button>
</div>

<div class="md-list" id="mdList">
<div class="md-empty" id="mdEmpty" data-i18n="common.loading">Loading...</div>
</div>

</div>

<div id="bottomnav-container"></div>

<!-- ⋮ menu (moved into the topbar once it loads) -->
<div id="mdMenuWrap" class="md-menu-wrap">
<button type="button" id="mdMenuBtn" class="md-menu-toggle" aria-label="More actions" data-i18n-aria-label="masterdata.location.moreActions" aria-haspopup="true" aria-expanded="false">⋮</button>
<div id="mdMenu" class="md-menu" role="menu">
<button type="button" role="menuitem" id="mdExportExcel"><img src="/CM_Pro/assets/icons/arrear/export_excel.png" alt="" class="md-menu-icon"><span data-i18n="masterdata.location.exportExcel">Export Excel</span></button>
<button type="button" role="menuitem" id="mdExportPdf"><img src="/CM_Pro/assets/icons/arrear/export_pdf.png" alt="" class="md-menu-icon"><span data-i18n="masterdata.location.exportPdf">Export PDF</span></button>
</div>
</div>

<!-- Filter sheet -->
<div id="mdFilterSheet" class="md-sheet-dim" hidden>
<div class="md-sheet" role="dialog" aria-modal="true" aria-labelledby="mdFilterTitle">
<div class="md-sheet-grab"></div>
<div class="md-sheet-head">
<div class="md-sheet-title" id="mdFilterTitle" data-i18n="masterdata.location.filter">Filter</div>
<button type="button" class="md-sheet-close" data-close aria-label="Close">&times;</button>
</div>
<label class="md-sheet-label" for="mdFilterDistrict" data-i18n="masterdata.location.colDistrict">District</label>
<select id="mdFilterDistrict" class="md-filter-select"></select>
<label class="md-sheet-label" for="mdFilterCommune" data-i18n="masterdata.location.colCommune">Commune</label>
<select id="mdFilterCommune" class="md-filter-select"></select>
<label class="md-sheet-label" for="mdFilterBranch" data-i18n="masterdata.location.colBranch">Branch</label>
<select id="mdFilterBranch" class="md-filter-select"></select>
<label class="md-sheet-label" for="mdFilterOfficer" data-i18n="masterdata.location.colOfficer">Credit Officer</label>
<select id="mdFilterOfficer" class="md-filter-select"></select>
<div class="md-sheet-buttons">
<button type="button" class="md-btn-cancel" id="mdFilterReset" data-i18n="masterdata.location.reset">Reset</button>
<button type="button" class="md-btn-save" id="mdFilterApply" data-i18n="masterdata.location.showResults">Show results</button>
</div>
</div>
</div>

<!-- Sort sheet -->
<div id="mdSortSheet" class="md-sheet-dim" hidden>
<div class="md-sheet" role="dialog" aria-modal="true" aria-labelledby="mdSortTitle">
<div class="md-sheet-grab"></div>
<div class="md-sheet-head">
<div class="md-sheet-title" id="mdSortTitle" data-i18n="masterdata.location.sortBy">Sort by</div>
<button type="button" class="md-sheet-close" data-close aria-label="Close">&times;</button>
</div>
<div class="md-sort-list" id="mdSortList"></div>
</div>
</div>

<!-- Add/Edit dialog -->
<div id="mdLocationDialog" class="md-dialog">
<div class="md-dialog-box">
<div class="md-dialog-title" id="mdDialogTitle" data-i18n="masterdata.location.modalAddTitle">Add Location</div>

<label class="md-field-label" data-i18n="masterdata.location.fieldDistrict">District</label>
<input type="text" id="mdFieldDistrict" class="md-field-input">

<label class="md-field-label" data-i18n="masterdata.location.fieldCommune">Commune</label>
<input type="text" id="mdFieldCommune" class="md-field-input">

<label class="md-field-label" data-i18n="masterdata.location.fieldVillage">Village</label>
<input type="text" id="mdFieldVillage" class="md-field-input">

<label class="md-field-label" data-i18n="masterdata.location.fieldFamily"># Family</label>
<input type="number" id="mdFieldFamily" class="md-field-input" min="0">

<label class="md-field-label" data-i18n="masterdata.location.fieldBranch">Branch</label>
<select id="mdFieldBranch" class="md-field-select">
<option value=""></option>
<option value="Kraol Kou">Kraol Kou</option>
<option value="Nhor">Nhor</option>
<option value="Romeas Haek">Romeas Haek</option>
<option value="Rumduol">Rumduol</option>
<option value="Svay Chrom">Svay Chrom</option>
<option value="Svay Rieng">Svay Rieng</option>
<option value="Svay Teab">Svay Teab</option>
</select>

<label class="md-field-label" data-i18n="masterdata.location.fieldOfficer">Credit Officer</label>
<input type="text" id="mdFieldOfficer" class="md-field-input">

<div class="md-dialog-buttons">
<button type="button" class="md-btn-save" id="btnMdSave" data-i18n="masterdata.location.save">Save</button>
<button type="button" class="md-btn-cancel" id="btnMdCancel" data-i18n="masterdata.location.cancel">Cancel</button>
</div>
</div>
</div>

<!-- Delete confirm dialog -->
<div id="mdDeleteDialog" class="md-dialog">
<div class="md-dialog-box">
<div class="md-dialog-title" data-i18n="masterdata.location.deleteConfirmTitle">Delete this location?</div>
<div class="md-dialog-body-text" id="mdDeleteBody"></div>
<div class="md-dialog-buttons">
<button type="button" class="md-btn-delete" id="btnMdConfirmDelete" data-i18n="masterdata.location.confirmDelete">Delete</button>
<button type="button" class="md-btn-cancel" id="btnMdCancelDelete" data-i18n="masterdata.location.cancel">Cancel</button>
</div>
</div>
</div>

<script src="../../config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>
<script src="../../config/auth.js"></script>
<script src="../../config/session.js"></script>

<script src="/CM_Pro/shared/topbar.js"></script>
<script src="/CM_Pro/shared/theme.js"></script>
<script src="/CM_Pro/shared/language.js"></script>
<script src="/CM_Pro/shared/i18n.js"></script>
<script src="/CM_Pro/shared/i18n/common.js"></script>
<script src="/CM_Pro/shared/i18n/core.js"></script>
<script src="/CM_Pro/shared/i18n/masterdata.js"></script>
<script src="/CM_Pro/shared/loading.js"></script>
<script src="/CM_Pro/assets/js/global-splash.js"></script>
<script src="/CM_Pro/assets/js/toast.js"></script>
<script src="/CM_Pro/assets/js/notification-badge.js"></script>

<script src="../../assets/js/masterdata/location.js"></script>

</body>

</html>
