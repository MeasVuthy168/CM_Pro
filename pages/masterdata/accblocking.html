<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Account Blocking</title>

<meta
name="theme-color"
content="#0e1b3c">

<script>
  document.documentElement.setAttribute(
    "data-theme",
    (function(){var t=localStorage.getItem("cm_theme")||"auto";return t==="auto"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;})()
  );
</script>

<link
rel="stylesheet"
href="../../assets/css/main.css">

<link
rel="stylesheet"
href="../../assets/css/masterdata/masterdata.css">

<link
rel="stylesheet"
href="../../assets/css/masterdata/accblocking.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/global-splash.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/toast.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/loading.css">

<!-- Hold the first paint until the whole page is parsed (its scripts,
     translations and header), so a page transition slides in a finished
     page instead of one still filling itself in. No element has this id:
     the hold simply ends when parsing does. -->
<link rel="expect" href="#cm-pt-parsed" blocking="render">
<link rel="preload" href="/CM_Pro/assets/fonts/Krasar-Regular.ttf" as="font" type="font/ttf" crossorigin>
<script src="/CM_Pro/shared/page-transition.js"></script>
<script src="/CM_Pro/shared/sw-register.js"></script>
</head>

<body>

<div id="offlineBanner" data-i18n="common.offline">
No Internet Connection
</div>

<div id="topbar-container"></div>

<div class="page-container ab-page">

<!-- Summary: whose list, for which day, and how many rows per action -->
<section class="ab-hero">
  <div class="ab-hero-top">
    <span class="ab-hero-ico"><span class="ui-ico ui-ico-idcard" aria-hidden="true"></span></span>
    <div class="ab-hero-text">
      <div class="ab-hero-title" data-i18n="masterdata.ab.heroTitle">List Account Blocking</div>
      <div class="ab-hero-sub" id="abHeroSub">-</div>
    </div>
    <label class="ab-day" title="Date" data-i18n-title="masterdata.ab.date">
      <span class="ui-ico ui-ico-calendar" aria-hidden="true"></span>
      <span id="abDateText">-</span>
      <input type="date" id="abDate" aria-label="Date" data-i18n-aria-label="masterdata.ab.date">
    </label>
  </div>
  <div class="ab-counts" id="abCounts"></div>
</section>

<!-- Add CIFs (Admin / User / Managers) -->
<section class="ab-add" id="abAdd" hidden>
  <label class="ab-add-label" for="abCifs" data-i18n="masterdata.ab.cifLabel">CIF</label>
  <textarea id="abCifs" rows="2" inputmode="numeric" autocomplete="off" placeholder="4275295, 100200 ..." data-i18n-placeholder="masterdata.ab.cifPlaceholder"></textarea>
  <div class="ab-actions" id="abAddActions" role="radiogroup" aria-label="Action" data-i18n-aria-label="masterdata.ab.action"></div>
  <button type="button" class="ab-primary" id="btnAbAdd"><span class="ui-ico ui-ico-plus" aria-hidden="true"></span> <span data-i18n="masterdata.ab.add">Add to list</span></button>
</section>
<p class="ab-readonly" id="abReadOnly" hidden data-i18n="masterdata.ab.readOnly">Only Admin, User and Managers can build a blocking list.</p>

<!-- Tools: final list, export, print, clear, List Block -->
<section class="ab-tools">
  <button type="button" class="ab-tool ab-tool-main" id="btnAbFinal" data-edit><span class="ui-ico ui-ico-clipboard" aria-hidden="true"></span><span data-i18n="masterdata.ab.final">Generate Final List</span></button>
  <button type="button" class="ab-tool" id="btnAbExport"><span class="ui-ico ui-ico-copy" aria-hidden="true"></span><span data-i18n="masterdata.ab.export">Export</span></button>
  <button type="button" class="ab-tool" id="btnAbPrint"><span class="ui-ico ui-ico-eye" aria-hidden="true"></span><span data-i18n="masterdata.ab.print">Print</span></button>
  <button type="button" class="ab-tool" id="btnAbBlocked"><span class="ui-ico ui-ico-search" aria-hidden="true"></span><span data-i18n="masterdata.ab.listBlock">List Block</span></button>
  <button type="button" class="ab-tool ab-tool-danger" id="btnAbClear" data-edit><span class="ui-ico ui-ico-trash" aria-hidden="true"></span><span data-i18n="masterdata.ab.clear">Delete all</span></button>
</section>
<div class="ab-final-note" id="abFinalNote" hidden></div>

<div class="ab-list" id="abList"></div>

<!-- Long-press a row to select several, then delete them -->
<div class="ab-row-selbar" id="abRowSelBar" hidden>
  <button type="button" class="ab-sel-x" id="btnAbRowCancel" aria-label="Cancel" data-i18n-aria-label="common.cancel">×</button>
  <span class="ab-sel-n" id="abRowSelN">0</span>
  <button type="button" class="ab-sel-all" id="btnAbRowAll" data-i18n="masterdata.ab.selectAll">Select all</button>
  <button type="button" class="ab-row-del" id="btnAbRowDelete"><span class="ui-ico ui-ico-trash" aria-hidden="true"></span> <span data-i18n="common.delete">Delete</span></button>
</div>

</div>

<!-- Printable sheet (only shown when printing) -->
<div id="abPrint" class="ab-print" aria-hidden="true"></div>

<!-- Edit one row -->
<div id="abEdit" class="ab-dim" hidden>
  <div class="ab-sheet" role="dialog" aria-modal="true" aria-labelledby="abEditTitle">
    <div class="ab-sheet-head">
      <div>
        <div class="ab-sheet-title" id="abEditTitle">-</div>
        <div class="ab-sheet-sub" id="abEditSub">-</div>
      </div>
      <button type="button" class="ab-close" data-close aria-label="Close" data-i18n-aria-label="common.close">×</button>
    </div>
    <div class="ab-sheet-body">
      <div class="ab-field-label" data-i18n="masterdata.ab.action">Action</div>
      <div class="ab-actions" id="abEditActions" role="radiogroup"></div>
      <label class="ab-field"><span data-i18n="masterdata.ab.account">Account number</span><select id="abEditAcc"></select></label>
      <label class="ab-field" id="abAccManualWrap" hidden><span data-i18n="masterdata.ab.accountType">Type the account number</span><input type="text" inputmode="numeric" id="abEditAccNo" maxlength="34" autocomplete="off" placeholder="1300xxxxxxxxxx"></label>
      <label class="ab-field" id="abNameWrap" hidden><span data-i18n="masterdata.ab.nameType">Name (not found — type it)</span><input type="text" id="abEditName" maxlength="100" autocomplete="off"></label>
      <label class="ab-field" id="abFromWrap" hidden><span data-i18n="masterdata.ab.blockAmount">Blocked amount</span><input type="text" inputmode="decimal" id="abEditFrom" autocomplete="off"><small class="ab-field-hint" id="abFromHint"></small></label>
      <label class="ab-field" id="abToWrap"><span data-i18n="masterdata.ab.toAmount">New blocked amount</span><input type="text" inputmode="decimal" id="abEditTo" autocomplete="off"></label>
      <label class="ab-field"><span data-i18n="masterdata.ab.reference">Reference</span><input type="text" id="abEditRef" maxlength="100" autocomplete="off"></label>
      <div class="ab-sheet-btns">
        <button type="button" class="ab-tool ab-tool-danger" id="btnAbRemove"><span class="ui-ico ui-ico-trash" aria-hidden="true"></span><span data-i18n="common.delete">Delete</span></button>
        <button type="button" class="ab-primary" id="btnAbSave" data-i18n="common.save">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Export: Excel or PDF -->
<div id="abExport" class="ab-dim" hidden>
  <div class="ab-sheet" role="dialog" aria-modal="true" aria-labelledby="abExportTitle">
    <div class="ab-sheet-head">
      <div><div class="ab-sheet-title" id="abExportTitle" data-i18n="masterdata.ab.exportTitle">Export the list</div></div>
      <button type="button" class="ab-close" data-close aria-label="Close" data-i18n-aria-label="common.close">×</button>
    </div>
    <div class="ab-export-opts">
      <button type="button" class="ab-export-opt" data-export="xlsx"><img src="/CM_Pro/assets/icons/arrear/export_excel.png" alt=""><span><b data-i18n="masterdata.ab.exportExcel">Excel (.xlsx)</b><small data-i18n="masterdata.ab.exportExcelSub">Same layout as the PDF · numbers you can sum</small></span></button>
      <button type="button" class="ab-export-opt" data-export="pdf"><img src="/CM_Pro/assets/icons/arrear/export_pdf.png" alt=""><span><b data-i18n="masterdata.ab.exportPdf">PDF</b><small data-i18n="masterdata.ab.exportPdfSub">The printed sheet, A4 landscape</small></span></button>
    </div>
  </div>
</div>

<!-- List Block: accounts blocked now (ListBlocked) -->
<div id="abBlocked" class="ab-dim" hidden>
  <div class="ab-sheet ab-sheet-tall" role="dialog" aria-modal="true" aria-labelledby="abBlockedTitle">
    <div class="ab-sheet-head">
      <div>
        <div class="ab-sheet-title" id="abBlockedTitle" data-i18n="masterdata.ab.listBlockTitle">Accounts blocked now</div>
        <div class="ab-sheet-sub" id="abBlockedSub">-</div>
      </div>
      <button type="button" class="ab-close" data-close aria-label="Close" data-i18n-aria-label="common.close">×</button>
    </div>
    <div class="ab-search"><span class="ui-ico ui-ico-search" aria-hidden="true"></span><input type="search" id="abBlockedQ" autocomplete="off" placeholder="CIF / account / description" data-i18n-placeholder="masterdata.ab.searchBlocked"></div>
    <!-- Filter / sort / card-or-list view -->
    <div class="ab-bl-tools">
      <button type="button" class="ab-bl-btn" id="btnAbBlFilter" aria-expanded="false" aria-controls="abBlFilters">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 5h16l-6 7v6l-4 2v-8L4 5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span data-i18n="masterdata.ab.filter">Filter</span><span class="ab-bl-badge" id="abBlFilterN" hidden></span>
      </button>
      <label class="ab-bl-btn ab-bl-sort">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M7 4v16m0 0-3-3m3 3 3-3M17 20V4m0 0-3 3m3-3 3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <select id="abBlSort" aria-label="Sort" data-i18n-aria-label="masterdata.ab.sort">
          <option value="amount_desc" data-i18n="masterdata.ab.sortAmountDesc">Amount: high → low</option>
          <option value="amount_asc" data-i18n="masterdata.ab.sortAmountAsc">Amount: low → high</option>
          <option value="branch" data-i18n="masterdata.ab.sortBranch">Branch</option>
          <option value="name" data-i18n="masterdata.ab.sortName">Name</option>
          <option value="officer" data-i18n="masterdata.ab.sortOfficer">Officer</option>
          <option value="inputBranch" data-i18n="masterdata.ab.sortInputBranch">Inputter branch</option>
          <option value="status" data-i18n="masterdata.ab.sortStatus">Status</option>
          <option value="cif" data-i18n="masterdata.ab.sortCif">CIF</option>
          <option value="account" data-i18n="masterdata.ab.sortAccount">Account</option>
        </select>
      </label>
      <div class="ab-view" role="group" aria-label="View" data-i18n-aria-label="masterdata.ab.view">
        <button type="button" data-view="card" aria-label="Cards" data-i18n-aria-label="masterdata.ab.viewCard"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="4" y="4" width="16" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="13" width="16" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
        <button type="button" data-view="list" aria-label="List" data-i18n-aria-label="masterdata.ab.viewList"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <div class="ab-bl-filters" id="abBlFilters" hidden></div>
    <div class="ab-bl-sum" id="abBlSum"></div>
    <div class="ab-sheet-list" id="abBlockedList"></div>
    <!-- Multi-select (long press an account) -->
    <div class="ab-selbar" id="abSelBar" hidden>
      <button type="button" class="ab-sel-x" id="btnAbSelCancel" aria-label="Cancel" data-i18n-aria-label="common.cancel">×</button>
      <span class="ab-sel-n" id="abSelN">0</span>
      <button type="button" class="ab-sel-all" id="btnAbSelAll" data-i18n="masterdata.ab.selectAll">Select all</button>
      <button type="button" class="ab-primary ab-sel-add" id="btnAbSelAdd"><span class="ui-ico ui-ico-plus" aria-hidden="true"></span> <span data-i18n="masterdata.ab.add">Add to list</span></button>
    </div>
  </div>
</div>

<!-- Add from List Block: pick the action -->
<div id="abPick" class="ab-dim" hidden>
  <div class="ab-sheet" role="dialog" aria-modal="true" aria-labelledby="abPickTitle">
    <div class="ab-sheet-head">
      <div>
        <div class="ab-sheet-title" id="abPickTitle" data-i18n="masterdata.ab.pickTitle">Add to the list as…</div>
        <div class="ab-sheet-sub" id="abPickSub">-</div>
      </div>
      <button type="button" class="ab-close" data-close aria-label="Close" data-i18n-aria-label="common.close">×</button>
    </div>
    <div class="ab-sheet-body">
      <div class="ab-pick-note" id="abPickNote" hidden></div>
      <div class="ab-actions" id="abPickActions" role="group"></div>
    </div>
  </div>
</div>

<div id="bottomnav-container"></div>

<script src="../../config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>
<script src="../../config/auth.js"></script>
<script src="../../config/session.js"></script>

<script src="/CM_Pro/shared/topbar.js"></script>
<script src="/CM_Pro/shared/theme.js"></script>
<script src="/CM_Pro/shared/language.js"></script>
<script src="/CM_Pro/shared/i18n.js"></script>
<script src="/CM_Pro/shared/i18n/common.js"></script>
<script src="/CM_Pro/shared/i18n/core.js"></script>
<script src="/CM_Pro/shared/i18n/masterdata.js"></script>
<script src="/CM_Pro/shared/loading.js"></script>
<script src="/CM_Pro/assets/js/global-splash.js"></script>
<script src="/CM_Pro/assets/js/toast.js"></script>
<script src="/CM_Pro/assets/js/notification-badge.js"></script>

<script src="../../assets/js/masterdata/accblocking.js"></script>

</body>

</html>
