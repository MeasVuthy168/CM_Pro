<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>កម្មវិធីគណនាឥណទាន</title>
<meta
name="theme-color"
content="#0e1b3c">

<!-- Applied before any CSS loads, so there's no flash of the wrong
     theme on page load. Keep this as the very first thing in <head>. -->
<script>
  document.documentElement.setAttribute(
    "data-theme",
    (function(){var t=localStorage.getItem("cm_theme")||"auto";return t==="auto"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;})()
  );
</script>

<link
rel="stylesheet"
href="../../assets/css/main.css">
<link
rel="stylesheet"
href="../../assets/css/loanCalculate.css">
<link
rel="stylesheet"
href="/CM_Pro/assets/css/global-splash.css">
<!-- Hold the first paint until the whole page is parsed (its scripts,
     translations and header), so a page transition slides in a finished
     page instead of one still filling itself in. No element has this id:
     the hold simply ends when parsing does. -->
<link rel="expect" href="#cm-pt-parsed" blocking="render">
<script src="/CM_Pro/shared/page-transition.js"></script>
</head>
<body>
<!-- ========================= -->
<!-- OFFLINE -->
<!-- ========================= -->
<div id="offlineBanner" data-i18n="common.offline">
No Internet Connection
</div>
<!-- ========================= -->
<!-- CONFIG -->
<!-- ========================= -->
<script src="../../config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>
<script src="../../config/auth.js"></script>
<script src="../../config/session.js"></script>
<!-- ========================= -->
<!-- COMPONENT -->
<!-- ========================= -->
<script src="/CM_Pro/shared/topbar.js"></script>
<script src="/CM_Pro/shared/theme.js"></script>
<script src="/CM_Pro/shared/language.js"></script>
<script src="/CM_Pro/shared/i18n.js"></script>
<script src="/CM_Pro/shared/i18n/common.js"></script>
<script src="/CM_Pro/shared/i18n/core.js"></script>
<script src="/CM_Pro/shared/i18n/features.js"></script>
<script src="/CM_Pro/assets/js/global-splash.js"></script>
<script src="/CM_Pro/assets/js/toast.js"></script>
<!-- ========================= -->
<!-- TOPBAR -->
<!-- ========================= -->
<div id="topbar-container"></div>
<!-- ========================= -->
<!-- PAGE -->
<!-- ========================= -->
<div class="page-container">

<div class="form-card">

<div class="form-group">
<label for="customerName" data-i18n="loanCalculate.customerNameLabel">ឈ្មោះអតិថិជន</label>
<input type="text" id="customerName" placeholder="ឧ. ACB" data-i18n-placeholder="loanCalculate.customerNamePlaceholder" autocomplete="off">
</div>

<div class="form-group">
<span class="group-label" data-i18n="loanCalculate.solveForLabel">គណនារក</span>
<div class="seg" id="solveFor" role="group">
<button type="button" class="seg-btn" data-field="periodicRepayment" data-i18n="loanCalculate.solveRepayment">ប្រាក់សំណង</button>
<button type="button" class="seg-btn" data-field="loanAmount" data-i18n="loanCalculate.solveLoan">ទំហំឥណទាន</button>
<button type="button" class="seg-btn" data-field="term" data-i18n="loanCalculate.solveTerm">រយៈពេល</button>
</div>
</div>

<div class="form-group">
<label for="loanAmount" data-i18n="loanCalculate.loanAmountLabel">ទំហំឥណទាន</label>
<div class="input-wrap">
<input type="number" id="loanAmount" inputmode="decimal" min="0" step="any">
<span class="auto-tag" data-i18n="loanCalculate.autoTag">ស្វ័យប្រវត្តិ</span>
</div>
</div>

<div class="form-group">
<label for="periodicRepayment" data-i18n="loanCalculate.periodicRepaymentLabel">ប្រាក់សំណងខួប</label>
<div class="input-wrap">
<input type="number" id="periodicRepayment" inputmode="decimal" min="0" step="any">
<span class="auto-tag" data-i18n="loanCalculate.autoTag">ស្វ័យប្រវត្តិ</span>
</div>
</div>

<div class="form-row">

<div class="form-group">
<label for="term" data-i18n="loanCalculate.termLabel">រយៈពេលខ្ចី (ខែ)</label>
<div class="input-wrap">
<input type="number" id="term" inputmode="numeric" min="1" step="1">
<span class="auto-tag" data-i18n="loanCalculate.autoTag">ស្វ័យប្រវត្តិ</span>
</div>
</div>

<div class="form-group">
<label for="interestRate" data-i18n="loanCalculate.interestRateLabel">អត្រាការប្រាក់ប្រចាំឆ្នាំ (%)</label>
<div class="input-wrap has-suffix">
<input type="number" id="interestRate" inputmode="decimal" min="0" step="any">
<span class="suffix">%</span>
</div>
</div>

</div>

<div class="term-chips" id="termChips">
<button type="button" class="term-chip" data-term="12">12</button>
<button type="button" class="term-chip" data-term="24">24</button>
<button type="button" class="term-chip" data-term="36">36</button>
<button type="button" class="term-chip" data-term="48">48</button>
<button type="button" class="term-chip" data-term="60">60</button>
<span class="term-chip-unit" data-i18n="loanCalculate.monthsUnit">ខែ</span>
</div>

<div class="form-group">
<span class="group-label" data-i18n="loanCalculate.paymentMethodLabel">របៀបសងប្រាក់</span>
<div class="seg" id="methodSeg" role="group">
<button type="button" class="seg-btn" data-method="Linear" data-i18n="loanCalculate.methodLinear">បង់ថយ</button>
<button type="button" class="seg-btn" data-method="Annuity" data-i18n="loanCalculate.methodAnnuity">បង់ថេរ</button>
</div>
<input type="hidden" id="paymentMethod" value="Linear">
</div>

<button type="button" class="calculate-btn" id="btnCalculate" data-i18n="loanCalculate.calculateBtn">គណនា</button>

</div>

<!-- RESULT -->

<div class="result-card" id="resultCard" hidden>

<div class="res-head">
<div class="res-name" id="resName">-</div>
<div class="res-method" id="resMethod"></div>
</div>

<div class="res-hero">
<div class="res-hero-label" id="resHeroLabel"></div>
<div class="res-hero-value" id="resHeroValue">-</div>
<div class="res-hero-note" id="resHeroNote"></div>
</div>

<div class="res-kpis">
<div class="res-kpi"><span data-i18n="loanCalculate.loanAmountLabel">ទំហំឥណទាន</span><b id="kpiLoan">-</b></div>
<div class="res-kpi"><span data-i18n="loanCalculate.kpiTerm">រយៈពេល</span><b id="kpiTerm">-</b></div>
<div class="res-kpi"><span data-i18n="loanCalculate.kpiInterest">ការប្រាក់សរុប</span><b id="kpiInterest">-</b></div>
<div class="res-kpi"><span data-i18n="loanCalculate.kpiTotal">ប្រាក់បង់សរុប</span><b id="kpiTotal">-</b></div>
</div>

<div class="split">
<div class="split-bar"><i id="splitPrincipal"></i></div>
<div class="split-legend">
<span><i class="dot dot-p"></i><span data-i18n="loanCalculate.colPrincipal">ប្រាក់ដើម</span> <b id="splitPrincipalPct">-</b></span>
<span><i class="dot dot-i"></i><span data-i18n="loanCalculate.colInterest">ការប្រាក់</span> <b id="splitInterestPct">-</b></span>
</div>
</div>

<div class="export-buttons">
<button type="button" id="btnExcel" class="export-btn" disabled>
<span class="file-badge xls">XLS</span>
<span>Excel</span>
</button>
<button type="button" id="btnPDF" class="export-btn" disabled>
<span class="file-badge pdf">PDF</span>
<span>PDF</span>
</button>
</div>

</div>

<!-- SCHEDULE -->

<div class="schedule-card" id="scheduleCard" hidden>
<div class="schedule-head">
<span data-i18n="loanCalculate.scheduleTitle">តារាងកាលវិភាគសងប្រាក់</span>
<span class="schedule-count" id="scheduleCount"></span>
</div>
<div id="exportSection"></div>
</div>

</div>

<!-- ========================= -->
<!-- LOADING -->
<!-- ========================= -->
<div
id="loadingBox"
class="loading-box"
style="display:none;">
<div class="spinner"></div>
</div>
<!-- ========================= -->
<!-- BOTTOM -->
<!-- ========================= -->
<div id="bottomnav-container"></div>
<!-- xlsx-js-style: SheetJS fork (same XLSX API) that also writes cell styles -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
<!-- NOTIFICATION BADGE -->
<script src="/CM_Pro/assets/js/notification-badge.js"></script>
<!-- LOAN CALCULATE LOGIC -->
<script src="/CM_Pro/shared/export-kit.js"></script>
<script src="../../assets/js/loanCalculate.js"></script>
<!-- PAGE LOADER (component loader, offline, notification badge) -->
<script src="../../assets/js/loanCalculate-loader.js"></script>
</body>
</html>
