<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta

name="viewport"

content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Setting - CM_Pro</title>

<meta name="theme-color" content="#032d73">

<link

rel="stylesheet"

href="../../assets/css/main.css">

<link

rel="stylesheet"

href="../../assets/css/settings.css">

<link

rel="stylesheet"

href="/CM_Pro/assets/css/global-splash.css">

</head>

<body>

<!-- TOPBAR -->

<div id="topbar-container"></div>

<!-- PAGE -->

<div class="setting-page">

    <div class="profile-card">

        <img

        id="settingPhoto"

        src="/CM_Pro/assets/images/default-user.png"

        class="profile-photo">

        <div class="profile-info">

            <div

            id="settingFullname"

            class="profile-name">

                Loading...

            </div>

            <div

            id="settingUsername"

            class="profile-role">

                ...

            </div>

        </div>

    </div>

    <div class="setting-list">

        <div class="setting-item">

            <span>👤 Account</span>

            <span>›</span>

        </div>

        <div class="setting-item">

            <span>ℹ About</span>

            <span>›</span>

        </div>

        <div class="setting-item">

            <span>🔔 Notification</span>

            <span>›</span>

        </div>

        <div

        class="setting-item logout">

            Logout

        </div>

    </div>

</div>

<!-- Bottom Navigation -->
<div id="bottomnav-container"></div>

<script src="../../config/api.js"></script>
<script src="../../config/auth.js"></script>
<script src="../../config/session.js"></script>
<script src="../../config/push.js"></script>

<script src="/CM_Pro/shared/topbar.js"></script>

<script src="/CM_Pro/assets/js/global-splash.js"></script>

<!-- Notification Badge -->
<script src="/CM_Pro/assets/js/notification-badge.js"></script>

<script src="../../assets/js/settings.js"></script>

</body>
</html>
