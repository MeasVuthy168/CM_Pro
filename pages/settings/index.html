<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Setting - CM_Pro</title>
<meta name="theme-color" content="#032d73">

<!-- Applied before any CSS loads, so there's no flash of the wrong
     theme on page load. Keep this as the very first thing in <head>. -->
<script>
  document.documentElement.setAttribute(
    "data-theme",
    localStorage.getItem("cm_theme") || "light"
  );
</script>

<link rel="stylesheet" href="../../assets/css/main.css">
<link rel="stylesheet" href="../../assets/css/settings.css">
<link rel="stylesheet" href="/CM_Pro/assets/css/global-splash.css">
</head>
<body>

<div id="offlineBanner">
⚠️ No Internet Connection
</div>

<div id="topbar-container"></div>

<div class="setting-page">

<div class="profile-card">

<img id="settingPhoto" src="/CM_Pro/assets/images/default-user.png" class="profile-photo">

<div class="profile-info">
<div id="settingFullname" class="profile-name">Loading...</div>
</div>

</div>

<div class="setting-list">

<div class="setting-item" onclick="location.href='account.html'">
<div class="setting-left">
<img src="/CM_Pro/assets/icons/setting/user.png" class="setting-icon">
<span>គណនីរបស់ខ្ញុំ</span>
</div>
<span class="setting-arrow">›</span>
</div>

<div class="setting-item" onclick="location.href='fingerprint.html'">
<div class="setting-left">
<span class="setting-icon-emoji">👆</span>
<span>ការចូលដោយស្នាមម្រាមដៃ</span>
</div>
<span class="setting-arrow">›</span>
</div>

<div class="setting-item" onclick="location.href='about.html'">
<div class="setting-left">
<img src="/CM_Pro/assets/icons/setting/info.png" class="setting-icon">
<span>អំពីកម្មវិធី</span>
</div>
<span class="setting-arrow">›</span>
</div>

<div class="setting-item">
<div class="setting-left">
<img src="/CM_Pro/assets/icons/setting/theme.png" class="setting-icon">
<span>ប្តូរផ្ទៃខាងក្រោយ</span>
</div>
<div class="notify-right">
<label class="switch">
<input id="themeToggle" type="checkbox">
<span class="slider round"></span>
</label>
</div>
</div>

<div class="setting-item">
<div class="setting-left">
<img src="/CM_Pro/assets/icons/setting/bell.png" class="setting-icon">
<span>ការជូនដំណឹង</span>
</div>
<div class="notify-right">
<label class="switch">
<input id="notifyToggle" type="checkbox">
<span class="slider round"></span>
</label>
</div>
</div>

<div class="setting-item logout" id="logoutBtn">
<div class="setting-left">
<img src="/CM_Pro/assets/icons/setting/logout-rounded-left.png" class="setting-icon">
<span>ចាកចេញ</span>
</div>
</div>

</div>

</div>

<div id="bottomnav-container"></div>

<!-- Logout Dialog -->
<div id="logoutDialog" class="dialog">
<div class="dialog-box">
<div class="dialog-title">
តើអ្នកពិតជាចង់ចាកចេញមែនទេ?
</div>
<div class="dialog-buttons">
<button id="btnLogoutYes">
ចាកចេញ
</button>
<button id="btnLogoutNo">
បោះបង់
</button>
</div>
</div>
</div>

<script src="../../config/api.js"></script>
<script src="../../config/auth.js"></script>
<script src="../../config/session.js"></script>
<script src="../../config/push.js"></script>

<script src="/CM_Pro/shared/topbar.js"></script>
<script src="/CM_Pro/shared/theme.js"></script>
<script src="/CM_Pro/assets/js/global-splash.js"></script>
<script src="/CM_Pro/assets/js/notification-badge.js"></script>

<script src="../../assets/js/settings.js"></script>

</body>
</html>
