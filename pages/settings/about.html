<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>About CM_Pro</title>

<meta
name="theme-color"
content="#0e1b3c">

<!-- Applied before any CSS loads, so there's no flash of the wrong
     theme on page load. Keep this as the very first thing in <head>. -->
<script>
  document.documentElement.setAttribute(
    "data-theme",
    (function(){var t=localStorage.getItem("cm_theme")||"auto";return t==="auto"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;})()
  );
</script>

<link
rel="stylesheet"
href="../../assets/css/main.css">

<style>

/* main.css (via base.css) hardcodes navy on html/body — .wrapper
   overrides it with the theme-aware page background. */

:root{
    --ab-page-bg:#F5F7FA;
    --ab-card-bg:#FFFFFF;
    --ab-border:#E2E6ED;
    --ab-title:#0E1B3C;
    --ab-text:#3A4356;
    --ab-muted:#6B7280;
    --ab-gold:#B8860B;
    --ab-shadow:0 4px 14px rgba(14,27,60,.06);
}
[data-theme="dark"]{
    --ab-page-bg:#0B1220;
    --ab-card-bg:#131C2E;
    --ab-border:#223055;
    --ab-title:#EAF0FF;
    --ab-text:#C9D3EA;
    --ab-muted:#8FA0C7;
    --ab-gold:#FFD700;
    --ab-shadow:0 2px 14px rgba(0,0,0,.4);
}
[data-theme="gold"]{
    --ab-page-bg:#FFF8E7;
    --ab-card-bg:#FFFDF6;
    --ab-border:#E6CF8E;
    --ab-title:#6B4500;
}
[data-theme="darkgray"]{
    --ab-page-bg:#2B2E33;
    --ab-card-bg:#363A41;
    --ab-border:#474C55;
    --ab-title:#F0F1F3;
    --ab-text:#DADDE2;
    --ab-muted:#A9AEB6;
    --ab-gold:#E8C766;
    --ab-shadow:0 2px 14px rgba(0,0,0,.35);
}

.wrapper{ width:100%; min-height:100vh; background:var(--ab-page-bg); display:flex; justify-content:center; align-items:flex-start; padding:16px 16px 100px; box-sizing:border-box; }
.inner{ width:100%; max-width:480px; }

/* ----- hero ----- */
.hero{ position:relative; overflow:hidden; text-align:center; padding:26px 18px 22px; margin-bottom:14px; border-radius:22px; color:#fff; background:radial-gradient(120% 90% at 50% 0%,#22396E 0%,#0E1B3C 70%); box-shadow:0 10px 26px rgba(14,27,60,.25); }
.hero::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:4px; background:linear-gradient(90deg,transparent,#D4AF37,transparent); }
.hero-logo{ width:84px; height:84px; border-radius:22px; box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 0 3px rgba(212,175,55,.45); }
.hero-name{ margin-top:12px; font-size:24px; font-weight:800; letter-spacing:.02em; }
.hero-sub{ margin-top:2px; font-size:15px; color:#FFD700; font-weight:600; }
.hero-branch{ margin-top:2px; font-size:13px; color:#B9C6E0; }
.hero-version{ display:inline-block; margin-top:12px; padding:4px 12px; border-radius:999px; font-size:12.5px; font-weight:700; background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.18); }

/* ----- cards ----- */
.card{ background:var(--ab-card-bg); border:1px solid var(--ab-border); border-radius:18px; box-shadow:var(--ab-shadow); padding:16px; margin-bottom:14px; }
.card-head{ display:flex; align-items:center; gap:10px; font-size:16px; font-weight:700; color:var(--ab-title); margin-bottom:10px; }
.card-ic{ width:34px; height:34px; flex:none; border-radius:10px; display:flex; align-items:center; justify-content:center; background:rgba(212,175,55,.14); color:var(--ab-gold); }
.card-ic svg{ width:19px; height:19px; }
.card-body{ margin:0; font-size:14.5px; line-height:1.85; color:var(--ab-text); }


#versionHistory b{ display:inline-block; margin-bottom:4px; color:var(--ab-title); }

.about-foot{ text-align:center; font-size:12px; color:var(--ab-muted); margin:6px 0 4px; }

</style>

<!-- Hold the first paint until the whole page is parsed (its scripts,
     translations and header), so a page transition slides in a finished
     page instead of one still filling itself in. No element has this id:
     the hold simply ends when parsing does. -->
<link rel="expect" href="#cm-pt-parsed" blocking="render">
<link rel="preload" href="/CM_Pro/assets/fonts/Krasar-Regular.ttf" as="font" type="font/ttf" crossorigin>
<script src="/CM_Pro/shared/page-transition.js"></script>
<script src="/CM_Pro/shared/sw-register.js"></script>
</head>

<body>

<div id="topbar-container"></div>

<div class="wrapper">

<div class="inner">

<div class="hero">
<img id="aboutLogo" class="hero-logo" src="/CM_Pro/assets/images/icon-192.png" alt="" onerror="this.onerror=null;this.style.display='none';">
<div class="hero-name">CM_Pro</div>
<div class="hero-sub" data-i18n="login.title">ប្រព័ន្ធត្រួតពិនិត្យឥណទាន</div>
<div class="hero-branch" data-i18n="settings.contact.branchName">ធនាគារអេស៊ីលីដាសាខាខេត្តស្វាយរៀង</div>
<span id="appVersion" class="hero-version" data-i18n="common.loading">Loading...</span>
</div>

<div class="card">
<div class="card-head"><span class="card-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg></span><span data-i18n="settings.about.sectionAbout">អំពីកម្មវិធី</span></div>
<p class="card-body" data-i18n="settings.about.sectionAboutBody"></p>
</div>

<div class="card">
<div class="card-head"><span class="card-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.6-3 8.4-7 10-4-1.6-7-5.4-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></span><span data-i18n="settings.about.sectionTerms">លក្ខខណ្ឌប្រើប្រាស់</span></div>
<p class="card-body" data-i18n="settings.about.sectionTermsBody"></p>
</div>

<div class="card">
<div class="card-head"><span class="card-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="8" cy="8" r="1.5"/></svg></span><span data-i18n="settings.about.sectionVersion">ប្រវត្តិកំណែ</span></div>
<div id="versionHistory" class="card-body" data-i18n="common.loading">Loading...</div>
</div>

<div class="about-foot" data-i18n="settings.about.footer">សម្រាប់ប្រើប្រាស់ផ្ទៃក្នុង · ACLEDA Bank Svay Rieng Branch</div>

</div>

</div>

<script src="/CM_Pro/config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>
<script src="/CM_Pro/config/auth.js"></script>
<script src="/CM_Pro/config/session.js"></script>
<script src="/CM_Pro/shared/topbar.js"></script>
<script src="/CM_Pro/shared/theme.js"></script>
<script src="/CM_Pro/shared/language.js"></script>
<script src="/CM_Pro/shared/i18n.js"></script>
<script src="/CM_Pro/shared/i18n/common.js"></script>
<script src="/CM_Pro/shared/i18n/core.js"></script>
<script src="/CM_Pro/shared/i18n/settings.js"></script>

<script>

// ========================================
// TOPBAR
// ========================================

(async function loadTopbar(){
try{
const response = await fetch("/CM_Pro/components/topbar.html");
const html = await response.text();
document.getElementById("topbar-container").innerHTML = html;
initTopbar({
titleKey: "settings.about",
showBack: true,
showLogo: false,
showProfile: false
});
// Bottom bar, Setting tab active — same as the other Setting pages.
const navHtml = await (await fetch("/CM_Pro/components/bottomnav.html")).text();
document.getElementById("bottomnav-container").innerHTML = navHtml;
document.querySelectorAll(".bottom-nav-item")[1]?.classList.add("active");
}catch(err){
console.error(err);
}
})();

// ========================================
// LOAD CURRENT APP VERSION
// ========================================

async function loadVersion(){

const t = (key) => window.CMI18n ? CMI18n.t(key) : key;

// Both start tagged data-i18n="common.loading" — drop it now that JS
// owns their content (every branch below writes to them directly), so
// a later CMI18n.apply() pass can't stomp them back to "Loading...".
document.getElementById("appVersion").removeAttribute("data-i18n");
document.getElementById("versionHistory").removeAttribute("data-i18n");

try{

const data =
await API.get(
"/api/app/version?app=SVG_CreditMonitoring"
);

if(!data.ok||!data.hasVersion){

document.getElementById(
"appVersion"
).innerText=t("settings.about.versionPrefix")+" -";

document.getElementById(
"versionHistory"
).innerHTML=

`
${t("settings.about.noVersionInfo")}
`;

return;

}

document.getElementById(
"appVersion"
).innerText=

t("settings.about.versionPrefix")+" "+data.latestVersion;

document.getElementById(
"versionHistory"
).innerHTML=

`
<b>${t("settings.about.versionPrefix")} ${data.latestVersion}</b><br>

${data.notes||

t("settings.about.defaultReleaseNotes")}

`;

}catch(err){

console.error(err);

document.getElementById(
"appVersion"
).innerText=

t("settings.about.versionPrefix")+" -";

document.getElementById(
"versionHistory"
).innerHTML=

`
${t("settings.about.versionLoadFailed")}
`;

}

}

// ========================================
// START
// ========================================

window.addEventListener(
"load",
loadVersion
);

</script>

<div id="bottomnav-container"></div>
</body>

</html>
