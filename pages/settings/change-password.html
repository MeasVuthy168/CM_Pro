<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Change Password - CM_Pro</title>
<meta name="theme-color" content="#0e1b3c">

<!-- Applied before any CSS loads, so there's no flash of the wrong
     theme on page load. Keep this as the very first thing in <head>. -->
<script>
  document.documentElement.setAttribute(
    "data-theme",
    (function(){var t=localStorage.getItem("cm_theme")||"auto";return t==="auto"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;})()
  );
</script>

<link rel="stylesheet" href="../../assets/css/main.css">

<style>

/* Same :root / [data-theme] variable convention as change-pin.html —
   kept local to this page rather than added to settings.css since
   only this page uses them. */

:root{
    --cp-page-bg:#F5F7FA;
    --cp-card-bg:#FFFFFF;
    --cp-border:#E2E6ED;
    --cp-text:#1C2333;
    --cp-text-muted:#6B7280;
    --cp-navy-dark:#0E1B3C;
    --cp-gold:#D4AF37;
}

[data-theme="dark"]{
    --cp-page-bg:#0E1B3C;
    --cp-card-bg:linear-gradient(180deg,#1A2E57,#0E1B3C);
    --cp-border:#D4AF37;
    --cp-text:#fff;
    --cp-text-muted:#cdd9ef;
}

[data-theme="gold"]{
    --cp-page-bg:#FFF8E7;
    --cp-card-bg:#FFFDF6;
    --cp-border:#C9971F;
    --cp-navy-dark:#6B4500;
}

[data-theme="darkgray"]{
    --cp-page-bg:#2B2E33;
    --cp-card-bg:#363A41;
    --cp-border:#474C55;
    --cp-text:#F0F1F3;
    --cp-text-muted:#A9AEB6;
    --cp-navy-dark:#D8DAE0;
}

.cp-page{
    background:var(--cp-page-bg);
    min-height:100vh;
    box-sizing:border-box;
    padding:16px;
    padding-bottom:100px;
}

.cp-card{
    background:var(--cp-card-bg);
    border:1px solid var(--cp-border);
    border-radius:16px;
    padding:20px;
}

.cp-intro-icon{
    display:flex;
    justify-content:center;
    color:var(--cp-navy-dark);
    margin-bottom:8px;
}
[data-theme="dark"] .cp-intro-icon{
    color:#D4AF37;
}

.cp-intro-title{
    font-size:17px;
    font-weight:700;
    color:var(--cp-text);
    text-align:center;
    margin-bottom:20px;
}

.cp-field{
    margin-bottom:16px;
}

.cp-field label{
    display:block;
    font-size:13.5px;
    color:var(--cp-text-muted);
    margin-bottom:6px;
}

.cp-input-wrap{
    position:relative;
    display:flex;
    align-items:center;
}

.cp-input-wrap input{
    width:100%;
    height:50px;
    padding:0 46px 0 14px;
    border:1px solid var(--cp-border);
    border-radius:12px;
    background:var(--cp-page-bg);
    color:var(--cp-text);
    font-size:15px;
    box-sizing:border-box;
}

.cp-input-wrap input:focus{
    outline:none;
    border-color:var(--cp-gold);
}

.cp-eye{
    position:absolute;
    right:6px;
    width:36px;
    height:36px;
    border:none;
    background:transparent;
    font-size:17px;
    cursor:pointer;
    color:var(--cp-text-muted);
}

.cp-rules{
    margin:4px 0 20px;
}

.cp-rule{
    display:flex;
    align-items:center;
    gap:10px;
    padding:5px 0;
    font-size:13.5px;
    color:var(--cp-text-muted);
}

.cp-rule-icon{
    width:18px;
    height:18px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    flex-shrink:0;
    background:rgba(192,57,43,.12);
    color:#C0392B;
}

.cp-rule.ok .cp-rule-icon{
    background:rgba(39,174,96,.15);
    color:#27AE60;
}

.cp-rule.ok{
    color:var(--cp-text);
}

.cp-error{
    font-size:13px;
    color:#C0392B;
    text-align:center;
    min-height:18px;
    margin-bottom:6px;
}

.cp-submit{
    width:100%;
    height:52px;
    border:none;
    border-radius:14px;
    background:linear-gradient(180deg,#FFD700,#D4AF37);
    color:#0E1B3C;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}
.cp-submit:active{ transform:scale(.98); }
.cp-submit:disabled{
    opacity:.55;
    cursor:default;
}

</style>

</head>
<body>

<div id="offlineBanner" data-i18n="common.offline">
No Internet Connection
</div>

<div id="topbar-container"></div>

<div class="cp-page">

<div class="cp-card">

<div class="cp-intro-icon">
<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
<rect x="4.5" y="11" width="15" height="10" rx="2.5"/>
<path d="M7.5 11V7a4.5 4.5 0 0 1 9 0v4"/>
<circle cx="12" cy="16" r="1" fill="currentColor" stroke="none"/>
</svg>
</div>
<div class="cp-intro-title" data-i18n="settings.account.changePassword">ប្តូរពាក្យសម្ងាត់</div>

<div class="cp-field">
<label data-i18n="settings.account.oldPassword">ពាក្យសម្ងាត់ចាស់</label>
<div class="cp-input-wrap">
<input type="password" id="cpOldPassword" autocomplete="current-password">
<button type="button" class="cp-eye" data-target="cpOldPassword"><span class="ui-ico ui-ico-eye" aria-hidden="true"></span></button>
</div>
</div>

<div class="cp-field">
<label data-i18n="settings.account.newPassword">ពាក្យសម្ងាត់ថ្មី</label>
<div class="cp-input-wrap">
<input type="password" id="cpNewPassword" autocomplete="new-password">
<button type="button" class="cp-eye" data-target="cpNewPassword"><span class="ui-ico ui-ico-eye" aria-hidden="true"></span></button>
</div>
</div>

<div class="cp-field">
<label data-i18n="settings.account.confirmPassword">បញ្ជាក់ពាក្យសម្ងាត់</label>
<div class="cp-input-wrap">
<input type="password" id="cpConfirmPassword" autocomplete="new-password">
<button type="button" class="cp-eye" data-target="cpConfirmPassword"><span class="ui-ico ui-ico-eye" aria-hidden="true"></span></button>
</div>
</div>

<div class="cp-rules">
<div class="cp-rule" data-rule="lowercase"><span class="cp-rule-icon">✕</span><span data-i18n="settings.account.rule.lowercase">យ៉ាងតិចមានអក្សរតូចមួយ</span></div>
<div class="cp-rule" data-rule="length"><span class="cp-rule-icon">✕</span><span data-i18n="settings.account.rule.length">យ៉ាងតិច ១២ តួអក្សរ</span></div>
<div class="cp-rule" data-rule="uppercase"><span class="cp-rule-icon">✕</span><span data-i18n="settings.account.rule.uppercase">យ៉ាងតិចមានអក្សរធំមួយ</span></div>
<div class="cp-rule" data-rule="number"><span class="cp-rule-icon">✕</span><span data-i18n="settings.account.rule.number">យ៉ាងតិចមានលេខមួយ</span></div>
<div class="cp-rule" data-rule="special"><span class="cp-rule-icon">✕</span><span data-i18n="settings.account.rule.special">យ៉ាងតិចមានតួអក្សរពិសេសមួយ</span></div>
</div>

<div class="cp-error" id="cpError"></div>

<button type="button" id="cpSubmitBtn" class="cp-submit" disabled data-i18n="settings.account.changePassword">ប្តូរពាក្យសម្ងាត់</button>

</div>

</div>

<div id="bottomnav-container"></div>

<script src="../../config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>
<script src="../../config/auth.js"></script>
<script src="../../config/session.js"></script>

<script src="/CM_Pro/shared/topbar.js"></script>
<script src="/CM_Pro/shared/theme.js"></script>
<script src="/CM_Pro/shared/language.js"></script>
<script src="/CM_Pro/shared/i18n.js"></script>
<script src="/CM_Pro/shared/i18n/common.js"></script>
<script src="/CM_Pro/shared/i18n/core.js"></script>
<script src="/CM_Pro/shared/i18n/settings.js"></script>
<script src="/CM_Pro/assets/js/toast.js"></script>

<script src="../../assets/js/settings-changepassword.js"></script>

</body>
</html>
