<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>My Account - CM_Pro</title>

<meta
name="theme-color"
content="#032d73">

<!-- Applied before any CSS loads, so there's no flash of the wrong
     theme on page load. Keep this as the very first thing in <head>. -->
<script>
  document.documentElement.setAttribute(
    "data-theme",
    localStorage.getItem("cm_theme") || "light"
  );
</script>

<link
rel="stylesheet"
href="../../assets/css/main.css">

<style>

/* main.css (via base.css) hardcodes navy on html/body — that's
   outside this page's control, so .wrapper explicitly overrides it
   with the theme-aware page background instead, same as every other
   page's .page-container does. */

:root{
    --acct-page-bg:#F5F7FA;
    --acct-card-bg:#FFFFFF;
    --acct-border:#E2E6ED;
    --acct-text:#1C2333;
    --acct-text-muted:#6B7280;
    --acct-navy-dark:#002D6B;
    --acct-photo-bg:#EAF0FB;
}

[data-theme="dark"]{
    --acct-page-bg:#002D6B;
    --acct-card-bg:linear-gradient(180deg,#003B8B,#002D6B);
    --acct-border:#D4AF37;
    --acct-text:#fff;
    --acct-text-muted:#cdd9ef;
    --acct-photo-bg:#00265c;
}

.wrapper{

    width:100%;

    min-height:100vh;

    background:var(--acct-page-bg);

    display:flex;

    justify-content:center;

    align-items:center;

    padding:24px;

    box-sizing:border-box;

}

.card{

    position:relative;

    width:100%;

    max-width:420px;

    min-height:600px;

    background:var(--acct-card-bg);

    border:1px solid var(--acct-border);

    border-radius:28px;

    padding:25px 28px 28px;

    box-shadow:0 10px 30px rgba(0,0,0,.2);

    display:flex;

    flex-direction:column;

    justify-content:center;

}

[data-theme="dark"] .card{

    box-shadow:0 10px 30px rgba(0,0,0,.35);

}

.account-photo-header{

    display:flex;

    justify-content:center;

    margin-top:-35px;

    margin-bottom:18px;

    background:transparent;

}

.photo{

    width:120px;

    height:120px;

    border-radius:50%;

    object-fit:cover;

    border:1px solid var(--acct-border);

    background:var(--acct-photo-bg);

    transition:opacity .2s;

}

/* Shown while the photo is loading (including the automatic
   retry attempt) so there's never a moment of a broken-image
   icon or a jarring pop-in once it resolves. */

.photo.photo-loading{

    opacity:.35;

    animation:photoSkeletonPulse 1.1s ease-in-out infinite;

}

@keyframes photoSkeletonPulse{

    0%,100%{

        opacity:.35;

    }

    50%{

        opacity:.6;

    }

}

.name{

    text-align:center;

    font-size:22px;

    font-weight:bold;

    color:var(--acct-text);

    margin-top:8px;

    margin-bottom:10px;

}

.line{

    margin:15px 0 24px;

    height:3px;

    background:#D4AF37;

    border-radius:10px;

}

.row{

    display:flex;

    align-items:center;

    margin-bottom:24px;

}

.label{

    width:145px;

    font-size:15px;

    color:var(--acct-text-muted);

}

.value{

    flex:1;

    font-size:16px;

    font-weight:600;

    color:var(--acct-navy-dark);

}

[data-theme="dark"] .value{

    color:#FFD700;

}

.backBtn{

    margin-top:20px;

    width:100%;

    height:58px;

    border:none;

    border-radius:14px;

    background:linear-gradient(180deg,#FFD700,#D4AF37);

    color:#002D6B;

    font-size:20px;

    font-weight:700;

    cursor:pointer;

}

.backBtn:active{

    transform:scale(.98);

}

</style>

</head>

<body>

<div class="wrapper">

<div class="card">

<div class="account-photo-header">

<img
id="photo"
class="photo"
src="/CM_Pro/assets/images/default-user.png">

</div>

<div
id="fullname"
class="name">

Loading...

</div>

<div class="line"></div>

<div class="row">

<div class="label">

អត្តលេខៈ

</div>

<div
id="employeeId"
class="value">

-

</div>

</div>

<div class="row">

<div class="label">

តួនាទី:

</div>

<div
id="role"
class="value">

-

</div>

</div>

<div class="row">

<div class="label">

សាខា:

</div>

<div
id="branch"
class="value">

-

</div>

</div>

<div class="row">

<div class="label">

លេខទូរស័ព្ទ:

</div>

<div
id="phone"
class="value">

-

</div>

</div>

<button
class="backBtn"
onclick="history.back()">

បិទ

</button>

</div>

</div>

<script src="../../config/api.js"></script>
<script src="../../config/auth.js"></script>
<script src="../../config/session.js"></script>
<script src="/CM_Pro/shared/theme.js"></script>

<script>

// =========================================================
// RENDER HELPER
// =========================================================
// Fills the card from a user object, whatever its source
// (cached localStorage first, then the live server profile).
// employeeId/branch aren't in the User schema yet, so those
// stay "-" until that data actually exists somewhere.

function renderAccount(user){

    document.getElementById("fullname").innerText =

        user.fullname ||
        user.fullName ||
        user.name ||
        user.username ||
        "Unknown";

    document.getElementById("employeeId").innerText =

        user.employeeId ||
        user.employeeID ||
        user.staffId ||
        user.staffID ||
        user.username ||
        "-";

    document.getElementById("role").innerText =

        user.role ||
        "User";

    document.getElementById("branch").innerText =

        user.branch ||
        user.branchName ||
        "-";

    document.getElementById("phone").innerText =

        user.phone ||
        user.phoneNumber ||
        user.mobile ||
        "-";

    if(user.username){

        const img = document.getElementById("photo");

        const fallback = "/CM_Pro/assets/images/default-user.png";

        const photoUrl = `${API.BASE_URL}/assets/user-photo/${user.username}`;

        let retried = false;

        img.classList.add("photo-loading");

        img.onload = function(){

            this.classList.remove("photo-loading");

        };

        // Intermittent mobile-network failures (request drops,
        // WebView cold-start, flaky connection) often succeed on
        // a second attempt a moment later — so retry once with a
        // short delay before giving up and falling back to the
        // default avatar. Guarded so it can't loop forever if the
        // fallback image itself is missing/broken.

        img.onerror = function(){

            if(this.src.indexOf(fallback) !== -1){

                this.classList.remove("photo-loading");

                return;

            }

            if(!retried){

                retried = true;

                setTimeout(()=>{

                    this.src = photoUrl + `?retry=${Date.now()}`;

                },800);

                return;

            }

            this.onerror = null;

            this.classList.remove("photo-loading");

            this.src = fallback;

        };

        img.src = photoUrl;

    }

}

// =========================================================
// LOAD USER
// =========================================================

// 1) Render instantly from whatever's cached, so the page
//    doesn't sit on "Loading..." while the network call runs.
let cachedUser = {};

try{

    cachedUser = JSON.parse(
        localStorage.getItem("loggedInUser") || "{}"
    );

    if(Object.keys(cachedUser).length){
        renderAccount(cachedUser);
    }

}catch(err){

    console.error("Account cache read error:", err);

}

// 2) Then fetch the live profile from the server — this is
//    the fix for the phone number: the cached copy from login
//    never included phone (or anything that can change later,
//    like an admin-updated branch/phone), only /api/auth/me
//    reading fresh from the database has it.

(async ()=>{

    try{

        const token =

            localStorage.getItem("token") ||
            sessionStorage.getItem("token");

        if(!token) return;

        const response = await fetch(

            `${API.BASE_URL}/api/auth/me`,

            {
                headers:{
                    Authorization:`Bearer ${token}`
                }
            }

        );

        if(!response.ok){
            throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if(data.ok && data.user){

            renderAccount(data.user);

            // Keep the cache fresh too, so the next page load
            // (and other pages reading loggedInUser) also see
            // the current phone/branch/role immediately.
            localStorage.setItem(
                "loggedInUser",
                JSON.stringify(data.user)
            );

        }

    }catch(err){

        console.error("Account Load Error:", err);

        // If this was the very first load with nothing cached,
        // at least stop it sitting on "Loading..." forever.
        if(!Object.keys(cachedUser).length){
            document.getElementById("fullname").innerText = "Unknown";
        }

    }

})();

// =========================================================
// FIX: RELOAD PHOTO ON BACK / BFCACHE RESTORE
// =========================================================
// When navigating back from another page, the browser may restore
// this page from bfcache without firing everything above again.
// If the photo request was aborted or never completed before
// navigating away, it stays broken. This re-checks and re-fetches
// it when needed.

window.addEventListener("pageshow", function(event){

    const img = document.getElementById("photo");

    if(!img) return;

    const broken = !img.complete || img.naturalWidth === 0;

    if((event.persisted || broken) && Object.keys(cachedUser).length){

        renderAccount(cachedUser);

    }

});

</script>

</body>

</html>
