<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Account - CM_Pro</title>

<meta name="theme-color" content="#032d73">

<link
rel="stylesheet"
href="../../assets/css/main.css">

<link
rel="stylesheet"
href="../../assets/css/account.css">

<link
rel="stylesheet"
href="/CM_Pro/assets/css/global-splash.css">

</head>

<body>

<!-- TOPBAR -->
<div id="topbar-container"></div>

<!-- PAGE -->

<div class="account-page">

    <div class="account-header">

        <img
        id="accountPhoto"
        src="/CM_Pro/assets/images/default-user.png"
        class="account-photo">

        <div
        id="accountFullname"
        class="account-name">

            Loading...

        </div>

        <div
        id="accountUsername"
        class="account-username">

            ...

        </div>

    </div>

    <div class="account-list">

        <div class="account-row">

            <div class="account-label">
                Full Name
            </div>

            <div
            id="accountFullname2"
            class="account-value">

                -

            </div>

        </div>

        <div class="account-row">

            <div class="account-label">
                Username
            </div>

            <div
            id="accountUsername2"
            class="account-value">

                -

            </div>

        </div>

        <div class="account-row">

            <div class="account-label">
                Role
            </div>

            <div
            id="accountRole"
            class="account-value">

                -

            </div>

        </div>

        <div class="account-row">

            <div class="account-label">
                Phone
            </div>

            <div
            id="accountPhone"
            class="account-value">

                -

            </div>

        </div>

    </div>

</div>

<!-- Bottom Navigation -->

<div id="bottomnav-container"></div>

<script src="../../config/api.js"></script>
<script src="../../config/auth.js"></script>
<script src="../../config/session.js"></script>
<script src="../../config/push.js"></script>

<script src="/CM_Pro/shared/topbar.js"></script>

<script src="/CM_Pro/assets/js/global-splash.js"></script>

<script src="/CM_Pro/assets/js/notification-badge.js"></script>

<script src="../../assets/js/account.js"></script>

</body>

</html>
