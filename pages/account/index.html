<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Setting - CM_Pro</title>

<meta
name="theme-color"
content="#032d73">

<link
rel="stylesheet"
href="../../assets/css/main.css">

<link
rel="stylesheet"
href="../../assets/css/settings.css">

<link
rel="stylesheet"
href="/CM_Pro/assets/css/global-splash.css">

</head>

<body>

<!-- TOPBAR -->

<div id="topbar-container"></div>

<!-- PAGE -->

<div class="setting-page">

    <!-- PROFILE -->

    <div class="profile-card">

        <img
        id="settingPhoto"
        src="/CM_Pro/assets/images/default-user.png"
        class="profile-photo">

        <div class="profile-info">

            <div
            id="settingFullname"
            class="profile-name">

                Loading...

            </div>

            <div
            id="settingUsername"
            class="profile-role">

                ...

            </div>

        </div>

    </div>

    <!-- SETTING LIST -->

    <div class="setting-list">

        <!-- ACCOUNT -->

        <div
        class="setting-item"
        onclick="location.href='/CM_Pro/pages/account/'">

            <span>

                👤 Account

            </span>

            <span>

                ›

            </span>

        </div>

        <!-- ABOUT -->

        <div
        class="setting-item">

            <span>

                ℹ About

            </span>

            <span>

                ›

            </span>

        </div>

        <!-- NOTIFICATION -->

        <div
        class="setting-item">

            <span>

                🔔 Notification

            </span>

            <span>

                ›

            </span>

        </div>

        <!-- LOGOUT -->

        <div
        class="setting-item logout">

            Logout

        </div>

    </div>

</div>

<!-- BOTTOM NAVIGATION -->

<div id="bottomnav-container"></div>

<!-- API -->

<script src="../../config/api.js"></script>

<!-- AUTH -->

<script src="../../config/auth.js"></script>

<!-- SESSION -->

<script src="../../config/session.js"></script>

<!-- PUSH -->

<script src="../../config/push.js"></script>

<!-- TOPBAR -->

<script src="/CM_Pro/shared/topbar.js"></script>

<!-- GLOBAL SPLASH -->

<script src="/CM_Pro/assets/js/global-splash.js"></script>

<!-- NOTIFICATION BADGE -->

<script src="/CM_Pro/assets/js/notification-badge.js"></script>

<!-- SETTINGS -->

<script src="../../assets/js/settings.js"></script>

</body>

</html>
