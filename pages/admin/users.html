<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>CM_Pro Admin — User Management</title>

<meta name="theme-color" content="#002D6B">

<!-- theme flash-prevention -->
<script>
  document.documentElement.setAttribute(
    "data-theme",
    (function(){var t=localStorage.getItem("cm_theme")||"auto";return t==="auto"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;})()
  );
</script>

<script src="/CM_Pro/config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>

<!-- auth guard: redirects away if not a logged-in admin -->
<script src="/CM_Pro/assets/js/admin/admin-loader.js"></script>

<!-- ========================= -->
<!-- STYLES -->
<!-- ========================= -->
<link rel="stylesheet" href="/CM_Pro/assets/css/base.css">
<link rel="stylesheet" href="/CM_Pro/assets/css/admin.css">
<link rel="stylesheet" href="/CM_Pro/assets/css/toast.css">

</head>
<body data-adm-page="users">

<div class="adm-page">
  <div class="adm-shell">

    <!-- ========================= -->
    <!-- SIDEBAR (auto-rendered by admin-nav.js) -->
    <!-- ========================= -->
    <aside class="adm-sidebar">
      <div class="adm-sidebar-brand" data-i18n="admin.common.brand">CM_Pro Admin</div>
      <nav id="admSidebar"></nav>
    </aside>

    <!-- ========================= -->
    <!-- MAIN -->
    <!-- ========================= -->
    <main class="adm-main">

      <!-- ========================= -->
      <!-- HEADER -->
      <!-- ========================= -->
      <div class="adm-header">
        <div class="adm-title-block">
          <h1 data-i18n="admin.users.title">User Management</h1>
          <p data-i18n="admin.users.subtitle">Add, edit, and manage CM_Pro accounts</p>
        </div>
        <div class="adm-header-right">
          <span class="adm-user-chip" id="admUserLabel" data-i18n="admin.common.adminFallback">Admin</span>
          <div class="adm-topbar-actions" id="admTopbarActions"></div>
        </div>
      </div>

      <!-- ========================= -->
      <!-- TOOLBAR -->
      <!-- ========================= -->
      <div class="adm-toolbar">
        <input type="text" class="adm-search-input" id="ufSearch" placeholder="Search username, full name, or phone…" data-i18n-placeholder="admin.users.searchPlaceholder">

        <select class="adm-toolbar-select" id="ufSearchRole">
          <option value="all" data-i18n="admin.users.allRoles">All Roles</option>
          <option value="admin" data-i18n="admin.users.roleAdmin">Admin</option>
          <option value="user" data-i18n="admin.users.roleUser">User</option>
          <option value="viewer_staff" data-i18n="admin.users.roleViewerStaff">Viewer_Staff</option>
          <option value="viewer_manager_a" data-i18n="admin.users.roleViewerManagerA">Viewer_Manager_A</option>
          <option value="viewer_manager_b" data-i18n="admin.users.roleViewerManagerB">Viewer_Manager_B</option>
          <option value="viewer_manager_c" data-i18n="admin.users.roleViewerManagerC">Viewer_Manager_C</option>
        </select>

        <select class="adm-toolbar-select" id="ufSearchStatus">
          <option value="all" data-i18n="admin.users.allStatus">All Status</option>
          <option value="active" data-i18n="admin.users.statusActive">Active</option>
          <option value="inactive" data-i18n="admin.users.statusInactive">Inactive</option>
        </select>

        <div class="adm-toolbar-spacer"></div>

        <button type="button" class="adm-btn" id="ufBtnShowAll" data-i18n="admin.users.showAll">Show All</button>
        <button type="button" class="adm-btn adm-btn-primary" id="ufBtnAddUser" data-i18n="admin.users.addUser">+ Add User</button>
      </div>

      <!-- ========================= -->
      <!-- TABLE -->
      <!-- ========================= -->
      <div class="adm-card adm-users-list-card">
        <div class="adm-users-table-wrap">
          <table class="adm-table">
            <thead>
              <tr>
                <th data-i18n="admin.users.colUser">User</th>
                <th data-i18n="admin.users.colRole">Role</th>
                <th data-i18n="admin.users.colStatus">Status</th>
                <th data-i18n="admin.users.colPhone">Phone</th>
                <th data-i18n="admin.users.colBranch">Branch</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="admUsersTableBody"></tbody>
          </table>
          <div class="adm-table-empty" id="admUsersTableEmpty" hidden data-i18n="admin.users.noUsersFound">No users found.</div>
        </div>
      </div>

    </main>

  </div>
</div>

<!-- Add/Edit User form template — cloned into a modal by admin-users.js -->
<template id="ufFormTemplate">
  <form id="ufForm">
    <div class="adm-form-grid">
      <label class="adm-field">
        <span data-i18n="admin.users.fieldUsername">Username</span>
        <input type="text" id="ufUsername" autocomplete="off">
      </label>

      <label class="adm-field">
        <span data-i18n="admin.users.fieldFullName">Full Name</span>
        <input type="text" id="ufFullName" autocomplete="off">
      </label>

      <label class="adm-field">
        <span data-i18n="admin.users.fieldRole">Role</span>
        <select id="ufRole">
          <option value="admin" data-i18n="admin.users.roleAdmin">Admin</option>
          <option value="user" data-i18n="admin.users.roleUser">User</option>
          <option value="viewer_staff" data-i18n="admin.users.roleViewerStaff">Viewer_Staff</option>
          <option value="viewer_manager_a" data-i18n="admin.users.roleViewerManagerA">Viewer_Manager_A</option>
          <option value="viewer_manager_b" data-i18n="admin.users.roleViewerManagerB">Viewer_Manager_B</option>
          <option value="viewer_manager_c" data-i18n="admin.users.roleViewerManagerC">Viewer_Manager_C</option>
        </select>
      </label>

      <label class="adm-field" id="ufBranchField" hidden>
        <span data-i18n="admin.users.fieldBranch">Branch</span>
        <select id="ufBranch">
          <option value="" data-i18n="admin.users.selectBranch">— Select Branch —</option>
          <option value="All Branch" data-i18n="admin.users.branchAll">All Branch</option>
          <option value="Svay Rieng">Svay Rieng</option>
          <option value="Romeas Haek">Romeas Haek</option>
          <option value="Kraol Kou">Kraol Kou</option>
          <option value="Nhor">Nhor</option>
          <option value="Svay Teab">Svay Teab</option>
          <option value="Rumduol">Rumduol</option>
          <option value="Svay Chrom">Svay Chrom</option>
        </select>
      </label>

      <label class="adm-field">
        <span data-i18n="admin.users.fieldStatus">Status</span>
        <select id="ufStatus">
          <option value="active" data-i18n="admin.users.statusActive">Active</option>
          <option value="inactive" data-i18n="admin.users.statusInactive">Inactive</option>
        </select>
      </label>

      <label class="adm-field">
        <span data-i18n="admin.users.fieldPhone">Phone</span>
        <input type="text" id="ufPhone" autocomplete="off">
      </label>
    </div>

    <div class="adm-photo-row">
      <div class="adm-photo-preview" id="ufPhotoPreview">
        <span id="ufPhotoPlaceholder" data-i18n="admin.users.noPhoto">No Photo</span>
        <img id="ufPhotoImg" alt="User photo" hidden>
      </div>
      <div class="adm-photo-actions">
        <button type="button" class="adm-btn" id="ufBtnSelectPhoto" data-i18n="admin.users.selectPhoto">Select Photo…</button>
        <button type="button" class="adm-btn" id="ufBtnRemovePhoto" data-i18n="admin.users.removePhoto">Remove Photo</button>
        <input type="file" id="ufPhotoInput" accept="image/*" hidden>
      </div>
    </div>

    <div class="adm-modal-footer" id="ufFormFooter">
      <!-- buttons injected by admin-users.js depending on add/edit mode -->
    </div>
  </form>
</template>

<script src="/CM_Pro/shared/language.js"></script>
<script src="/CM_Pro/shared/i18n.js"></script>
<script src="/CM_Pro/shared/i18n/common.js"></script>
<script src="/CM_Pro/shared/i18n/core.js"></script>
<script src="/CM_Pro/shared/i18n/admin.js"></script>

<script src="/CM_Pro/shared/logout.js"></script>
<script src="/CM_Pro/assets/js/toast.js"></script>
<script src="/CM_Pro/assets/js/admin/admin-ui.js"></script>
<script src="/CM_Pro/assets/js/admin/admin-nav.js"></script>
<script src="/CM_Pro/assets/js/admin/admin-users.js"></script>

</body>
</html>
