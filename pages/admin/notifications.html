<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>CM_Pro Admin — Notifications</title>

<meta name="theme-color" content="#002D6B">

<!-- theme flash-prevention -->
<script>
  document.documentElement.setAttribute(
    "data-theme",
    (function(){var t=localStorage.getItem("cm_theme")||"auto";return t==="auto"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;})()
  );
</script>

<script src="/CM_Pro/config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>

<!-- auth guard: redirects away if not a logged-in admin -->
<script src="/CM_Pro/assets/js/admin/admin-loader.js"></script>

<!-- ========================= -->
<!-- STYLES -->
<!-- ========================= -->
<link rel="stylesheet" href="/CM_Pro/assets/css/base.css">
<link rel="stylesheet" href="/CM_Pro/assets/css/admin.css">

</head>
<body data-adm-page="notifications">

<div class="adm-page">
  <div class="adm-shell">

    <!-- ========================= -->
    <!-- SIDEBAR (auto-rendered by admin-nav.js) -->
    <!-- ========================= -->
    <aside class="adm-sidebar">
      <div class="adm-sidebar-brand" data-i18n="admin.common.brand">CM_Pro Admin</div>
      <nav id="admSidebar"></nav>
    </aside>

    <!-- ========================= -->
    <!-- MAIN -->
    <!-- ========================= -->
    <main class="adm-main">

      <!-- ========================= -->
      <!-- HEADER -->
      <!-- ========================= -->
      <div class="adm-header">
        <div class="adm-title-block">
          <h1 data-i18n="admin.notifications.title">Notifications</h1>
          <p data-i18n="admin.notifications.subtitle">Send announcements and review notification history</p>
        </div>
        <div class="adm-header-right">
          <span class="adm-user-chip" id="admUserLabel" data-i18n="admin.common.adminFallback">Admin</span>
          <div class="adm-topbar-actions" id="admTopbarActions"></div>
        </div>
      </div>

      <!-- ========================= -->
      <!-- SUMMARY STRIP -->
      <!-- ========================= -->
      <div class="adm-kpi-grid">
        <div class="adm-card">
          <div class="adm-card-label" data-i18n="admin.notifications.kpiTotal">Total Notifications</div>
          <div class="adm-card-value" id="nfKpiTotal">0</div>
        </div>
        <div class="adm-card">
          <div class="adm-card-label" data-i18n="admin.notifications.kpiSentToday">Sent Today</div>
          <div class="adm-card-value" id="nfKpiToday">0</div>
        </div>
        <div class="adm-card">
          <div class="adm-card-label" data-i18n="admin.notifications.kpiActiveDevices">📱 Active Devices</div>
          <div class="adm-card-value" id="nfKpiDevices">—</div>
        </div>
        <div class="adm-card">
          <div class="adm-card-label" data-i18n="admin.notifications.kpiReachableUsers">👥 Reachable Users</div>
          <div class="adm-card-value" id="nfKpiUsers">—</div>
        </div>
      </div>

      <!-- ========================= -->
      <!-- TOOLBAR -->
      <!-- ========================= -->
      <div class="adm-toolbar">
        <input type="text" class="adm-search-input" id="nfKeyword" placeholder="Search title, message, sender…" data-i18n-placeholder="admin.notifications.searchPlaceholder">

        <select class="adm-toolbar-select" id="nfType">
          <option value="all" data-i18n="admin.notifications.allTypes">All Types</option>
          <option value="system" data-i18n="admin.notifications.typeSystem">System</option>
          <option value="upload" data-i18n="admin.notifications.typeUpload">Upload</option>
          <option value="backup" data-i18n="admin.notifications.typeBackup">Backup</option>
          <option value="app" data-i18n="admin.notifications.typeApp">App</option>
        </select>

        <label class="adm-field" style="flex-direction:row; align-items:center; gap:6px;">
          <span data-i18n="admin.notifications.from">From</span>
          <input type="date" class="adm-toolbar-select" id="nfDateFrom">
        </label>
        <label class="adm-field" style="flex-direction:row; align-items:center; gap:6px;">
          <span data-i18n="admin.notifications.to">To</span>
          <input type="date" class="adm-toolbar-select" id="nfDateTo">
        </label>

        <div class="adm-toolbar-spacer"></div>

        <button type="button" class="adm-btn" id="nfBtnReset" data-i18n="admin.notifications.reset">Reset</button>
        <button type="button" class="adm-btn" id="nfBtnSearch" data-i18n="admin.notifications.search">Search</button>
        <button type="button" class="adm-btn adm-btn-primary" id="nfBtnSend" data-i18n="admin.notifications.sendNotification">+ Send Notification</button>
      </div>

      <div class="adm-toolbar" style="margin-top:0;">
        <div class="adm-toolbar-spacer"></div>
        <button type="button" class="adm-btn" id="nfBtnPrune" data-i18n="admin.notifications.pruneDeadSubs">📡 Prune Dead Subscriptions</button>
        <button type="button" class="adm-btn adm-btn-danger" id="nfBtnCleanup" data-i18n="admin.notifications.cleanupOld">🧹 Clean Up Old Notifications</button>
      </div>

      <!-- ========================= -->
      <!-- TABLE -->
      <!-- ========================= -->
      <div class="adm-card adm-users-list-card">
        <div class="adm-users-table-wrap">
          <table class="adm-table">
            <thead>
              <tr>
                <th data-i18n="admin.notifications.colTime">Time</th>
                <th data-i18n="admin.notifications.colTitle">Title</th>
                <th data-i18n="admin.notifications.colTarget">Target</th>
                <th data-i18n="admin.notifications.colSentBy">Sent By</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="nfTableBody"></tbody>
          </table>
          <div class="adm-table-empty" id="nfTableEmpty" hidden data-i18n="admin.notifications.noNotificationsFound">No notifications found.</div>
        </div>
      </div>

    </main>

  </div>
</div>

<!-- Send Notification form template -->
<template id="nfSendTemplate">
  <form id="nfSendForm">
    <div class="adm-form-grid">
      <label class="adm-field adm-field-wide">
        <span data-i18n="admin.notifications.fieldTitle">Title</span>
        <input type="text" id="nfFormTitle" autocomplete="off">
      </label>

      <label class="adm-field adm-field-wide">
        <span data-i18n="admin.notifications.fieldMessage">Message</span>
        <input type="text" id="nfFormMessage" autocomplete="off">
      </label>

      <label class="adm-field">
        <span data-i18n="admin.notifications.fieldTarget">Target</span>
        <select id="nfFormTargetType">
          <option value="all" data-i18n="admin.notifications.targetAll">All Users</option>
          <option value="role" data-i18n="admin.notifications.targetByRole">By Role</option>
          <option value="username" data-i18n="admin.notifications.targetByUsername">Specific Username</option>
        </select>
      </label>

      <label class="adm-field" id="nfFormRoleField" hidden>
        <span data-i18n="admin.notifications.fieldRole">Role</span>
        <select id="nfFormRole">
          <option value="admin" data-i18n="admin.users.roleAdmin">Admin</option>
          <option value="user" data-i18n="admin.users.roleUser">User</option>
          <option value="viewer_staff" data-i18n="admin.users.roleViewerStaff">Viewer_Staff</option>
          <option value="viewer_manager_a" data-i18n="admin.users.roleViewerManagerA">Viewer_Manager_A</option>
          <option value="viewer_manager_b" data-i18n="admin.users.roleViewerManagerB">Viewer_Manager_B</option>
          <option value="viewer_manager_c" data-i18n="admin.users.roleViewerManagerC">Viewer_Manager_C</option>
        </select>
      </label>

      <label class="adm-field" id="nfFormUsernameField" hidden>
        <span data-i18n="admin.notifications.fieldUsername">Username</span>
        <input type="text" id="nfFormUsername" list="nfUsernameOptions" autocomplete="off">
        <datalist id="nfUsernameOptions"></datalist>
      </label>
    </div>

    <div class="adm-modal-footer">
      <button type="button" class="adm-btn" id="nfFormCancel" data-i18n="admin.notifications.cancel">Cancel</button>
      <button type="submit" class="adm-btn adm-btn-primary" id="nfFormSubmit" data-i18n="admin.notifications.send">Send</button>
    </div>
  </form>
</template>

<script src="/CM_Pro/shared/language.js"></script>
<script src="/CM_Pro/shared/i18n.js"></script>
<script src="/CM_Pro/shared/i18n/common.js"></script>
<script src="/CM_Pro/shared/i18n/core.js"></script>
<script src="/CM_Pro/shared/i18n/admin.js"></script>

<script src="/CM_Pro/shared/logout.js"></script>
<script src="/CM_Pro/assets/js/admin/admin-ui.js"></script>
<script src="/CM_Pro/assets/js/admin/admin-nav.js"></script>
<script src="/CM_Pro/assets/js/admin/admin-notifications.js"></script>

</body>
</html>
