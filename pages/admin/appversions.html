<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>CM_Pro Admin — App Versions</title>

<meta name="theme-color" content="#002D6B">

<!-- theme flash-prevention -->
<script>
  document.documentElement.setAttribute(
    "data-theme",
    (function(){var t=localStorage.getItem("cm_theme")||"auto";return t==="auto"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;})()
  );
</script>

<script src="/CM_Pro/config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>

<!-- auth guard: redirects away if not a logged-in admin -->
<script src="/CM_Pro/assets/js/admin/admin-loader.js"></script>

<!-- ========================= -->
<!-- STYLES -->
<!-- ========================= -->
<link rel="stylesheet" href="/CM_Pro/assets/css/base.css">
<link rel="stylesheet" href="/CM_Pro/assets/css/admin.css">

</head>
<body data-adm-page="versions">

<div class="adm-page">
  <div class="adm-shell">

    <!-- ========================= -->
    <!-- SIDEBAR (auto-rendered by admin-nav.js) -->
    <!-- ========================= -->
    <aside class="adm-sidebar">
      <div class="adm-sidebar-brand" data-i18n="admin.common.brand">CM_Pro Admin</div>
      <nav id="admSidebar"></nav>
    </aside>

    <!-- ========================= -->
    <!-- MAIN -->
    <!-- ========================= -->
    <main class="adm-main">

      <!-- ========================= -->
      <!-- HEADER -->
      <!-- ========================= -->
      <div class="adm-header">
        <div class="adm-title-block">
          <h1 data-i18n="admin.appversions.title">App Versions</h1>
          <p data-i18n="admin.appversions.subtitle">Publish new Excel workbook builds and manage version history</p>
        </div>
        <div class="adm-header-right">
          <span class="adm-user-chip" id="admUserLabel" data-i18n="admin.common.adminFallback">Admin</span>
          <div class="adm-topbar-actions" id="admTopbarActions"></div>
        </div>
      </div>

      <!-- ========================= -->
      <!-- CURRENT VERSION HERO CARD -->
      <!-- ========================= -->
      <div class="adm-card adm-version-hero" id="avHeroCard">
        <div class="adm-render-loading" id="avHeroLoading" data-i18n="admin.appversions.loadingCurrent">Loading current version…</div>
        <div id="avHeroBody" hidden>
          <div class="adm-version-hero-top">
            <div>
              <div class="adm-card-label" data-i18n="admin.appversions.currentVersion">Current Version</div>
              <div class="adm-version-hero-number" id="avHeroVersion">—</div>
            </div>
            <span class="adm-badge" id="avHeroMandatory"></span>
          </div>
          <div class="adm-version-hero-meta">
            <span id="avHeroFilename"></span> · <span id="avHeroSize"></span> · <span id="avHeroReleased"></span>
          </div>
          <p class="adm-modal-message" id="avHeroNotes"></p>
        </div>
        <div class="adm-render-setup" id="avHeroEmpty" hidden data-i18n="admin.appversions.noVersionYet">No version has been published yet.</div>
      </div>

      <!-- ========================= -->
      <!-- TOOLBAR -->
      <!-- ========================= -->
      <div class="adm-toolbar">
        <div class="adm-downloads-toggle-wrap">
          <span data-i18n="admin.appversions.downloadsLabel">Downloads:</span>
          <button type="button" class="adm-toggle-switch adm-toggle-on" id="avDownloadsToggle" role="switch" aria-checked="true">
            <span class="adm-toggle-knob"></span>
          </button>
          <span id="avDownloadsToggleLabel" data-i18n="admin.appversions.toggleOn">On</span>
        </div>
        <div class="adm-toolbar-spacer"></div>
        <button type="button" class="adm-btn adm-btn-primary" id="avBtnUpload" data-i18n="admin.appversions.uploadNewVersion">+ Upload New Version</button>
      </div>

      <div class="adm-toolbar" style="margin-top:0;">
        <div class="adm-toolbar-spacer"></div>
        <button type="button" class="adm-btn adm-btn-danger" id="avBtnCleanup" data-i18n="admin.appversions.cleanupOldVersions">🧹 Clean Up Old Versions</button>
      </div>

      <!-- ========================= -->
      <!-- VERSION HISTORY TABLE -->
      <!-- ========================= -->
      <div class="adm-card adm-users-list-card">
        <div class="adm-card-label" style="padding:16px 16px 0;" data-i18n="admin.appversions.versionHistory">Version History</div>
        <div class="adm-users-table-wrap">
          <table class="adm-table">
            <thead>
              <tr>
                <th data-i18n="admin.appversions.colVersion">Version</th>
                <th data-i18n="admin.appversions.colSize">Size</th>
                <th data-i18n="admin.appversions.colType">Type</th>
                <th data-i18n="admin.appversions.colNotes">Notes</th>
                <th data-i18n="admin.appversions.colReleased">Released</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="avTableBody"></tbody>
          </table>
          <div class="adm-table-empty" id="avTableEmpty" hidden data-i18n="admin.appversions.noVersionsUploaded">No versions uploaded yet.</div>
        </div>
      </div>

    </main>

  </div>
</div>

<!-- Upload New Version form template -->
<template id="avUploadTemplate">
  <form id="avUploadForm">
    <div class="adm-form-grid">
      <label class="adm-field">
        <span data-i18n="admin.appversions.fieldVersion">Version</span>
        <input type="text" id="avFormVersion" placeholder="e.g. 1.4.2" autocomplete="off">
      </label>

      <label class="adm-field">
        <span data-i18n="admin.appversions.fieldMandatory">Mandatory Update</span>
        <select id="avFormMandatory">
          <option value="false" data-i18n="admin.appversions.optional">Optional</option>
          <option value="true" data-i18n="admin.appversions.mandatory">Mandatory</option>
        </select>
      </label>

      <label class="adm-field adm-field-wide">
        <span data-i18n="admin.appversions.fieldReleaseNotes">Release Notes</span>
        <input type="text" id="avFormNotes" placeholder="What changed in this version" autocomplete="off" data-i18n-placeholder="admin.appversions.notesPlaceholder">
      </label>

      <label class="adm-field adm-field-wide">
        <span data-i18n="admin.appversions.fieldWorkbookFile">Workbook File (.xlsb / .xlsm)</span>
        <input type="file" id="avFormFile" accept=".xlsb,.xlsm,.xls,.xlsx">
      </label>
    </div>

    <p class="adm-modal-message" id="avUploadStatus" hidden></p>

    <div class="adm-modal-footer">
      <button type="button" class="adm-btn" id="avFormCancel" data-i18n="admin.appversions.cancel">Cancel</button>
      <button type="submit" class="adm-btn adm-btn-primary" id="avFormSubmit" data-i18n="admin.appversions.upload">Upload</button>
    </div>
  </form>
</template>

<!-- Edit Version form template -->
<template id="avEditTemplate">
  <form id="avEditForm">
    <div class="adm-form-grid">
      <label class="adm-field">
        <span data-i18n="admin.appversions.fieldType">Type</span>
        <select id="avEditMandatory">
          <option value="false" data-i18n="admin.appversions.optional">Optional</option>
          <option value="true" data-i18n="admin.appversions.mandatory">Mandatory</option>
        </select>
      </label>

      <label class="adm-field adm-field-wide">
        <span data-i18n="admin.appversions.fieldReleaseNotes">Release Notes</span>
        <input type="text" id="avEditNotes" autocomplete="off">
      </label>

      <label class="adm-field adm-field-wide">
        <span data-i18n="admin.appversions.fieldReplaceFile">Replace File (optional — leave empty to keep the current file)</span>
        <input type="file" id="avEditFile" accept=".xlsb,.xlsm,.xls,.xlsx">
      </label>
    </div>

    <p class="adm-modal-message" data-i18n="admin.appversions.editFileHint">Replacing the file swaps the asset on this same version's existing GitHub Release — the version number itself doesn't change.</p>

    <div class="adm-modal-footer">
      <button type="button" class="adm-btn" id="avEditCancel" data-i18n="admin.appversions.cancel">Cancel</button>
      <button type="submit" class="adm-btn adm-btn-primary" id="avEditSubmit" data-i18n="admin.appversions.saveChanges">Save Changes</button>
    </div>
  </form>
</template>

<script src="/CM_Pro/shared/language.js"></script>
<script src="/CM_Pro/shared/i18n.js"></script>
<script src="/CM_Pro/shared/i18n/common.js"></script>
<script src="/CM_Pro/shared/i18n/core.js"></script>
<script src="/CM_Pro/shared/i18n/admin.js"></script>

<script src="/CM_Pro/shared/logout.js"></script>
<script src="/CM_Pro/assets/js/admin/admin-ui.js"></script>
<script src="/CM_Pro/assets/js/admin/admin-nav.js"></script>
<script src="/CM_Pro/assets/js/admin/admin-appversions.js"></script>

</body>
</html>
