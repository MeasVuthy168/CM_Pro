<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>CM_Pro Admin — App Versions</title>

<meta name="theme-color" content="#002D6B">

<!-- theme flash-prevention -->
<script>
  document.documentElement.setAttribute(
    "data-theme",
    localStorage.getItem("cm_theme") || "light"
  );
</script>

<script src="/CM_Pro/config/api.js"></script>

<!-- auth guard: redirects away if not a logged-in admin -->
<script src="/CM_Pro/assets/js/admin/admin-loader.js"></script>

<!-- ========================= -->
<!-- STYLES -->
<!-- ========================= -->
<link rel="stylesheet" href="/CM_Pro/assets/css/base.css">
<link rel="stylesheet" href="/CM_Pro/assets/css/admin.css">

</head>
<body data-adm-page="versions">

<div class="adm-page">
  <div class="adm-shell">

    <!-- ========================= -->
    <!-- SIDEBAR (auto-rendered by admin-nav.js) -->
    <!-- ========================= -->
    <aside class="adm-sidebar">
      <div class="adm-sidebar-brand">CM_Pro Admin</div>
      <nav id="admSidebar"></nav>
    </aside>

    <!-- ========================= -->
    <!-- MAIN -->
    <!-- ========================= -->
    <main class="adm-main">

      <!-- ========================= -->
      <!-- HEADER -->
      <!-- ========================= -->
      <div class="adm-header">
        <div class="adm-title-block">
          <h1>App Versions · កំណែកម្មវិធី</h1>
          <p>Publish new Excel workbook builds and manage version history</p>
        </div>
        <div class="adm-header-right">
          <span class="adm-user-chip" id="admUserLabel">Admin</span>
          <div class="adm-topbar-actions" id="admTopbarActions"></div>
        </div>
      </div>

      <!-- ========================= -->
      <!-- CURRENT VERSION HERO CARD -->
      <!-- ========================= -->
      <div class="adm-card adm-version-hero" id="avHeroCard">
        <div class="adm-render-loading" id="avHeroLoading">Loading current version…</div>
        <div id="avHeroBody" hidden>
          <div class="adm-version-hero-top">
            <div>
              <div class="adm-card-label">Current Version</div>
              <div class="adm-version-hero-number" id="avHeroVersion">—</div>
            </div>
            <span class="adm-badge" id="avHeroMandatory"></span>
          </div>
          <div class="adm-version-hero-meta">
            <span id="avHeroFilename"></span> · <span id="avHeroSize"></span> · <span id="avHeroReleased"></span>
          </div>
          <p class="adm-modal-message" id="avHeroNotes"></p>
          <div class="adm-version-hero-actions">
            <button type="button" class="adm-btn adm-btn-primary" id="avHeroDownload">⬇️ Download Latest</button>
          </div>
        </div>
        <div class="adm-render-setup" id="avHeroEmpty" hidden>No version has been published yet.</div>
      </div>

      <!-- ========================= -->
      <!-- TOOLBAR -->
      <!-- ========================= -->
      <div class="adm-toolbar">
        <div class="adm-toolbar-spacer"></div>
        <button type="button" class="adm-btn adm-btn-primary" id="avBtnUpload">+ Upload New Version</button>
      </div>

      <div class="adm-toolbar" style="margin-top:0;">
        <div class="adm-toolbar-spacer"></div>
        <button type="button" class="adm-btn adm-btn-danger" id="avBtnCleanup">🧹 Clean Up Old Versions</button>
      </div>

      <!-- ========================= -->
      <!-- VERSION HISTORY TABLE -->
      <!-- ========================= -->
      <div class="adm-card adm-users-list-card">
        <div class="adm-card-label" style="padding:16px 16px 0;">Version History</div>
        <div class="adm-users-table-wrap">
          <table class="adm-table">
            <thead>
              <tr>
                <th>Version</th>
                <th>Size</th>
                <th>Type</th>
                <th>Notes</th>
                <th>Released</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="avTableBody"></tbody>
          </table>
          <div class="adm-table-empty" id="avTableEmpty" hidden>No versions uploaded yet.</div>
        </div>
      </div>

    </main>

  </div>
</div>

<!-- Upload New Version form template -->
<template id="avUploadTemplate">
  <form id="avUploadForm">
    <div class="adm-form-grid">
      <label class="adm-field">
        <span>Version</span>
        <input type="text" id="avFormVersion" placeholder="e.g. 1.4.2" autocomplete="off">
      </label>

      <label class="adm-field">
        <span>Mandatory Update</span>
        <select id="avFormMandatory">
          <option value="false">Optional</option>
          <option value="true">Mandatory</option>
        </select>
      </label>

      <label class="adm-field adm-field-wide">
        <span>Release Notes</span>
        <input type="text" id="avFormNotes" placeholder="What changed in this version" autocomplete="off">
      </label>

      <label class="adm-field adm-field-wide">
        <span>Workbook File (.xlsb / .xlsm)</span>
        <input type="file" id="avFormFile" accept=".xlsb,.xlsm,.xls,.xlsx">
      </label>
    </div>

    <p class="adm-modal-message" id="avUploadStatus" hidden></p>

    <div class="adm-modal-footer">
      <button type="button" class="adm-btn" id="avFormCancel">Cancel</button>
      <button type="submit" class="adm-btn adm-btn-primary" id="avFormSubmit">Upload</button>
    </div>
  </form>
</template>

<!-- Edit Version form template -->
<template id="avEditTemplate">
  <form id="avEditForm">
    <div class="adm-form-grid">
      <label class="adm-field">
        <span>Type</span>
        <select id="avEditMandatory">
          <option value="false">Optional</option>
          <option value="true">Mandatory</option>
        </select>
      </label>

      <label class="adm-field adm-field-wide">
        <span>Release Notes</span>
        <input type="text" id="avEditNotes" autocomplete="off">
      </label>
    </div>

    <p class="adm-modal-message">Version number and the workbook file itself can't be changed here — upload a new version for that.</p>

    <div class="adm-modal-footer">
      <button type="button" class="adm-btn" id="avEditCancel">Cancel</button>
      <button type="submit" class="adm-btn adm-btn-primary" id="avEditSubmit">Save Changes</button>
    </div>
  </form>
</template>

<script src="/CM_Pro/shared/logout.js"></script>
<script src="/CM_Pro/assets/js/admin/admin-ui.js"></script>
<script src="/CM_Pro/assets/js/admin/admin-nav.js"></script>
<script src="/CM_Pro/assets/js/admin/admin-appversions.js"></script>

</body>
</html>
