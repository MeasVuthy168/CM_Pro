<div id="bottomnav-container"></div>

<!-- ========================= -->
<!-- COMPONENT LOADER -->
<!-- ========================= -->

<script>

let loaded=0;

async function loadComponent(id,file){

try{

const useCache=

id!=="topbar-container";

const cached=

useCache

?

sessionStorage.getItem(

"comp_"+id

)

:

null;

if(cached){

document.getElementById(id).innerHTML=

cached;

}else{

const response=

await fetch(file);

const html=

await response.text();

document.getElementById(id).innerHTML=

html;

if(useCache){

sessionStorage.setItem(

"comp_"+id,

html

);

}

}

if(id==="topbar-container"){

initTopbar({

title:"Average Turnover",

showBack:true,

showLogo:false,

showProfile:false

});

}

}catch(error){

console.error(error);

}finally{

loaded++;

if(loaded>=2){

setTimeout(()=>{

if(typeof hideGlobalSplash==="function"){

hideGlobalSplash();

}

},300);

}

}

}

function updateOnlineStatus(){

document.getElementById(

"offlineBanner"

).style.display=

navigator.onLine

?

"none"

:

"block";

}

window.addEventListener(

"online",

updateOnlineStatus

);

window.addEventListener(

"offline",

updateOnlineStatus

);

updateOnlineStatus();

loadComponent(

"topbar-container",

"/CM_Pro/components/topbar.html"

);

loadComponent(

"bottomnav-container",

"/CM_Pro/components/bottomnav.html"

);

// =========================
// Notification Badge
// =========================

setTimeout(()=>{

if(typeof loadNotificationBadge==="function"){

loadNotificationBadge();

}

},500);  

</script>
  
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="../../assets/js/logo-base64.js"></script>
<script src="../../assets/js/turnover.js"></script>
