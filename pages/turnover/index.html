<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Average Debit Turnover</title>

<meta
name="theme-color"
content="#032d73">

<!-- Applied before any CSS loads, so there's no flash of the wrong
     theme on page load. Keep this as the very first thing in <head>. -->
<script>
  document.documentElement.setAttribute(
    "data-theme",
    localStorage.getItem("cm_theme") || "light"
  );
</script>

<link
rel="stylesheet"
href="../../assets/css/main.css">

<link
rel="stylesheet"
href="../../assets/css/turnover.css">

<link
rel="stylesheet"
href="/CM_Pro/assets/css/global-splash.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/toast.css">

</head>

<body>

<!-- ========================= -->
<!-- OFFLINE -->
<!-- ========================= -->

<div id="offlineBanner">

⚠️ No Internet Connection

</div>

<!-- ========================= -->
<!-- CONFIG -->
<!-- ========================= -->

<script src="../../config/api.js"></script>

<script src="../../config/auth.js"></script>

<script src="../../config/session.js"></script>

<!-- ========================= -->
<!-- COMPONENT -->
<!-- ========================= -->

<script src="/CM_Pro/shared/topbar.js"></script>

<script src="/CM_Pro/shared/theme.js"></script>

<script src="/CM_Pro/assets/js/global-splash.js"></script>

<script src="/CM_Pro/assets/js/toast.js"></script>

<!-- ========================= -->
<!-- TOPBAR -->
<!-- ========================= -->

<div id="topbar-container"></div>

<!-- ========================= -->
<!-- PAGE -->
<!-- ========================= -->

<div class="page-container">

<div class="form-card">

<div class="form-group">

<label>

Prepared Date

</label>

<input

type="date"

id="preparedDate"

>

</div>

<div class="form-group">

<label>

CIF

</label>

<input

type="text"

id="inputCIF"

placeholder="Input CIF"

autocomplete="off"

>

</div>

<div class="form-group">

<label>

Customer Name

</label>

<input

type="text"

id="customerName"

readonly

>

</div>

<div class="button-row">

<button id="btnSearch">

Search

</button>

<button id="btnExcel">

Excel

</button>

<button id="btnPDF">

PDF

</button>

</div>

</div>

<!-- ========================= -->
<!-- TABLE -->
<!-- ========================= -->

<div class="table-card">

<table id="turnoverTable">

<thead>

<tr>

<th>Month</th>
<th>AMT_IN</th>
<th>CURRENT_OD</th>
<th>TURNOVER</th>
<th>EFFECTIVE_DATE</th>

</tr>

</thead>

<tbody id="tbodyTurnover">

<tr>

<td colspan="5">

Please Search

</td>

</tr>

</tbody>

<tfoot>

<tr>

<td>

Average

</td>

<td id="avgDebit">

-

</td>

<td id="avgOD">

-

</td>

<td id="avgTurnover">

-

</td>

<td></td>

</tr>

</tfoot>

</table>

</div>

</div>

<!-- ========================= -->
<!-- LOADING -->
<!-- ========================= -->

<div
id="loadingBox"
class="loading-box"
style="display:none;">

<div class="spinner"></div>

</div>

<!-- ========================= -->
<!-- BOTTOM -->
<!-- ========================= -->

<div id="bottomnav-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<!-- NOTIFICATION BADGE -->

<script src="/CM_Pro/assets/js/notification-badge.js"></script>

<!-- TURNOVER LOGIC -->

<script src="../../assets/js/turnover.js"></script>

<!-- PAGE LOADER (component loader, offline, notification badge) -->

<script src="../../assets/js/turnover-loader.js"></script>

</body>

</html>
