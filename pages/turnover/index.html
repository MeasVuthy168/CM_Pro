<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Average Debit Turnover</title>

<meta
name="theme-color"
content="#0e1b3c">

<!-- Applied before any CSS loads, so there's no flash of the wrong
     theme on page load. Keep this as the very first thing in <head>. -->
<script>
  document.documentElement.setAttribute(
    "data-theme",
    (function(){var t=localStorage.getItem("cm_theme")||"auto";return t==="auto"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;})()
  );
</script>

<link
rel="stylesheet"
href="../../assets/css/main.css">

<link
rel="stylesheet"
href="../../assets/css/turnover.css">

<link
rel="stylesheet"
href="/CM_Pro/assets/css/global-splash.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/toast.css">

</head>

<body>

<!-- ========================= -->
<!-- OFFLINE -->
<!-- ========================= -->

<div id="offlineBanner" data-i18n="common.offline">

No Internet Connection

</div>

<!-- ========================= -->
<!-- CONFIG -->
<!-- ========================= -->

<script src="../../config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>

<script src="../../config/auth.js"></script>

<script src="../../config/session.js"></script>

<!-- ========================= -->
<!-- COMPONENT -->
<!-- ========================= -->

<script src="/CM_Pro/shared/topbar.js"></script>

<script src="/CM_Pro/shared/theme.js"></script>

<script src="/CM_Pro/shared/language.js"></script>

<script src="/CM_Pro/shared/i18n.js"></script>

<script src="/CM_Pro/shared/i18n/common.js"></script>

<script src="/CM_Pro/shared/i18n/core.js"></script>

<script src="/CM_Pro/shared/i18n/features.js"></script>

<script src="/CM_Pro/assets/js/global-splash.js"></script>

<script src="/CM_Pro/assets/js/toast.js"></script>

<!-- ========================= -->
<!-- TOPBAR -->
<!-- ========================= -->

<div id="topbar-container"></div>

<!-- ========================= -->
<!-- PAGE -->
<!-- ========================= -->

<div class="page-container">

<!-- SEARCH -->

<div class="form-card">

<div class="form-grid">

<div class="form-group">

<label for="inputCIF">CIF</label>

<div class="tvr-input-wrap">

<span class="ui-ico ui-ico-search tvr-input-ico" aria-hidden="true"></span>

<input
type="text"
id="inputCIF"
placeholder="Input CIF"
data-i18n-placeholder="turnover.inputCifPlaceholder"
inputmode="numeric"
enterkeyhint="search"
autocomplete="off">

<button type="button" id="btnClearCIF" class="tvr-clear" aria-label="Clear" hidden>
<span class="ui-ico ui-ico-close" aria-hidden="true"></span>
</button>

</div>

</div>

<div class="form-group">

<label for="preparedDate" data-i18n="turnover.preparedDateLabel">Prepared Date</label>

<input type="date" id="preparedDate">

</div>

</div>

<!-- Kept as a hidden field: the PDF/Excel exports read the
     customer name from here. It's shown in the summary card. -->
<input type="hidden" id="customerName">

<button type="button" id="btnSearch" class="tvr-search-btn">
<span class="ui-ico ui-ico-search" aria-hidden="true"></span>
<span data-i18n="common.search">Search</span>
</button>

</div>

<!-- EMPTY STATE (before search) -->

<div id="tvrEmpty" class="tvr-empty">

<div class="tvr-empty-ico"><span class="ui-ico ui-ico-search" aria-hidden="true"></span></div>

<div class="tvr-empty-title" data-i18n="turnover.emptyTitle">Search by CIF</div>

<div class="tvr-empty-text" data-i18n="turnover.emptyText">Enter a CIF to see 12 months of debit turnover.</div>

</div>

<!-- RESULT SUMMARY -->

<div id="tvrSummary" class="tvr-summary" hidden>

<div class="tvr-sum-head">

<div class="tvr-sum-who">

<div class="tvr-sum-name" id="tvrSumName">-</div>

<div class="tvr-sum-meta">
<span class="ui-ico ui-ico-idcard" aria-hidden="true"></span>
<span id="tvrSumCif">-</span>
<span class="tvr-dot">•</span>
<span class="ui-ico ui-ico-calendar" aria-hidden="true"></span>
<span id="tvrSumDate">-</span>
</div>

</div>

<div class="tvr-coverage" id="tvrCoverage">
<b id="tvrCoverageNum">0/12</b>
<span data-i18n="turnover.monthsWithData">months with data</span>
</div>

</div>

<div class="tvr-kpis">

<div class="tvr-kpi tvr-kpi-main">
<div class="tvr-kpi-label"><span data-i18n="turnover.kpiAvgTurnover3">មធ្យម TURNOVER (៣ ខែចុងក្រោយ)</span></div>
<div class="tvr-kpi-value" id="kpiTurnover">-</div>
<div class="tvr-kpi-note" id="kpiTurnoverNote"></div>
</div>

<div class="tvr-kpi">
<div class="tvr-kpi-label"><span data-i18n="turnover.kpiMaxOD">ទឹកប្រាក់ដកសល់ធំជាងគេ</span></div>
<div class="tvr-kpi-value" id="kpiMaxOD">-</div>
<div class="tvr-kpi-note" id="kpiMaxODNote"></div>
</div>

</div>

<div class="button-row">

<button type="button" id="btnExcel" class="tvr-export tvr-export-xls" disabled>
<span class="tvr-file-badge">XLS</span>
<span data-i18n="turnover.excelBtn">Excel</span>
</button>

<button type="button" id="btnPDF" class="tvr-export tvr-export-pdf" disabled>
<span class="tvr-file-badge">PDF</span>
<span data-i18n="turnover.pdfBtn">PDF</span>
</button>

</div>

</div>

<!-- ========================= -->
<!-- TABLE -->
<!-- ========================= -->

<div class="table-card" id="tvrTableCard" hidden>

<div class="tvr-table-head">
<span data-i18n="turnover.monthlyDetail">Monthly detail</span>
<span class="tvr-legend"><i class="tvr-legend-nd"></i><span data-i18n="turnover.noData">No Data</span></span>
</div>

<div class="table-scroll">

<table id="turnoverTable">

<thead>

<tr>

<th data-i18n="turnover.colMonth">Month</th>
<th>AMT_IN</th>
<th>CURRENT_OD</th>
<th>TURNOVER</th>
<th>EFFECTIVE_DATE</th>

</tr>

</thead>

<tbody id="tbodyTurnover">

<tr>

<td colspan="5" data-i18n="turnover.pleaseSearch">

Please Search

</td>

</tr>

</tbody>

<tfoot>

<tr>

<td data-i18n="turnover.averageLabel">Average</td>

<td id="avgDebit">-</td>

<td id="avgOD">-</td>

<td id="avgTurnover">-</td>

<td></td>

</tr>

</tfoot>

</table>

</div>

</div>

</div>

<!-- ========================= -->
<!-- LOADING -->
<!-- ========================= -->

<div
id="loadingBox"
class="loading-box"
style="display:none;">

<div class="spinner"></div>

</div>

<!-- ========================= -->
<!-- BOTTOM -->
<!-- ========================= -->

<div id="bottomnav-container"></div>

<!-- xlsx-js-style: SheetJS fork (same XLSX API) that also writes cell styles -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

<script src="/CM_Pro/shared/export-kit.js"></script>

<!-- NOTIFICATION BADGE -->

<script src="/CM_Pro/assets/js/notification-badge.js"></script>

<!-- TURNOVER LOGIC -->

<script src="../../assets/js/turnover.js"></script>

<!-- PAGE LOADER (component loader, offline, notification badge) -->

<script src="../../assets/js/turnover-loader.js"></script>

</body>

</html>
