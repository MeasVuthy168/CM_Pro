<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>Notifications - CM_Pro</title>

<meta name="theme-color" content="#0e1b3c">

<meta
name="apple-mobile-web-app-capable"
content="yes"
>

<meta
name="apple-mobile-web-app-status-bar-style"
content="black-translucent"
>

<!-- Applied before any CSS loads, so there's no flash of the wrong
     theme on page load. Keep this as the very first thing in <head>. -->
<script>
  document.documentElement.setAttribute(
    "data-theme",
    (function(){var t=localStorage.getItem("cm_theme")||"auto";return t==="auto"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;})()
  );
</script>

<link
rel="stylesheet"
href="../../assets/css/main.css"
>

<link
rel="stylesheet"
href="../../assets/css/notification.css"
>

<link
rel="stylesheet"
href="/CM_Pro/assets/css/global-splash.css"
>

<!-- Hold the first paint until the whole page is parsed (its scripts,
     translations and header), so a page transition slides in a finished
     page instead of one still filling itself in. No element has this id:
     the hold simply ends when parsing does. -->
<link rel="expect" href="#cm-pt-parsed" blocking="render">
<link rel="preload" href="/CM_Pro/assets/fonts/Krasar-Regular.ttf" as="font" type="font/ttf" crossorigin>
<script src="/CM_Pro/shared/page-transition.js"></script>
<script src="/CM_Pro/shared/sw-register.js"></script>
</head>

<body>

<!-- OFFLINE -->

<div id="offlineBanner" data-i18n="common.offline">

No Internet Connection

</div>

<!-- API -->

<script src="../../config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>

<!-- AUTH -->

<script src="../../config/auth.js"></script>

<!-- SESSION -->

<script src="../../config/session.js"></script>

<!-- PUSH -->

<script src="../../config/push.js"></script>

<!-- TOPBAR -->

<script src="/CM_Pro/shared/topbar.js"></script>

<!-- THEME -->

<script src="/CM_Pro/shared/theme.js"></script>

<!-- LANGUAGE / I18N -->

<script src="/CM_Pro/shared/language.js"></script>
<script src="/CM_Pro/shared/i18n.js"></script>
<script src="/CM_Pro/shared/i18n/common.js"></script>
<script src="/CM_Pro/shared/i18n/core.js"></script>
<script src="/CM_Pro/shared/i18n/features.js"></script>

<!-- SPLASH -->

<script src="/CM_Pro/assets/js/global-splash.js"></script>

<!-- TOAST -->

<script src="/CM_Pro/assets/js/toast.js"></script>

<!-- TOPBAR -->

<div id="topbar-container"></div>

<!-- NOTIFICATION MENU -->

<div
    id="notificationMenu"
    class="notification-menu"
>

    <button
        id="menuReadAll"
        class="notification-menu-item"
    >
        <span class="nt-ico nt-ico-read-all" aria-hidden="true"></span>
        <span data-i18n="notifications.readAll">Read All</span>
    </button>

    <button
        id="menuDeleteAll"
        class="notification-menu-item"
    >
        <span class="nt-ico nt-ico-delete-all" aria-hidden="true"></span>
        <span data-i18n="notifications.deleteAll">Delete All</span>
    </button>

</div>

<!-- CONTENT -->

<div class="page-container">

    <!-- HIDDEN READ ALL -->

    <button
        id="readAllBtn"
        style="display:none;"
        data-i18n="notifications.readAll"
    >
        Read All
    </button>

    <!-- SUMMARY (always the whole list, whatever the filters) -->
    <div class="notify-summary">

        <div class="summary-card summary-card-unread">
            <div class="summary-label" data-i18n="notifications.unread">Unread</div>
            <div class="summary-value" id="unreadCount">0</div>
        </div>

        <div class="summary-card">
            <div class="summary-label" data-i18n="common.total">Total</div>
            <div class="summary-value" id="totalCount">0</div>
        </div>

        <div class="summary-card">
            <div class="summary-label" data-i18n="notifications.today">Today</div>
            <div class="summary-value" id="todayCount">0</div>
        </div>

    </div>

    <!-- PULL TO REFRESH (replaces the old static Refresh button — see
         the "PULL TO REFRESH" section in notification.js) -->
    <div class="pull-refresh-indicator" id="pullRefreshIndicator">
        <div class="pull-refresh-spinner"></div>
    </div>

    <!-- STATUS FILTER (All / Unread / Read, with counts) -->
    <div class="notify-filter-tabs" id="notifyFilterTabs" role="tablist" data-i18n-aria-label="notifications.statusFilter">
        <button type="button" class="notify-filter-tab active" data-filter="all" role="tab" aria-selected="true">
            <span data-i18n="notifications.all">ទាំងអស់</span><span class="tab-count" data-count="all">0</span>
        </button>
        <button type="button" class="notify-filter-tab" data-filter="unread" role="tab" aria-selected="false">
            <span data-i18n="notifications.unread">មិនទាន់អាន</span><span class="tab-count" data-count="unread">0</span>
        </button>
        <button type="button" class="notify-filter-tab" data-filter="read" role="tab" aria-selected="false">
            <span data-i18n="notifications.read">បានអាន</span><span class="tab-count" data-count="read">0</span>
        </button>
    </div>

    <!-- SEARCH + SORT (local only, over the list already loaded) -->
    <div class="notify-tools">
        <div class="notify-search">
            <span class="notify-search-ico" aria-hidden="true"></span>
            <input type="search" id="notifySearch" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search"
                data-i18n-placeholder="notifications.searchPlaceholder" data-i18n-aria-label="notifications.searchPlaceholder"
                placeholder="ស្វែងរកការជូនដំណឹង…">
            <button type="button" id="notifySearchClear" class="notify-search-clear" hidden
                data-i18n-aria-label="notifications.clearSearch" data-i18n-title="notifications.clearSearch">
                <span aria-hidden="true">×</span>
            </button>
        </div>
        <select id="notifySort" class="notify-sort" data-i18n-aria-label="notifications.sortBy" data-i18n-title="notifications.sortBy">
            <option value="newest" data-i18n="notifications.newestFirst" selected>ថ្មីបំផុតមុន</option>
            <option value="oldest" data-i18n="notifications.oldestFirst">ចាស់បំផុតមុន</option>
            <option value="unread" data-i18n="notifications.unreadFirst">មិនទាន់អានមុន</option>
        </select>
    </div>

    <!-- CATEGORY CHIPS (scroll sideways on a narrow screen) -->
    <div class="notify-chips" id="notifyChips" role="tablist" data-i18n-aria-label="notifications.typeFilter">
        <button type="button" class="notify-chip active" data-cat="all" role="tab" aria-selected="true"><span data-i18n="notifications.allTypes">គ្រប់ប្រភេទ</span><span class="notify-chip-count">0</span></button>
        <button type="button" class="notify-chip" data-cat="reasonArrear" role="tab" aria-selected="false"><span data-i18n="notifications.reasonArrear">Reason Arrear</span><span class="notify-chip-count">0</span></button>
        <button type="button" class="notify-chip" data-cat="system" role="tab" aria-selected="false"><span data-i18n="notifications.system">ប្រព័ន្ធ</span><span class="notify-chip-count">0</span></button>
        <button type="button" class="notify-chip" data-cat="reports" role="tab" aria-selected="false"><span data-i18n="notifications.reports">របាយការណ៍</span><span class="notify-chip-count">0</span></button>
        <button type="button" class="notify-chip" data-cat="security" role="tab" aria-selected="false"><span data-i18n="notifications.security">សុវត្ថិភាព</span><span class="notify-chip-count">0</span></button>
        <button type="button" class="notify-chip" data-cat="userActivity" role="tab" aria-selected="false"><span data-i18n="notifications.userActivity">សកម្មភាពអ្នកប្រើ</span><span class="notify-chip-count">0</span></button>
        <button type="button" class="notify-chip" data-cat="other" role="tab" aria-selected="false"><span data-i18n="notifications.other">ផ្សេងៗ</span><span class="notify-chip-count">0</span></button>
    </div>

    <!-- LIST -->

    <div
        class="notify-list"
        id="notifyList"
    ></div>

    <!-- EMPTY -->

    <div
        class="empty-box"
        id="emptyBox"
        style="display:none;"
    >

        <div
            id="emptyRobotSlot"
            class="empty-img"
        ></div>

        <div class="empty-title" id="emptyTitle" data-i18n="notifications.emptyTitle">

            No Notifications

        </div>

        <div class="empty-subtitle" id="emptySubtitle" data-i18n="notifications.emptySubtitle">

            Everything is up to date

        </div>

        <button type="button" class="refresh-btn" id="emptyClearBtn" hidden data-i18n="notifications.clearSearch">
            សម្អាតការស្វែងរក
        </button>

    </div>

    <!-- ERROR (distinct from empty — a failed load looks nothing like
         "genuinely zero notifications") -->

    <div
        class="empty-box"
        id="errorBox"
        style="display:none;"
    >

        <div class="error-icon"><span class="ui-ico ui-ico-alert" aria-hidden="true"></span></div>

        <div class="empty-title" data-i18n="notifications.errorTitle">

            មិនអាចផ្ទុកបានទេ

        </div>

        <div class="empty-subtitle" data-i18n="notifications.errorSubtitle">

            សូមពិនិត្យការតភ្ជាប់អ៊ីនធឺណិត ហើយសាកល្បងម្តងទៀត

        </div>

        <button type="button" class="refresh-btn" id="errorRetryBtn" data-i18n="common.retry">
            ព្យាយាមម្តងទៀត
        </button>

    </div>

    <!-- LOADING -->

    <div
        class="loading-box"
        id="loadingBox"
        style="display:none;"
    >

        <div class="spinner"></div>

    </div>

</div>

<!-- DELETE ALL CONFIRM (replaces the native confirm() popup with a
     dialog that matches the rest of the app's style) -->

<div id="deleteAllDialog" class="dialog">

    <div class="dialog-box">

        <div class="dialog-title" data-i18n="notifications.deleteAllConfirm">

            តើអ្នកពិតជាចង់លុបការជូនដំណឹងទាំងអស់មែនទេ?

        </div>

        <div class="dialog-buttons">

            <button id="btnDeleteAllYes" data-i18n="common.delete">លុប</button>

            <button id="btnDeleteAllNo" data-i18n="common.cancel">បោះបង់</button>

        </div>

    </div>

</div>

<!-- DELETE ONE CONFIRM (the bin button on a card; a swipe-left
     still deletes straight away, as before) -->
<div id="deleteOneDialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="deleteOneTitle">

    <div class="dialog-box">

        <div class="dialog-title" id="deleteOneTitle" data-i18n="notifications.deleteOneConfirm">
            តើអ្នកចង់លុបការជូនដំណឹងនេះមែនទេ?
        </div>

        <div class="dialog-buttons">

            <button id="btnDeleteOneYes" data-i18n="common.delete">លុប</button>

            <button id="btnDeleteOneNo" data-i18n="common.cancel">បោះបង់</button>

        </div>

    </div>

</div>

<!-- BOTTOM NAV -->

<div id="bottomnav-container"></div>

<!-- NOTIFICATION BADGE -->

<script src="/CM_Pro/assets/js/notification-badge.js"></script>

<!-- NOTIFICATION DATA/RENDER LOGIC -->

<script src="../../assets/js/notification.js"></script>

<!-- PAGE LOADER (component loader, menu, offline, push, splash) -->

<script src="../../assets/js/notification-loader.js"></script>

<!-- ROBOT MASCOT (empty-state icon) -->
<!-- Inlined (not an <img>) for the same reason as the Home page's —
     see assets/js/robot-embed.js. Idles on its own once embedded; no
     explicit greet() here, this isn't a greeting card. -->
<script src="/CM_Pro/assets/js/robot-animator.js"></script>
<script src="/CM_Pro/assets/js/robot-embed.js"></script>
<script>
  embedCMProRobot(document.getElementById("emptyRobotSlot"), {
    src: "../../assets/images/robot.svg",
  });
</script>

</body>

</html>
