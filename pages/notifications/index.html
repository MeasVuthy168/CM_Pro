<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>Notifications - CM_Pro</title>

<meta name="theme-color" content="#032d73">

<meta
name="apple-mobile-web-app-capable"
content="yes"
>

<meta
name="apple-mobile-web-app-status-bar-style"
content="black-translucent"
>

<!-- Applied before any CSS loads, so there's no flash of the wrong
     theme on page load. Keep this as the very first thing in <head>. -->
<script>
  document.documentElement.setAttribute(
    "data-theme",
    localStorage.getItem("cm_theme") || "light"
  );
</script>

<link
rel="stylesheet"
href="../../assets/css/main.css"
>

<link
rel="stylesheet"
href="../../assets/css/notification.css"
>

<link
rel="stylesheet"
href="/CM_Pro/assets/css/global-splash.css"
>

</head>

<body>

<!-- OFFLINE -->

<div id="offlineBanner">

⚠️ No Internet Connection

</div>

<!-- API -->

<script src="../../config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>

<!-- AUTH -->

<script src="../../config/auth.js"></script>

<!-- SESSION -->

<script src="../../config/session.js"></script>

<!-- PUSH -->

<script src="../../config/push.js"></script>

<!-- TOPBAR -->

<script src="/CM_Pro/shared/topbar.js"></script>

<!-- THEME -->

<script src="/CM_Pro/shared/theme.js"></script>

<!-- SPLASH -->

<script src="/CM_Pro/assets/js/global-splash.js"></script>

<!-- TOAST -->

<script src="/CM_Pro/assets/js/toast.js"></script>

<!-- TOPBAR -->

<div id="topbar-container"></div>

<!-- NOTIFICATION MENU -->

<div
    id="notificationMenu"
    class="notification-menu"
>

    <button
        id="menuReadAll"
        class="notification-menu-item"
    >
        <img src="/CM_Pro/assets/icons/notification/reading.png" class="menu-icon">
        Read All
    </button>

    <button
        id="menuDeleteAll"
        class="notification-menu-item"
    >
        <img src="/CM_Pro/assets/icons/notification/trash.png" class="menu-icon">
        Delete All
    </button>

</div>

<!-- CONTENT -->

<div class="page-container">

    <!-- HIDDEN READ ALL -->

    <button
        id="readAllBtn"
        style="display:none;"
    >
        Read All
    </button>

    <!-- SUMMARY -->

    <div class="notify-summary">

        <div class="summary-card">

            <div class="summary-label">

                Unread

            </div>

            <div
                class="summary-value"
                id="unreadCount"
            >

                0

            </div>

        </div>

        <div class="summary-card">

            <div class="summary-label">

                Total

            </div>

            <div
                class="summary-value"
                id="totalCount"
            >

                0

            </div>

        </div>

    </div>

    <!-- PULL TO REFRESH (replaces the old static Refresh button — see
         the "PULL TO REFRESH" section in notification.js) -->

    <div class="pull-refresh-indicator" id="pullRefreshIndicator">
        <div class="pull-refresh-spinner"></div>
    </div>

    <!-- FILTER TABS -->

    <div class="notify-filter-tabs" id="notifyFilterTabs">

        <button type="button" class="notify-filter-tab active" data-filter="all">
            ទាំងអស់
        </button>

        <button type="button" class="notify-filter-tab" data-filter="unread">
            មិនទាន់អាន
        </button>

    </div>

    <!-- LIST -->

    <div
        class="notify-list"
        id="notifyList"
    ></div>

    <!-- EMPTY -->

    <div
        class="empty-box"
        id="emptyBox"
        style="display:none;"
    >

        <div
            id="emptyRobotSlot"
            class="empty-img"
        ></div>

        <div class="empty-title" id="emptyTitle">

            No Notifications

        </div>

        <div class="empty-subtitle" id="emptySubtitle">

            Everything is up to date 🎉

        </div>

    </div>

    <!-- ERROR (distinct from empty — a failed load looks nothing like
         "genuinely zero notifications") -->

    <div
        class="empty-box"
        id="errorBox"
        style="display:none;"
    >

        <div class="error-icon">⚠️</div>

        <div class="empty-title">

            មិនអាចផ្ទុកបានទេ

        </div>

        <div class="empty-subtitle">

            សូមពិនិត្យការតភ្ជាប់អ៊ីនធឺណិត ហើយសាកល្បងម្តងទៀត

        </div>

        <button type="button" class="refresh-btn" id="errorRetryBtn">
            ព្យាយាមម្តងទៀត
        </button>

    </div>

    <!-- LOADING -->

    <div
        class="loading-box"
        id="loadingBox"
    >

        <div class="spinner"></div>

    </div>

</div>

<!-- DELETE ALL CONFIRM (replaces the native confirm() popup with a
     dialog that matches the rest of the app's style) -->

<div id="deleteAllDialog" class="dialog">

    <div class="dialog-box">

        <div class="dialog-title">

            តើអ្នកពិតជាចង់លុបការជូនដំណឹងទាំងអស់មែនទេ?

        </div>

        <div class="dialog-buttons">

            <button id="btnDeleteAllYes">លុប</button>

            <button id="btnDeleteAllNo">បោះបង់</button>

        </div>

    </div>

</div>

<!-- BOTTOM NAV -->

<div id="bottomnav-container"></div>

<!-- NOTIFICATION BADGE -->

<script src="/CM_Pro/assets/js/notification-badge.js"></script>

<!-- NOTIFICATION DATA/RENDER LOGIC -->

<script src="../../assets/js/notification.js"></script>

<!-- PAGE LOADER (component loader, menu, offline, push, splash) -->

<script src="../../assets/js/notification-loader.js"></script>

<!-- ROBOT MASCOT (empty-state icon) -->
<!-- Inlined (not an <img>) for the same reason as the Home page's —
     see assets/js/robot-embed.js. Idles on its own once embedded; no
     explicit greet() here, this isn't a greeting card. -->
<script src="/CM_Pro/assets/js/robot-animator.js"></script>
<script src="/CM_Pro/assets/js/robot-embed.js"></script>
<script>
  embedCMProRobot(document.getElementById("emptyRobotSlot"), {
    src: "../../assets/images/robot.svg",
  });
</script>

</body>

</html>
