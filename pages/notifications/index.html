<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>Notifications - CM_Pro</title>

<meta name="theme-color" content="#032d73">

<meta
name="apple-mobile-web-app-capable"
content="yes"
>

<meta
name="apple-mobile-web-app-status-bar-style"
content="black-translucent"
>

<link
rel="stylesheet"
href="../../assets/css/main.css"
>

<link
rel="stylesheet"
href="../../assets/css/notification.css"
>

<link
rel="stylesheet"
href="/CM_Pro/assets/css/global-splash.css"
>

</head>

<body>

<!-- OFFLINE -->

<div id="offlineBanner">

⚠️ No Internet Connection

</div>

<!-- API -->

<script src="../../config/api.js"></script>

<!-- AUTH -->

<script src="../../config/auth.js"></script>

<!-- SESSION -->

<script src="../../config/session.js"></script>

<!-- PUSH -->

<script src="../../config/push.js"></script>

<!-- TOPBAR -->

<script src="/CM_Pro/shared/topbar.js"></script>

<!-- SPLASH -->

<script src="/CM_Pro/assets/js/global-splash.js"></script>

<!-- TOAST -->

<script src="/CM_Pro/assets/js/toast.js"></script>

<!-- TOPBAR -->

<div id="topbar-container"></div>

<!-- NOTIFICATION MENU -->

<div
    id="notificationMenu"
    class="notification-menu"
>

    <button
        id="menuReadAll"
        class="notification-menu-item"
    >
        <img src="/CM_Pro/assets/icons/notification/reading.png" class="menu-icon">
        Read All
    </button>

    <button
        id="menuDeleteAll"
        class="notification-menu-item"
    >
        <img src="/CM_Pro/assets/icons/notification/trash.png" class="menu-icon">
        Delete All
    </button>

</div>

<!-- CONTENT -->

<div class="page-container">

    <!-- HIDDEN READ ALL -->

    <button
        id="readAllBtn"
        style="display:none;"
    >
        Read All
    </button>

    <!-- SUMMARY -->

    <div class="notify-summary">

        <div class="summary-card">

            <div class="summary-label">

                Unread

            </div>

            <div
                class="summary-value"
                id="unreadCount"
            >

                0

            </div>

        </div>

        <div class="summary-card">

            <div class="summary-label">

                Total

            </div>

            <div
                class="summary-value"
                id="totalCount"
            >

                0

            </div>

        </div>

    </div>

    <!-- REFRESH -->

    <div class="refresh-row">

        <button
            class="refresh-btn"
            id="refreshBtn"
        >

            ⟳ Refresh

        </button>

    </div>

    <!-- LIST -->

    <div
        class="notify-list"
        id="notifyList"
    ></div>

    <!-- EMPTY -->

    <div
        class="empty-box"
        id="emptyBox"
        style="display:none;"
    >

        <img
            src="../../assets/images/robot.svg"
            class="empty-img"
        >

        <div class="empty-title">

            No Notifications

        </div>

        <div class="empty-subtitle">

            Everything is up to date 🎉

        </div>

    </div>

    <!-- LOADING -->

    <div
        class="loading-box"
        id="loadingBox"
    >

        <div class="spinner"></div>

    </div>

</div>

<!-- BOTTOM NAV -->

<div id="bottomnav-container"></div>

<!-- NOTIFICATION BADGE -->

<script src="/CM_Pro/assets/js/notification-badge.js"></script>

<!-- NOTIFICATION DATA/RENDER LOGIC -->

<script src="../../assets/js/notification.js"></script>

<!-- PAGE LOADER (component loader, menu, offline, push, splash) -->

<script src="../../assets/js/notification-loader.js"></script>

</body>

</html>
