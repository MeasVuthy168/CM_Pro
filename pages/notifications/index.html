<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notifications - CM_Pro</title>
    <meta name="theme-color" content="#032d73">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- MAIN CSS -->
    <link rel="stylesheet" href="../../assets/css/main.css">

    <!-- NOTIFICATION CSS -->
    <link rel="stylesheet" href="../../assets/css/notification.css">

    <!-- GLOBAL SPLASH -->
    <link rel="stylesheet" href="/CM_Pro/assets/css/global-splash.css">

    <style>
        /* OFFLINE */
        #offlineBanner {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: #d90429;
            color: #fff;
            padding: 10px 18px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            z-index: 999999;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,.2);
        }
    </style>

</head>
<body>

    <!-- OFFLINE -->
    <div id="offlineBanner">⚠️ No Internet Connection</div>

    <!-- API -->
    <script src="../../config/api.js"></script>

    <!-- AUTH -->
    <script src="../../config/auth.js"></script>

    <!-- SESSION -->
    <script src="../../config/session.js"></script>

    <!-- PUSH -->
    <script src="../../config/push.js"></script>

    <!-- GLOBAL SPLASH -->
    <script src="/CM_Pro/assets/js/global-splash.js"></script>

    <!-- LOGOUT -->
    <script>
        function logout(){
            if(confirm("Logout CM_Pro ?")){
                localStorage.removeItem("token");
                localStorage.removeItem("loggedInUser");
                sessionStorage.clear();
                window.location.replace("/CM_Pro/login.html");
            }
        }
    </script>

    <!-- TOPBAR -->
    <div id="topbar-container"></div>

    <!-- PAGE CONTENT -->
    <div class="page-container">

        <!-- HEADER -->
        <div class="notify-header">
            <button class="back-btn" onclick="history.back()">←</button>
            <div class="notify-title">🔔 Notifications</div>
            <button class="readall-btn" id="readAllBtn">Read All</button>
        </div>

        <!-- SUMMARY -->
        <div class="notify-summary">
            <div class="summary-card">
                <div class="summary-label">Unread</div>
                <div class="summary-value" id="unreadCount">0</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">Total</div>
                <div class="summary-value" id="totalCount">0</div>
            </div>
        </div>

        <!-- REFRESH -->
        <div class="refresh-row">
            <button class="refresh-btn" id="refreshBtn">⟳ Refresh</button>
        </div>

        <!-- LIST -->
        <div class="notify-list" id="notifyList"></div>

        <!-- EMPTY -->
        <div class="empty-box" id="emptyBox" style="display:none;">
            <img src="../../assets/images/robot.svg" class="empty-img">
            <div class="empty-title">No Notifications</div>
            <div class="empty-subtitle">Everything is up to date 🎉</div>
        </div>

        <!-- LOADING -->
        <div class="loading-box" id="loadingBox">
            <div class="spinner"></div>
        </div>

    </div>

    <!-- BOTTOM NAV -->
    <div id="bottomnav-container"></div>

    <!-- MAIN SCRIPT -->
    <script>

        // =========================
        // COMPONENT LOADER
        // =========================
        let loaded = 0;

        async function loadComponent(id, file){
            try{
                const cached = sessionStorage.getItem("comp_" + id);
                if(cached){
                    document.getElementById(id).innerHTML = cached;
                    if(id === "topbar-container") loadTopbarUser();
                } else {
                    const response = await fetch(file);
                    const html = await response.text();
                    document.getElementById(id).innerHTML = html;
                    sessionStorage.setItem("comp_" + id, html);
                    if(id === "topbar-container") loadTopbarUser();
                }
            }catch(error){
                console.error("Component load error:", error);
            }finally{
                loaded++;
                if(loaded >= 2){
                    setTimeout(()=>{
                        if(typeof hideGlobalSplash === "function"){
                            hideGlobalSplash();
                        }
                    }, 300);
                }
            }
        }

        // =========================
        // LOAD USER TO TOPBAR
        // =========================
        function loadTopbarUser(){
            try{
                const loggedInUser = JSON.parse(
                    localStorage.getItem("loggedInUser") || "{}"
                );
                const fullname =
                    loggedInUser.fullname ||
                    loggedInUser.username ||
                    "User";
                const topbarName = document.getElementById("topbarName");
                if(topbarName) topbarName.innerText = `សួស្តី, ${fullname}`;
                if(loggedInUser.image){
                    const profile = document.getElementById("topbarProfile");
                    if(profile) profile.src = loggedInUser.image;
                }
            }catch(error){
                console.error("Topbar user error:", error);
            }
        }

        // =========================
        // OFFLINE DETECT
        // =========================
        function updateOnlineStatus(){
            const banner = document.getElementById("offlineBanner");
            banner.style.display = navigator.onLine ? "none" : "block";
        }
        window.addEventListener("online", updateOnlineStatus);
        window.addEventListener("offline", updateOnlineStatus);
        updateOnlineStatus();

        // =========================
        // LOAD COMPONENTS
        // =========================
        loadComponent("topbar-container", "/CM_Pro/components/topbar.html");
        loadComponent("bottomnav-container", "/CM_Pro/components/bottomnav.html");

        // =========================
        // PUSH INIT
        // =========================
        PushNotification.init();

        // =========================
        // FAILSAFE SPLASH
        // =========================
        window.addEventListener("load", ()=>{
            setTimeout(()=>{
                if(typeof hideGlobalSplash === "function"){
                    hideGlobalSplash();
                }
            }, 2500);
        });

    </script>

    <!-- NOTIFICATION JS -->
    <script src="../../assets/js/notification.js"></script>

</body>
</html>
