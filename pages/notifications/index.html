<!DOCTYPE html>

<meta
name="apple-mobile-web-app-capable"
content="yes"
>

<meta

>

<link
rel="stylesheet"
href="../../assets/css/main.css"
>

<link
rel="stylesheet"
href="../../assets/css/notification.css"
>

<link
rel="stylesheet"
href="/CM_Pro/assets/css/global-splash.css"
>

<style>

#offlineBanner{

position:fixed;

top:10px;

left:50%;

transform:translateX(-50%);

background:#d90429;

color:#fff;

padding:10px 18px;

border-radius:14px;

font-size:14px;

font-weight:600;

z-index:999999;

display:none;

box-shadow:0 4px 15px rgba(0,0,0,.2);

}

.page-container{

display:flex;

overflow:hidden;

}

</style>

</head>

<body>

<!-- OFFLINE -->

<div id="offlineBanner">

⚠️ No Internet Connection

</div>

<!-- API -->

<script src="../../config/api.js"></script>

<!-- AUTH -->

<script src="../../config/auth.js"></script>

<!-- SESSION -->

<script src="../../config/session.js"></script>

<!-- PUSH -->

<script src="../../config/push.js"></script>

<!-- GLOBAL SPLASH -->

<script src="/CM_Pro/assets/js/global-splash.js"></script>

<!-- LOGOUT -->

<script>

function logout(){

if(confirm("Logout CM_Pro ?")){

localStorage.removeItem("token");

localStorage.removeItem("loggedInUser");

sessionStorage.clear();

window.location.replace(
"/CM_Pro/login.html"
);

}

}

</script>

<!-- NOTIFICATION TOPBAR -->

<div
id="notification-topbar-container"
></div>

<!-- PAGE -->

<div class="page-container">

<!-- SUMMARY -->

<div class="notify-summary">

<div class="summary-card">

<div class="summary-label">

Unread

</div>

<div
class="summary-value"
id="unreadCount"
>

0

</div>

</div>

<div class="summary-card">

<div class="summary-label">

Total

</div>

<div
class="summary-value"
id="totalCount"
>

0

</div>

</div>

</div>

<!-- REFRESH -->

<div class="refresh-row">

<button
class="refresh-btn"
id="refreshBtn"
>

⟳ Refresh

</button>

</div>

<!-- LIST -->

<div
class="notify-list"
id="notifyList"
></div>

<!-- EMPTY -->

<div
class="empty-box"
id="emptyBox"
style="display:none;"
>

<img
src="../../assets/images/robot.svg"
class="empty-img"
>

<div class="empty-title">

No Notifications

</div>

<div class="empty-subtitle">

Everything is up to date 🎉

</div>

</div>

<!-- LOADING -->

<div
class="loading-box"
id="loadingBox"
>

<div class="spinner"></div>

</div>

</div>

<!-- BOTTOM NAV -->

<div id="bottomnav-container"></div>

<script>

// =========================
// COMPONENT LOADER
// =========================

let loaded = 0;

async function loadComponent(
id,
file
){

try{

const cached =

sessionStorage.getItem(
"comp_" + id
);

if(cached){

document
.getElementById(id)
.innerHTML = cached;

}else{

const response =
await fetch(file);

const html =
await response.text();

document
.getElementById(id)
.innerHTML = html;

sessionStorage.setItem(
"comp_" + id,
html
);

}

}catch(error){

console.error(
"Component load error:",
error
);

}finally{

loaded++;

if(loaded >= 2){

setTimeout(()=>{

if(
typeof hideGlobalSplash
===
"function"
){

hideGlobalSplash();

}

},300);

}

}

}

// =========================
// OFFLINE STATUS
// =========================

function updateOnlineStatus(){

const banner =

document.getElementById(
"offlineBanner"
);

banner.style.display =

navigator.onLine

? "none"

: "block";

}

window.addEventListener(
"online",
updateOnlineStatus
);

window.addEventListener(
"offline",
updateOnlineStatus
);

updateOnlineStatus();

// =========================
// LOAD COMPONENTS
// =========================

loadComponent(

"notification-topbar-container",

"/CM_Pro/components/topbar_notifications.html"

);

loadComponent(

"bottomnav-container",

"/CM_Pro/components/bottomnav.html"

);

// =========================
// PUSH
// =========================

if(window.PushNotification){

PushNotification.init();

}

// =========================
// READ ALL BUTTON
// =========================

document.addEventListener(

"click",

(e)=>{

if(

e.target.id ===

"topbarReadAllBtn"

){

const btn =

document.getElementById(
"readAllBtn"
);

if(btn){

btn.click();

}

}

}

);

// =========================
// FAILSAFE SPLASH
// =========================

window.addEventListener(

"load",

()=>{

setTimeout(()=>{

if(

typeof hideGlobalSplash
===
"function"

){

hideGlobalSplash();

}

},2500);

}

);

</script>

<!-- NOTIFICATION JS -->

<script src="../../assets/js/notification.js"></script>

</body>

</html>
