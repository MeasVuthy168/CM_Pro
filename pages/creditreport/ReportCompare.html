<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Credit Portfolio Trends</title>

<meta
name="theme-color"
content="#032d73">

<script>
  document.documentElement.setAttribute(
    "data-theme",
    (function(){var t=localStorage.getItem("cm_theme")||"auto";return t==="auto"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;})()
  );
</script>

<link
rel="stylesheet"
href="../../assets/css/main.css">

<link
rel="stylesheet"
href="../../assets/css/creditreport/OfficerProductivity.css">

<link
rel="stylesheet"
href="../../assets/css/creditreport/ReportCompare.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/topbar-menu.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/global-splash.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/toast.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/loading.css">

</head>

<body>

<div id="offlineBanner" data-i18n="common.offline">
⚠️ No Internet Connection
</div>

<script src="../../config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>
<script src="../../config/auth.js"></script>
<script src="../../config/session.js"></script>

<script src="/CM_Pro/shared/topbar.js"></script>
<script src="/CM_Pro/shared/topbar-menu.js"></script>
<script src="/CM_Pro/shared/theme.js"></script>
<script src="/CM_Pro/shared/language.js"></script>
<script src="/CM_Pro/shared/i18n.js"></script>
<script src="/CM_Pro/shared/i18n/common.js"></script>
<script src="/CM_Pro/shared/i18n/core.js"></script>
<script src="/CM_Pro/shared/i18n/creditreport.js"></script>
<script src="/CM_Pro/shared/loading.js"></script>
<script src="/CM_Pro/assets/js/global-splash.js"></script>
<script src="/CM_Pro/assets/js/toast.js"></script>

<div id="topbar-container"></div>

<!-- ========================= -->
<!-- TOPBAR "⋮" MENU — admin only; toggled by shared/topbar-menu.js,
     items wired by ReportCompare.js. -->
<!-- ========================= -->
<div class="topbar-menu" id="topbarMenu">
  <button type="button" class="topbar-menu-item" id="rcMenuSnapshot">
    📸 <span data-i18n="creditreport.menu.snapshot">Snapshot</span>
  </button>
  <button type="button" class="topbar-menu-item" id="rcMenuDeleteSnapshot">
    🗑️ <span data-i18n="creditreport.menu.deleteSnapshot">Delete Snapshot</span>
  </button>
</div>

<!-- ========================= -->
<!-- DELETE SNAPSHOT — calendar picker (op-heat-* classes shared with
     Branch Productivity's own disburse heatmap), per explicit request
     2026-10-08. Highlighted days are the ones with a saved snapshot;
     picking one asks for confirmation before deleting. -->
<!-- ========================= -->
<div class="dialog" id="rcDeleteCalDialog">
  <div class="dialog-box rc-del-cal-box">
    <div class="rc-del-cal-head">
      <div class="dialog-title rc-del-cal-title" data-i18n="creditreport.menu.deleteSnapshot">Delete Snapshot</div>
      <button type="button" class="rc-del-cal-close" id="rcDeleteCalClose" aria-label="Close" data-i18n-aria-label="common.close">✕</button>
    </div>
    <div class="rc-del-cal-sub" data-i18n="creditreport.compare.deleteCalHint">Pick a highlighted date to delete its saved snapshot.</div>
    <div id="rcDeleteCalBody"></div>
  </div>
</div>

<div class="dialog" id="rcDeleteConfirmDialog">
  <div class="dialog-box">
    <div class="dialog-title" id="rcDeleteConfirmText"></div>
    <div class="dialog-buttons">
      <button type="button" class="rc-del-no" id="rcDeleteConfirmNo" data-i18n="common.cancel">Cancel</button>
      <button type="button" class="rc-del-yes" id="rcDeleteConfirmYes" data-i18n="common.delete">Delete</button>
    </div>
  </div>
</div>

<div class="page-container">

<!-- ========================= -->
<!-- DATE PICKER TOOLBAR -->
<!-- ========================= -->
<div class="rc-toolbar" id="rcToolbar">
  <div class="rc-toolbar-dates">
    <div class="rc-date-field">
      <label for="rcDateA" data-i18n="creditreport.compare.fromDate">From Date</label>
      <select id="rcDateA"></select>
    </div>
    <div class="rc-arrow">→</div>
    <div class="rc-date-field">
      <label for="rcDateB" data-i18n="creditreport.compare.toDate">To Date</label>
      <select id="rcDateB"></select>
    </div>
  </div>
  <button type="button" class="rc-compare-btn" id="rcCompareBtn" data-i18n="creditreport.compare.compareBtn">Compare</button>
</div>

<div class="op-empty" id="rcEmpty" style="display:none"></div>

<!-- Skeleton while a comparison is loading -->
<div class="op-page-skel" id="rcPageSkel" style="display:none">
<div class="op-skel-card"></div>
<div class="op-skel-card"></div>
<div class="op-skel-card"></div>
</div>

<!-- ========================= -->
<!-- SECTION TABS + KPI CARD + DIMENSION PICKER -->
<!-- ========================= -->
<div class="op-card rc-shell" id="rcTransitionsCard" style="display:none">

  <div class="rc-main-tabs" id="rcTabs">
    <button type="button" class="rc-main-tab active" data-tab="os">💰 <span data-i18n="creditreport.compare.tabOs">OS</span></button>
    <button type="button" class="rc-main-tab" data-tab="disburse">🏦 <span data-i18n="creditreport.compare.tabDisburse">Disb</span></button>
    <button type="button" class="rc-main-tab" data-tab="t24">⏱ <span data-i18n="creditreport.compare.tabT24">T24 OV</span></button>
    <button type="button" class="rc-main-tab" data-tab="overdue">📉 <span data-i18n="creditreport.compare.tabOverdue">NBC OV</span></button>
    <button type="button" class="rc-main-tab" data-tab="wo">✍️ <span data-i18n="creditreport.compare.tabWo">WO</span></button>
  </div>

  <div class="rc-section-head" id="rcSectionHead"></div>

  <!-- Per-section KPI card — #Loan/#Client/Value (Outstanding), #Loan/
       Value (Disburse), #Loan/#Client/PAR (T24, NBC Overdue), #(cif)/Int/
       Prn (Write Off). Reflects the picked dimension value for
       Outstanding/Disburse (the two sections with a true per-dimension
       A/B total); stays the overall figure for Write Off/T24/NBC Overdue,
       which only have entered/exited deltas per dimension, not a stored
       per-dimension A/B total — see the breakdown table below instead. -->
  <div id="rcKpiCard"></div>

  <!-- Picks which dimension the active tab's breakdown/client-list is
       sliced by — Officer is the default (no neutral "Overall" option,
       per explicit request 2026-10-08). -->
  <div class="rc-dim-row">
    <div class="rc-dim-chips" id="rcDimChips">
      <button type="button" class="rc-dim-chip active" data-dim="officerId" data-i18n="creditreport.compare.dimOfficer">Officer</button>
      <button type="button" class="rc-dim-chip" data-dim="branch" data-i18n="creditreport.compare.dimBranch">Branch</button>
      <button type="button" class="rc-dim-chip" data-dim="product" data-i18n="creditreport.compare.dimProduct">Product</button>
      <button type="button" class="rc-dim-chip" data-dim="location" data-i18n="creditreport.compare.dimLocation">Location</button>
    </div>
    <select class="rc-dim-value-select" id="rcDimValueSelect" style="display:none"></select>
  </div>

  <div class="op-mode-body" id="rcTabBody"></div>
</div>

</div>

<div id="bottomnav-container"></div>

<script src="/CM_Pro/assets/js/notification-badge.js"></script>

<script src="../../assets/js/creditreport/ReportCompare.js"></script>
<script src="../../assets/js/creditreport/ReportCompare-loader.js"></script>

</body>

</html>
