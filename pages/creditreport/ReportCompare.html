<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Report Comparison</title>

<meta
name="theme-color"
content="#032d73">

<script>
  document.documentElement.setAttribute(
    "data-theme",
    localStorage.getItem("cm_theme") || "light"
  );
</script>

<link
rel="stylesheet"
href="../../assets/css/main.css">

<link
rel="stylesheet"
href="../../assets/css/creditreport/OfficerProductivity.css">

<link
rel="stylesheet"
href="../../assets/css/creditreport/ReportCompare.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/global-splash.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/toast.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/loading.css">

</head>

<body>

<div id="offlineBanner">
⚠️ No Internet Connection
</div>

<script src="../../config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>
<script src="../../config/auth.js"></script>
<script src="../../config/session.js"></script>

<script src="/CM_Pro/shared/topbar.js"></script>
<script src="/CM_Pro/shared/theme.js"></script>
<script src="/CM_Pro/shared/loading.js"></script>
<script src="/CM_Pro/assets/js/global-splash.js"></script>
<script src="/CM_Pro/assets/js/toast.js"></script>

<div id="topbar-container"></div>

<div class="page-container">

<!-- ========================= -->
<!-- DATE PICKER TOOLBAR -->
<!-- ========================= -->
<div class="rc-toolbar" id="rcToolbar">
  <div class="rc-date-field">
    <label for="rcDateA">ថ្ងៃទី១ / Date A</label>
    <select id="rcDateA"></select>
  </div>
  <div class="rc-arrow">→</div>
  <div class="rc-date-field">
    <label for="rcDateB">ថ្ងៃទី២ / Date B</label>
    <select id="rcDateB"></select>
  </div>
  <button type="button" class="rc-compare-btn" id="rcCompareBtn">ប្រៀបធៀប / Compare</button>
  <button type="button" class="rc-snapshot-btn" id="rcSnapshotBtn" style="display:none">📸 Snapshot Now</button>
</div>

<div class="op-empty" id="rcEmpty" style="display:none"></div>

<!-- Skeleton while a comparison is loading -->
<div class="op-page-skel" id="rcPageSkel" style="display:none">
<div class="op-skel-card"></div>
<div class="op-skel-card"></div>
<div class="op-skel-card"></div>
</div>

<!-- ========================= -->
<!-- SECTION TABS + KPI CARD + DIMENSION PICKER -->
<!-- ========================= -->
<div class="op-card rc-shell" id="rcTransitionsCard" style="display:none">

  <div class="rc-main-tabs" id="rcTabs">
    <button type="button" class="rc-main-tab active" data-tab="os">💰 Outstanding</button>
    <button type="button" class="rc-main-tab" data-tab="disburse">🏦 Disburse</button>
    <button type="button" class="rc-main-tab" data-tab="t24">⏱ T24</button>
    <button type="button" class="rc-main-tab" data-tab="overdue">📉 NBC Overdue</button>
    <button type="button" class="rc-main-tab" data-tab="wo">✍️ Write Off</button>
  </div>

  <div class="rc-section-head" id="rcSectionHead"></div>

  <!-- Per-section KPI card — #Loan/#Client/Value (Outstanding), #Loan/
       Value (Disburse), #Loan/#Client/PAR (T24, NBC Overdue), #(cif)/Int/
       Prn (Write Off). Reflects the picked dimension value for
       Outstanding/Disburse (the two sections with a true per-dimension
       A/B total); stays the overall figure for Write Off/T24/NBC Overdue,
       which only have entered/exited deltas per dimension, not a stored
       per-dimension A/B total — see the breakdown table below instead. -->
  <div id="rcKpiCard"></div>

  <!-- "filter or tap of Officer/Branch/Product/Location" — picks which
       dimension the active tab's breakdown/client-list is sliced by. -->
  <div class="rc-dim-row">
    <div class="rc-dim-chips" id="rcDimChips">
      <button type="button" class="rc-dim-chip active" data-dim="">គ្រប់ទាំងអស់ / Overall</button>
      <button type="button" class="rc-dim-chip" data-dim="officerId">មន្ត្រី / Officer</button>
      <button type="button" class="rc-dim-chip" data-dim="branch">សាខា / Branch</button>
      <button type="button" class="rc-dim-chip" data-dim="product">ផលិតផល / Product</button>
      <button type="button" class="rc-dim-chip" data-dim="location">ទីតាំង / Location</button>
    </div>
    <select class="rc-dim-value-select" id="rcDimValueSelect" style="display:none"></select>
  </div>

  <div class="op-mode-body" id="rcTabBody"></div>
</div>

</div>

<div id="bottomnav-container"></div>

<script src="/CM_Pro/assets/js/notification-badge.js"></script>

<script src="../../assets/js/creditreport/ReportCompare.js"></script>
<script src="../../assets/js/creditreport/ReportCompare-loader.js"></script>

</body>

</html>
