<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Product Performance</title>

<meta
name="theme-color"
content="#032d73">

<script>
  document.documentElement.setAttribute(
    "data-theme",
    (function(){var t=localStorage.getItem("cm_theme")||"auto";return t==="auto"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;})()
  );
</script>

<link
rel="stylesheet"
href="../../assets/css/main.css">

<link
rel="stylesheet"
href="../../assets/css/creditreport/OfficerProductivity.css">

<link
rel="stylesheet"
href="../../assets/css/creditreport/BranchProductivity.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/global-splash.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/toast.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/loading.css">

</head>

<body>

<div id="offlineBanner" data-i18n="common.offline">
⚠️ No Internet Connection
</div>

<script src="../../config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>
<script src="../../config/auth.js"></script>
<script src="../../config/session.js"></script>

<script src="/CM_Pro/shared/topbar.js"></script>
<script src="/CM_Pro/shared/theme.js"></script>
<script src="/CM_Pro/shared/language.js"></script>
<script src="/CM_Pro/shared/i18n.js"></script>
<script src="/CM_Pro/shared/i18n/common.js"></script>
<script src="/CM_Pro/shared/i18n/core.js"></script>
<script src="/CM_Pro/shared/i18n/creditreport.js"></script>
<script src="/CM_Pro/shared/loading.js"></script>
<script src="/CM_Pro/assets/js/global-splash.js"></script>
<script src="/CM_Pro/assets/js/toast.js"></script>

<div id="topbar-container"></div>

<div class="page-container">

<!-- ========================= -->
<!-- PRODUCT HEADER -->
<!-- Same markup/CSS classes as Officer/Branch Productivity's own header
     card (op-header-card etc.) — reuses those files' CSS, no
     product-only additions needed. -->
<!-- ========================= -->

<div class="op-header-card" id="ppHeaderCard" style="display:none">
<div class="op-avatar" id="ppAvatar">?</div>
<div class="op-header-text">
<div class="op-officer-name" id="ppProductName">-</div>
<div class="op-officer-meta" id="ppProductMeta"></div>
</div>
</div>

<!-- Skeleton while the product's summary is being resolved -->
<div class="op-page-skel" id="ppPageSkel">
<div class="op-skel-card"></div>
<div class="op-skel-card"></div>
<div class="op-skel-card"></div>
<div class="op-skel-card"></div>
<div class="op-skel-card"></div>
</div>

<div class="op-empty" id="ppEmpty" style="display:none"></div>

<!-- ========================= -->
<!-- CATEGORY CARDS -->
<!-- Each card is built the same way by ProductPerformance.js from
     PP_CATEGORIES — see that file for the field mapping per category.
     Markup here is just the empty shell (#ppCards is populated at
     runtime). -->
<!-- ========================= -->

<div class="op-cards" id="ppCards" style="display:none"></div>

</div>

<!-- ========================= -->
<!-- CHART FULLSCREEN OVERLAY -->
<!-- ========================= -->

<div class="op-chart-fs-overlay" id="ppChartFsOverlay" hidden>
<button type="button" class="op-chart-fs-close" id="ppChartFsClose" aria-label="Close fullscreen" data-i18n-aria-label="creditreport.productivity.closeFullscreenAria">✕</button>
<div class="op-chart-fs-body-wrap" id="ppChartFsBody"></div>
</div>

<div id="bottomnav-container"></div>

<script src="/CM_Pro/assets/js/notification-badge.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="../../assets/js/creditreport/ProductPerformance.js"></script>
<script src="../../assets/js/creditreport/ProductPerformance-loader.js"></script>

</body>

</html>
