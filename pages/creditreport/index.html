<!-- Hold the first paint until the whole page is parsed (its scripts,
     translations and header), so a page transition slides in a finished
     page instead of one still filling itself in. No element has this id:
     the hold simply ends when parsing does. -->
<link rel="expect" href="#cm-pt-parsed" blocking="render">
<script src="/CM_Pro/shared/page-transition.js"></script>

<!-- Admin-only — single "Snapshot All" control replacing the 4 separate
     per-report "Snapshot Now" buttons (removed 2026-10-07) plus Report
     Comparison's own standalone one (removed 2026-10-08), all
     consolidated here per explicit request. Runs all 5 reports' existing
     /snapshot/run endpoints in parallel and shows a combined result. -->
<div class="cr-hub-admin-toolbar" id="crHubAdminToolbar" style="display:none">
<div class="cr-hub-section-title" data-i18n="creditreport.hub.adminTools">ឧបករណ៍ Admin</div>
<div class="cr-hub-snapshot-card">
<div class="cr-hub-admin-buttons">
<button type="button" id="btnCrSnapshotAll" class="cr-hub-snapshot-btn">
<span class="cr-hub-snapshot-btn-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 1.4v2.4M7.1 3.1l1.2 1.9M16.9 3.1l-1.2 1.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path fill="currentColor" fill-rule="evenodd" d="M8.6 7.6 9.7 6h4.6l1.1 1.6H19a3 3 0 0 1 3 3V18a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3v-7.4a3 3 0 0 1 3-3h3.6ZM12 9.8a4.2 4.2 0 1 0 0 8.4 4.2 4.2 0 0 0 0-8.4Zm0 2.2a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/></svg></span>
<span id="crHubSnapshotBtnLabel" data-i18n="creditreport.hub.snapshotAll">Snapshot All</span>
</button>
<!-- Admin escape hatch for the per-date T24 freeze (see each
     lib/creditreport-*.js's own comment): refreshes T24 for every
     already-saved Daily History date across all 4 reports in one
     click, instead of the per-row 🔄 button on each report's own
     history table. -->
<button type="button" id="btnCrRefreshAllT24" class="cr-hub-refresh-btn">
<span class="cr-hub-snapshot-btn-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19.8 11A8 8 0 0 0 5.6 6.4"/><path d="M5 3.5V8h4.5"/><path d="M4.2 13a8 8 0 0 0 14.2 4.6"/><path d="M19 20.5V16h-4.5"/></svg></span>
<span id="crHubRefreshBtnLabel" data-i18n="creditreport.hub.refreshAllT24">Refresh All T24</span>
</button>
</div>
<div class="cr-hub-snapshot-results" id="crHubSnapshotResults">
<div class="cr-hub-snapshot-results-head">
<span id="crHubSnapshotSummary"></span>
<button type="button" class="cr-hub-snapshot-close" id="btnCrSnapshotResultsClose" aria-label="Dismiss" data-i18n-aria-label="creditreport.hub.dismiss">✕</button>
</div>
<div id="crHubSnapshotRows"></div>
</div>
</div>
