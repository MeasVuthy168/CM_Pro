<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Daily Monitoring by Branch</title>

<meta
name="theme-color"
content="#032d73">

<!-- Applied before any CSS loads, so there's no flash of the wrong
     theme on page load. Keep this as the very first thing in <head>. -->
<script>
  document.documentElement.setAttribute(
    "data-theme",
    (function(){var t=localStorage.getItem("cm_theme")||"auto";return t==="auto"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;})()
  );
</script>

<link
rel="stylesheet"
href="../../assets/css/main.css">

<link
rel="stylesheet"
href="../../assets/css/creditreport/RepDetailbyBranch.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/global-splash.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/toast.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/loading.css">

</head>

<body>

<!-- ========================= -->
<!-- OFFLINE -->
<!-- ========================= -->

<div id="offlineBanner" data-i18n="common.offline">
⚠️ No Internet Connection
</div>

<!-- ========================= -->
<!-- CONFIG -->
<!-- ========================= -->

<script src="../../config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>
<script src="../../config/auth.js"></script>
<script src="../../config/session.js"></script>

<!-- ========================= -->
<!-- COMPONENT -->
<!-- ========================= -->

<script src="/CM_Pro/shared/topbar.js"></script>
<script src="/CM_Pro/shared/theme.js"></script>
<script src="/CM_Pro/shared/language.js"></script>
<script src="/CM_Pro/shared/i18n.js"></script>
<script src="/CM_Pro/shared/i18n/common.js"></script>
<script src="/CM_Pro/shared/i18n/core.js"></script>
<script src="/CM_Pro/shared/i18n/creditreport.js"></script>
<script src="/CM_Pro/shared/loading.js"></script>
<script src="/CM_Pro/assets/js/global-splash.js"></script>
<script src="/CM_Pro/assets/js/toast.js"></script>

<!-- ========================= -->
<!-- TOPBAR -->
<!-- ========================= -->

<div id="topbar-container"></div>

<!-- ========================= -->
<!-- PAGE -->
<!-- ========================= -->

<div class="page-container">

<div class="print-only-title" data-i18n="creditreport.byBranch.printTitle">របាយការណ៍ឥណទានតាមសាខាប្រចាំថ្ងៃ</div>

<!-- ========================= -->
<!-- REPORT INFO -->
<!-- The card leads with the report's current state (periods, "as of"
     dates, Loan Reclass, branch count). The report always uses the
     server's own data-derived date defaults — the "Set Report Date"
     picker was removed 2026-10-02 per explicit request (never used). -->
<!-- ========================= -->

<div class="filter-card">

<div class="cr-info-block">

<div class="cr-info-row">
<span class="cr-info-label"><span class="cr-info-icon">💵</span><span data-i18n="creditreport.detail.loanDisbFrom">Loan Disbursement from</span></span>
<span class="cr-info-value" id="crDisbPeriod">-</span>
</div>

<div class="cr-info-row">
<span class="cr-info-label"><span class="cr-info-icon">✂️</span><span data-i18n="creditreport.detail.writeOffFrom">Write Off from</span></span>
<span class="cr-info-value" id="crWoPeriod">-</span>
</div>

<div class="cr-info-row">
<span class="cr-info-label"><span class="cr-info-icon">📊</span><span data-i18n="creditreport.detail.osGridMerge">NBC Loan Outstanding Grid Merge</span></span>
<span class="cr-info-value" id="crOsGridMerge">-</span>
</div>

<div class="cr-info-row">
<span class="cr-info-label"><span class="cr-info-icon">⚠️</span><span data-i18n="creditreport.detail.overdueGridMerge">NBC Overdue Loan Grid Merge</span></span>
<span class="cr-info-value" id="crOverdueGridMerge">-</span>
</div>

<div class="cr-info-row">
<span class="cr-info-label"><span class="cr-info-icon">⏱️</span><span data-i18n="creditreport.detail.arrearsPenalty">Payment in Arears with Penalty</span></span>
<span class="cr-info-value" id="crArrearsPenalty">-</span>
</div>

</div>

<!-- View controls live in this same card: the section picker is
     "what am I looking at", so it belongs with the report's other
     settings rather than in a card of its own. -->
<div class="cr-view-controls">

<div class="cr-mode-row">
<button type="button" id="crModeCurrentBtn" class="cr-mode-btn active" data-i18n="creditreport.detail.current">Current</button>
<button type="button" id="crModeHistoryBtn" class="cr-mode-btn" data-i18n="creditreport.detail.dailyHistory">Daily History</button>
</div>

<div class="cr-date-panel" id="crHistoryPanel" style="display:none">
<div class="filter-grid">
<div class="filter-group">
<label for="crHistFromDate" data-i18n="creditreport.detail.from">From</label>
<input type="date" id="crHistFromDate">
</div>
<div class="filter-group">
<label for="crHistToDate" data-i18n="creditreport.detail.to">To</label>
<input type="date" id="crHistToDate">
</div>
</div>
</div>

<!-- Daily History only — narrows the already-fetched table down to
     exactly one row-stream: one specific branch, or "Total" (the
     cross-branch aggregate) — never a list of every branch at once —
     optionally further narrowed to one team (CO/FSRO/Digital), same
     data already on each row (no refetch). -->
<div class="cr-section-row" id="crHistBranchRow" style="display:none;">
<label for="crHistBranch" class="cr-section-label" data-i18n="creditreport.detail.branch">Branch</label>
<select id="crHistBranch" class="cr-section-select">
<option value="" data-i18n="creditreport.byCO.allBranch">All Branch</option>
</select>
</div>

<div class="cr-section-row" id="crHistTeamRow" style="display:none;">
<label for="crHistTeam" class="cr-section-label" data-i18n="creditreport.byCO.team">Team</label>
<select id="crHistTeam" class="cr-section-select">
<option value="" data-i18n="creditreport.byCO.allTeam">All Team</option>
<option value="co" data-i18n="creditreport.byBranch.teamCo">CO</option>
<option value="fsro" data-i18n="creditreport.byCO.fsro">FSRO</option>
<option value="digital" data-i18n="creditreport.byBranch.teamDigital">Digital</option>
</select>
</div>

<div class="cr-section-row">
<label for="crSection" class="cr-section-label" data-i18n="creditreport.detail.showing">Showing</label>
<select id="crSection" class="cr-section-select">
<option value="all" data-i18n="creditreport.detail.allSections">All Sections</option>
<option value="outstanding" data-i18n="creditreport.detail.sectionOutstanding">Loan Outstanding — សមតុល្យឥណទាន</option>
<option value="disburse" data-i18n="creditreport.detail.sectionDisburse">Loan Disburse</option>
<option value="parT24" data-i18n="creditreport.detail.sectionT24">Balance Loan at Risk (T24)</option>
<option value="nbcOverdue" data-i18n="creditreport.detail.sectionNbcOverdue">Balance Loan at Risk (NBC Overdue)</option>
<option value="writeOff" data-i18n="creditreport.detail.sectionWriteOff">Write Off</option>
</select>
</div>

<div class="cr-section-row" id="crClassRow" style="display:none;">
<label for="crClass" class="cr-section-label" data-i18n="creditreport.detail.loanClass">Loan Class</label>
<select id="crClass" class="cr-section-select">
<option value="total" data-i18n="creditreport.detail.classTotalT24">Total T24 Overdue</option>
<option value="Normal_to_SpecialMention" data-i18n="creditreport.detail.classNormalToSpecial">Normal → Special Mention</option>
<option value="SubStandard_to_Loss" data-i18n="creditreport.detail.classSubToLoss">Sub Standard → Loss</option>
<option value="Normal" data-i18n="creditreport.detail.classNormal">Normal</option>
<option value="Special Mention" data-i18n="creditreport.detail.classSpecialMention">Special Mention</option>
<option value="Sub Standard" data-i18n="creditreport.detail.classSubStandard">Sub Standard</option>
<option value="Doubtful" data-i18n="creditreport.detail.classDoubtful">Doubtful</option>
<option value="Loss" data-i18n="creditreport.detail.classLoss">Loss</option>
</select>
</div>

<div class="cr-section-row" id="crProductRow" style="display:none;">
<label for="crProduct" class="cr-section-label" data-i18n="creditreport.detail.productType">Product Type</label>
<select id="crProduct" class="cr-section-select">
<option value="" data-i18n="creditreport.detail.all">All</option>
<option value="Digital Products" data-i18n="creditreport.detail.digitalProducts">Digital Products</option>
<option value="Non-Digital Products" data-i18n="creditreport.detail.nonDigitalProducts">Non-Digital Products</option>
</select>
</div>

<div class="cr-section-row" id="crNbcClassRow" style="display:none;">
<label for="crNbcClass" class="cr-section-label" data-i18n="creditreport.detail.loanClass">Loan Class</label>
<select id="crNbcClass" class="cr-section-select">
<option value="" data-i18n="creditreport.detail.all">All</option>
<option value="minor" data-i18n="creditreport.detail.classMinorDefault">Minor Default</option>
<option value="specialMention" data-i18n="creditreport.detail.classSpecialMention">Special Mention</option>
<option value="subStandard" data-i18n="creditreport.detail.classSubStandardHyphen">Sub-Standard</option>
<option value="doubtful" data-i18n="creditreport.detail.classDoubtful">Doubtful</option>
<option value="loss" data-i18n="creditreport.detail.classLoss">Loss</option>
<option value="majorDefault" data-i18n="creditreport.detail.classMajorDefault">Major Default</option>
<option value="nonPerformingLoan" data-i18n="creditreport.detail.classNonPerformingLoan">Non Performing Loan</option>
<option value="total" data-i18n="creditreport.detail.classTotalNbcOverdue">Total NBC Overdue</option>
</select>
</div>

<div class="cr-section-row" id="crNbcProductRow" style="display:none;">
<label for="crNbcProduct" class="cr-section-label" data-i18n="creditreport.detail.productType">Product Type</label>
<select id="crNbcProduct" class="cr-section-select">
<option value="" data-i18n="creditreport.detail.all">All</option>
<option value="Digital Products" data-i18n="creditreport.detail.digitalProducts">Digital Products</option>
<option value="Non-Digital Products" data-i18n="creditreport.detail.nonDigitalProducts">Non-Digital Products</option>
</select>
</div>

<button id="btnCrHistRun" class="cr-run-btn" disabled style="display:none" data-i18n="creditreport.detail.viewHistory">View History</button>

<button type="button" id="btnCrHistChart" class="cr-run-btn cr-chart-btn" style="display:none">📊 <span data-i18n="creditreport.detail.chart">Chart</span></button>

</div>

</div>

<!-- ========================= -->
<!-- MENU (relocated into topbar's "..." by creditreport-loader.js, -->
<!-- same relocate pattern as arrears — see the note there) -->
<!-- ========================= -->
<div id="crMenuWrap" class="arrears-menu-wrap">
<button id="btnCrMenu" class="arrears-menu-toggle" aria-label="More actions" data-i18n-aria-label="creditreport.menu.moreActions">⋮</button>
<div id="crMenuDropdown" class="arrears-menu-dropdown">
<!-- Admin only — shown via JS (crIsAdmin), per explicit request
     2026-10-08, mirroring the Credit Report hub's own "Snapshot All"
     and Credit Portfolio Trends' own "📸 Snapshot" menu item. -->
<button id="btnCrSnapshot" style="display:none"><span class="menu-icon" aria-hidden="true">📸</span><span data-i18n="creditreport.menu.snapshot">Snapshot</span></button>
<button id="btnCrExport"><img src="/CM_Pro/assets/icons/arrear/export_excel.png" alt="" class="menu-icon"><span data-i18n="creditreport.menu.exportExcel">Export Excel</span></button>
<button id="btnCrExportPdf"><img src="/CM_Pro/assets/icons/arrear/export_pdf.png" alt="" class="menu-icon"><span data-i18n="creditreport.menu.exportPdf">Export PDF</span></button>
<button id="btnCrPrint"><img src="/CM_Pro/assets/icons/arrear/print.png" alt="" class="menu-icon"><span data-i18n="creditreport.menu.print">Print</span></button>
<button id="btnCrLandscape"><img src="/CM_Pro/assets/icons/arrear/landscape.png" alt="" class="menu-icon"><span data-i18n="creditreport.menu.landscape">Landscape</span></button>
<button id="btnCrRefreshData"><img src="/CM_Pro/assets/icons/arrear/refresh.png" alt="" class="menu-icon"><span data-i18n="creditreport.menu.refreshData">Refresh Data</span></button>
</div>
</div>

<!-- ========================= -->
<!-- TABLE -->
<!-- ========================= -->

<div class="table-card">

<div id="landscapeTopBar" class="landscape-bar landscape-top-bar">
<button id="btnCrExitLandscape" aria-label="Exit landscape" data-i18n="creditreport.menu.exitLandscape" data-i18n-aria-label="creditreport.detail.exitLandscapeAria">✕ ត្រឡប់ក្រោយ</button>
<span id="crLandscapeRowCount" class="landscape-row-count"></span>
</div>

<div id="landscapeBottomBar" class="landscape-bar landscape-bottom-bar">
<span class="landscape-hint" data-i18n="creditreport.menu.landscapeHint">ចុចអេក្រង់ដើម្បីបង្ហាញ/លាក់ម៉ឺនុយ</span>
</div>

<!-- Skeleton loading state (real card placeholders, not plain text) -->
<div id="crSkeleton" class="cr-skeleton">
<div class="cr-skel-row cr-skel-head"></div>
<div class="cr-skel-row"></div>
<div class="cr-skel-row"></div>
<div class="cr-skel-row"></div>
<div class="cr-skel-row"></div>
<div class="cr-skel-row"></div>
<div class="cr-skel-row"></div>
<div class="cr-skel-row"></div>
</div>

<div class="table-scroll" id="crTableScroll" style="display:none">
<table id="crTable">
<thead id="crThead"></thead>
<tbody id="crTbody"></tbody>
</table>
</div>

<div class="cr-empty" id="crEmptyMsg" style="display:none"></div>

<!-- Shown only when the T24 columns are on screen — mirrors the Excel
     header note "(T24) included Reclass: ($x and n LD)". -->
<div class="cr-table-note" id="crReclassNote" style="display:none"></div>

</div>

</div>
<!-- ^ closes .page-container — table-card is now INSIDE it, so it
     shares the same flexible-height box instead of starting after a
     forced min-height:100vh gap. -->

<!-- ========================= -->
<!-- DAILY HISTORY CHART -->
<!-- Opened by the "📊 Chart" button — a line chart of the currently
     filtered Branch/Team, for whichever fields the active "Showing"
     section carries, over the fetched Daily History date range. -->
<!-- ========================= -->
<div class="cr-chart-overlay" id="crChartOverlay" hidden>
<div class="cr-chart-panel">
<div class="cr-chart-header">
<h3 class="cr-chart-title" id="crChartTitle">Chart</h3>
<button type="button" id="btnCrChartClose" class="cr-chart-close" aria-label="Close chart" data-i18n-aria-label="creditreport.detail.closeChartAria">✕</button>
</div>
<div class="cr-chart-metric-row" id="crChartMetricRow"></div>
<div class="cr-chart-canvas-wrap">
<canvas id="crChartCanvas"></canvas>
</div>
</div>
</div>

<!-- ========================= -->
<!-- BOTTOM -->
<!-- ========================= -->

<div id="bottomnav-container"></div>

<!-- NOTIFICATION BADGE -->
<script src="/CM_Pro/assets/js/notification-badge.js"></script>

<!-- EXPORT (SheetJS) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- PDF EXPORT -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- DAILY HISTORY CHART -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>

<!-- CREDIT REPORT LOGIC -->
<script src="../../assets/js/creditreport/RepDetailbyBranch.js"></script>

<!-- PAGE LOADER (component loader, offline, notification badge) -->
<script src="../../assets/js/creditreport/RepDetailbyBranch-loader.js"></script>

</body>

</html>
