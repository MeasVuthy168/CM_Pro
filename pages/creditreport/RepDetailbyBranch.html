<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Daily Monitoring by Branch</title>

<meta
name="theme-color"
content="#032d73">

<!-- Applied before any CSS loads, so there's no flash of the wrong
     theme on page load. Keep this as the very first thing in <head>. -->
<script>
  document.documentElement.setAttribute(
    "data-theme",
    localStorage.getItem("cm_theme") || "light"
  );
</script>

<link
rel="stylesheet"
href="../../assets/css/main.css">

<link
rel="stylesheet"
href="../../assets/css/creditreport/RepDetailbyBranch.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/global-splash.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/toast.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/loading.css">

</head>

<body>

<!-- ========================= -->
<!-- OFFLINE -->
<!-- ========================= -->

<div id="offlineBanner">
⚠️ No Internet Connection
</div>

<!-- ========================= -->
<!-- CONFIG -->
<!-- ========================= -->

<script src="../../config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>
<script src="../../config/auth.js"></script>
<script src="../../config/session.js"></script>

<!-- ========================= -->
<!-- COMPONENT -->
<!-- ========================= -->

<script src="/CM_Pro/shared/topbar.js"></script>
<script src="/CM_Pro/shared/theme.js"></script>
<script src="/CM_Pro/shared/loading.js"></script>
<script src="/CM_Pro/assets/js/global-splash.js"></script>
<script src="/CM_Pro/assets/js/toast.js"></script>

<!-- ========================= -->
<!-- TOPBAR -->
<!-- ========================= -->

<div id="topbar-container"></div>

<!-- ========================= -->
<!-- PAGE -->
<!-- ========================= -->

<div class="page-container">

<div class="print-only-title">របាយការណ៍ឥណទានតាមសាខាប្រចាំថ្ងៃ</div>

<!-- ========================= -->
<!-- REPORT INFO -->
<!-- The card leads with the report's current state (periods, "as of"
     dates, Loan Reclass, branch count). The report always uses the
     server's own data-derived date defaults — the "Set Report Date"
     picker was removed 2026-10-02 per explicit request (never used). -->
<!-- ========================= -->

<div class="filter-card">

<div class="cr-info-block">

<div class="cr-info-row">
<span class="cr-info-label"><span class="cr-info-icon">💵</span>Loan Disbursement from</span>
<span class="cr-info-value" id="crDisbPeriod">-</span>
</div>

<div class="cr-info-row">
<span class="cr-info-label"><span class="cr-info-icon">✂️</span>Write Off from</span>
<span class="cr-info-value" id="crWoPeriod">-</span>
</div>

<div class="cr-info-row">
<span class="cr-info-label"><span class="cr-info-icon">📊</span>NBC Loan Outstanding Grid Merge</span>
<span class="cr-info-value" id="crOsGridMerge">-</span>
</div>

<div class="cr-info-row">
<span class="cr-info-label"><span class="cr-info-icon">⚠️</span>NBC Overdue Loan Grid Merge</span>
<span class="cr-info-value" id="crOverdueGridMerge">-</span>
</div>

<div class="cr-info-row">
<span class="cr-info-label"><span class="cr-info-icon">⏱️</span>Payment in Arears with Penalty</span>
<span class="cr-info-value" id="crArrearsPenalty">-</span>
</div>

</div>

<!-- View controls live in this same card: the section picker is
     "what am I looking at", so it belongs with the report's other
     settings rather than in a card of its own. -->
<div class="cr-view-controls">

<div class="cr-mode-row">
<button type="button" id="crModeCurrentBtn" class="cr-mode-btn active">Current</button>
<button type="button" id="crModeHistoryBtn" class="cr-mode-btn">Daily History</button>
</div>

<div class="cr-date-panel" id="crHistoryPanel" style="display:none">
<div class="filter-grid">
<div class="filter-group">
<label for="crHistFromDate">From</label>
<input type="date" id="crHistFromDate">
</div>
<div class="filter-group">
<label for="crHistToDate">To</label>
<input type="date" id="crHistToDate">
</div>
</div>
<button id="btnCrHistSnapshot" class="cr-run-btn cr-snapshot-btn" style="display:none">📸 Snapshot Now</button>
</div>

<!-- Daily History only — narrows the already-fetched table down to
     exactly one row-stream: one specific branch, or "Total" (the
     cross-branch aggregate) — never a list of every branch at once —
     optionally further narrowed to one team (CO/FSRO/Digital), same
     data already on each row (no refetch). -->
<div class="cr-section-row" id="crHistBranchRow" style="display:none;">
<label for="crHistBranch" class="cr-section-label">Branch</label>
<select id="crHistBranch" class="cr-section-select">
<option value="">All Branch</option>
</select>
</div>

<div class="cr-section-row" id="crHistTeamRow" style="display:none;">
<label for="crHistTeam" class="cr-section-label">Team</label>
<select id="crHistTeam" class="cr-section-select">
<option value="">All Team</option>
<option value="co">CO</option>
<option value="fsro">FSRO</option>
<option value="digital">Digital</option>
</select>
</div>

<div class="cr-section-row">
<label for="crSection" class="cr-section-label">Showing</label>
<select id="crSection" class="cr-section-select">
<option value="all">All Sections</option>
<option value="outstanding">Loan Outstanding — សមតុល្យឥណទាន</option>
<option value="disburse">Loan Disburse</option>
<option value="parT24">Balance Loan at Risk (T24)</option>
<option value="nbcOverdue">Balance Loan at Risk (NBC Overdue)</option>
<option value="writeOff">Write Off</option>
</select>
</div>

<button id="btnCrHistRun" class="cr-run-btn" disabled>View History</button>

<button type="button" id="btnCrHistChart" class="cr-run-btn cr-chart-btn" style="display:none">📊 Chart</button>

<div class="cr-section-row" id="crClassRow" style="display:none;">
<label for="crClass" class="cr-section-label">Loan Class</label>
<select id="crClass" class="cr-section-select">
<option value="">All</option>
<option value="Normal_to_SpecialMention">Normal → Special Mention</option>
<option value="SubStandard_to_Loss">Sub Standard → Loss</option>
<option value="Normal">Normal</option>
<option value="Special Mention">Special Mention</option>
<option value="Sub Standard">Sub Standard</option>
<option value="Doubtful">Doubtful</option>
<option value="Loss">Loss</option>
</select>
</div>

<div class="cr-section-row" id="crProductRow" style="display:none;">
<label for="crProduct" class="cr-section-label">Product Type</label>
<select id="crProduct" class="cr-section-select">
<option value="">All</option>
<option value="Digital Products">Digital Products</option>
<option value="Non-Digital Products">Non-Digital Products</option>
</select>
</div>

<div class="cr-section-row" id="crNbcClassRow" style="display:none;">
<label for="crNbcClass" class="cr-section-label">Loan Class</label>
<select id="crNbcClass" class="cr-section-select">
<option value="">All</option>
<option value="minor">Minor Default</option>
<option value="specialMention">Special Mention</option>
<option value="subStandard">Sub-Standard</option>
<option value="doubtful">Doubtful</option>
<option value="loss">Loss</option>
<option value="majorDefault">Major Default</option>
<option value="nonPerformingLoan">Non Performing Loan</option>
</select>
</div>

<div class="cr-section-row" id="crNbcProductRow" style="display:none;">
<label for="crNbcProduct" class="cr-section-label">Product Type</label>
<select id="crNbcProduct" class="cr-section-select">
<option value="">All</option>
<option value="Digital Products">Digital Products</option>
<option value="Non-Digital Products">Non-Digital Products</option>
</select>
</div>

</div>

</div>

<!-- ========================= -->
<!-- MENU (relocated into topbar's "..." by creditreport-loader.js, -->
<!-- same relocate pattern as arrears — see the note there) -->
<!-- ========================= -->
<div id="crMenuWrap" class="arrears-menu-wrap">
<button id="btnCrMenu" class="arrears-menu-toggle" aria-label="More actions">⋮</button>
<div id="crMenuDropdown" class="arrears-menu-dropdown">
<button id="btnCrExport"><img src="/CM_Pro/assets/icons/arrear/export_excel.png" alt="" class="menu-icon"><span>Export Excel</span></button>
<button id="btnCrExportPdf"><img src="/CM_Pro/assets/icons/arrear/export_pdf.png" alt="" class="menu-icon"><span>Export PDF</span></button>
<button id="btnCrPrint"><img src="/CM_Pro/assets/icons/arrear/print.png" alt="" class="menu-icon"><span>Print</span></button>
<button id="btnCrLandscape"><img src="/CM_Pro/assets/icons/arrear/landscape.png" alt="" class="menu-icon"><span>Landscape</span></button>
<button id="btnCrRefreshData"><img src="/CM_Pro/assets/icons/arrear/refresh.png" alt="" class="menu-icon"><span>Refresh Data</span></button>
</div>
</div>

<!-- ========================= -->
<!-- TABLE -->
<!-- ========================= -->

<div class="table-card">

<div id="landscapeTopBar" class="landscape-bar landscape-top-bar">
<button id="btnCrExitLandscape" aria-label="Exit landscape">✕ ត្រឡប់ក្រោយ</button>
<span id="crLandscapeRowCount" class="landscape-row-count"></span>
</div>

<div id="landscapeBottomBar" class="landscape-bar landscape-bottom-bar">
<span class="landscape-hint">ចុចអេក្រង់ដើម្បីបង្ហាញ/លាក់ម៉ឺនុយ</span>
</div>

<!-- Skeleton loading state (real card placeholders, not plain text) -->
<div id="crSkeleton" class="cr-skeleton">
<div class="cr-skel-row cr-skel-head"></div>
<div class="cr-skel-row"></div>
<div class="cr-skel-row"></div>
<div class="cr-skel-row"></div>
<div class="cr-skel-row"></div>
<div class="cr-skel-row"></div>
<div class="cr-skel-row"></div>
<div class="cr-skel-row"></div>
</div>

<div class="table-scroll" id="crTableScroll" style="display:none">
<table id="crTable">
<thead id="crThead"></thead>
<tbody id="crTbody"></tbody>
</table>
</div>

<div class="cr-empty" id="crEmptyMsg" style="display:none"></div>

<!-- Shown only when the T24 columns are on screen — mirrors the Excel
     header note "(T24) included Reclass: ($x and n LD)". -->
<div class="cr-table-note" id="crReclassNote" style="display:none"></div>

</div>

</div>
<!-- ^ closes .page-container — table-card is now INSIDE it, so it
     shares the same flexible-height box instead of starting after a
     forced min-height:100vh gap. -->

<!-- ========================= -->
<!-- DAILY HISTORY CHART -->
<!-- Opened by the "📊 Chart" button — a line chart of the currently
     filtered Branch/Team, for whichever fields the active "Showing"
     section carries, over the fetched Daily History date range. -->
<!-- ========================= -->
<div class="cr-chart-overlay" id="crChartOverlay" hidden>
<div class="cr-chart-panel">
<div class="cr-chart-header">
<h3 class="cr-chart-title" id="crChartTitle">Chart</h3>
<button type="button" id="btnCrChartClose" class="cr-chart-close" aria-label="Close chart">✕</button>
</div>
<div class="cr-chart-metric-row" id="crChartMetricRow"></div>
<div class="cr-chart-canvas-wrap">
<canvas id="crChartCanvas"></canvas>
</div>
</div>
</div>

<!-- ========================= -->
<!-- BOTTOM -->
<!-- ========================= -->

<div id="bottomnav-container"></div>

<!-- NOTIFICATION BADGE -->
<script src="/CM_Pro/assets/js/notification-badge.js"></script>

<!-- EXPORT (SheetJS) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- PDF EXPORT -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- DAILY HISTORY CHART -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>

<!-- CREDIT REPORT LOGIC -->
<script src="../../assets/js/creditreport/RepDetailbyBranch.js"></script>

<!-- PAGE LOADER (component loader, offline, notification badge) -->
<script src="../../assets/js/creditreport/RepDetailbyBranch-loader.js"></script>

</body>

</html>
