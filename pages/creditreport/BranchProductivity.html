<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Branch Productivity</title>

<meta
name="theme-color"
content="#032d73">

<script>
  document.documentElement.setAttribute(
    "data-theme",
    localStorage.getItem("cm_theme") || "light"
  );
</script>

<link
rel="stylesheet"
href="../../assets/css/main.css">

<link
rel="stylesheet"
href="../../assets/css/creditreport/OfficerProductivity.css">

<link
rel="stylesheet"
href="../../assets/css/creditreport/BranchProductivity.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/global-splash.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/toast.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/loading.css">

</head>

<body>

<div id="offlineBanner">
⚠️ No Internet Connection
</div>

<script src="../../config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>
<script src="../../config/auth.js"></script>
<script src="../../config/session.js"></script>

<script src="/CM_Pro/shared/topbar.js"></script>
<script src="/CM_Pro/shared/theme.js"></script>
<script src="/CM_Pro/shared/loading.js"></script>
<script src="/CM_Pro/assets/js/global-splash.js"></script>
<script src="/CM_Pro/assets/js/toast.js"></script>

<div id="topbar-container"></div>

<div class="page-container">

<!-- ========================= -->
<!-- BRANCH HEADER -->
<!-- Same markup/CSS classes as Officer Productivity's own header card
     (op-header-card etc.) — reuses that file's CSS, see
     BranchProductivity.css for the small branch-only additions. -->
<!-- ========================= -->

<div class="op-header-card" id="bpHeaderCard" style="display:none">
<div class="op-avatar" id="bpAvatar">?</div>
<div class="op-header-text">
<div class="op-officer-name" id="bpBranchName">-</div>
<div class="op-officer-meta" id="bpBranchMeta"></div>
</div>
</div>

<!-- Skeleton while the branch's summary is being resolved -->
<div class="op-page-skel" id="bpPageSkel">
<div class="op-skel-card"></div>
<div class="op-skel-card"></div>
<div class="op-skel-card"></div>
<div class="op-skel-card"></div>
<div class="op-skel-card"></div>
</div>

<div class="op-empty" id="bpEmpty" style="display:none"></div>

<!-- ========================= -->
<!-- CATEGORY CARDS -->
<!-- Each card is built the same way by BranchProductivity.js from
     BP_CATEGORIES — see that file for the field mapping per category.
     Markup here is just the empty shell (#bpCards is populated at
     runtime). -->
<!-- ========================= -->

<div class="op-cards" id="bpCards" style="display:none"></div>

</div>

<!-- ========================= -->
<!-- CHART FULLSCREEN OVERLAY -->
<!-- ========================= -->

<div class="op-chart-fs-overlay" id="bpChartFsOverlay" hidden>
<button type="button" class="op-chart-fs-close" id="bpChartFsClose" aria-label="Close fullscreen">✕</button>
<div class="op-chart-fs-body-wrap" id="bpChartFsBody"></div>
</div>

<div id="bottomnav-container"></div>

<script src="/CM_Pro/assets/js/notification-badge.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="../../assets/js/creditreport/BranchProductivity.js"></script>
<script src="../../assets/js/creditreport/BranchProductivity-loader.js"></script>

</body>

</html>
