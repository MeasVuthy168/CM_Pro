<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>PAR Forecast</title>

<meta
name="theme-color"
content="#0e1b3c">

<script>
  document.documentElement.setAttribute(
    "data-theme",
    (function(){var t=localStorage.getItem("cm_theme")||"auto";return t==="auto"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;})()
  );
</script>

<link rel="stylesheet" href="../../assets/css/main.css">
<link rel="stylesheet" href="../../assets/css/multi-select.css">
<link rel="stylesheet" href="../../assets/css/creditreport/creditreport.css">
<link rel="stylesheet" href="../../assets/css/creditreport/PortfolioIntelligence.css">
<link rel="stylesheet" href="../../assets/css/creditreport/cr-icons.css">
<link rel="stylesheet" href="../../assets/css/creditreport/CustomerRisk.css">
<link rel="stylesheet" href="../../assets/css/creditreport/ParForecast.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/global-splash.css">
<link rel="stylesheet" href="/CM_Pro/assets/css/toast.css">
<link rel="stylesheet" href="/CM_Pro/assets/css/loading.css">

<!-- Hold the first paint until the whole page is parsed (its scripts,
     translations and header), so a page transition slides in a finished
     page instead of one still filling itself in. -->
<link rel="expect" href="#cm-pt-parsed" blocking="render">
<link rel="preload" href="/CM_Pro/assets/fonts/Krasar-Regular.ttf" as="font" type="font/ttf" crossorigin>
<script src="/CM_Pro/shared/page-transition.js"></script>
<script src="/CM_Pro/shared/sw-register.js"></script>
</head>

<body>

<div id="offlineBanner" data-i18n="common.offline">
No Internet Connection
</div>

<script src="../../config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>
<script src="../../config/auth.js"></script>
<script src="../../config/session.js"></script>

<script src="/CM_Pro/shared/topbar.js"></script>
<script src="/CM_Pro/shared/theme.js"></script>
<script src="/CM_Pro/shared/language.js"></script>
<script src="/CM_Pro/shared/i18n.js"></script>
<script src="/CM_Pro/shared/i18n/common.js"></script>
<script src="/CM_Pro/shared/i18n/core.js"></script>
<script src="/CM_Pro/shared/i18n/creditreport.js"></script>
<script src="/CM_Pro/shared/i18n/explain.js"></script>
<script src="/CM_Pro/shared/loading.js"></script>
<script src="/CM_Pro/assets/js/global-splash.js"></script>
<script src="/CM_Pro/assets/js/toast.js"></script>

<div id="topbar-container"></div>

<div class="page-container pi-page">

<section class="pi-card" aria-labelledby="pfTitle">
<h2 class="pi-card-title" id="pfTitle" data-i18n="creditreport.pf.title">PAR Forecast</h2>
<div class="pi-tabs" role="tablist" id="pfDims">
<button type="button" role="tab" data-dim="portfolio" data-i18n="creditreport.pf.portfolio">Portfolio</button>
<button type="button" role="tab" data-dim="branch" data-i18n="creditreport.pi.branch">Branch</button>
<button type="button" role="tab" data-dim="product" data-i18n="creditreport.pi.product">Product</button>
</div>
<div class="pf-controls">
<label class="pi-field"><span data-i18n="creditreport.pf.cutoff">Forecast as of (month-end)</span><input type="month" id="pfCutoff" class="pi-top-pick"></label>
<label class="pi-field"><span data-i18n="creditreport.pf.horizon">Months ahead</span><select id="pfHorizon" class="pi-top-pick"><option>3</option><option selected>6</option><option>9</option><option>12</option></select></label>
<label class="pi-field"><span data-i18n="creditreport.pf.osGrowth">OS growth / month (%)</span><input type="number" id="pfGrowth" step="0.1" min="-50" max="50" class="pi-top-pick" data-i18n-placeholder="creditreport.pf.historical" placeholder="historical"></label>
</div>
<p class="pi-note" id="pfNote"></p>
</section>

<section class="pi-card ci-summary" id="pfSummary" hidden aria-live="polite"></section>

<section class="pi-card" id="pfChartCard" hidden>
<div class="pi-card-head">
<h2 class="pi-card-title" id="pfChartTitle"></h2>
<div class="pi-tabs" role="tablist" id="pfMeasure">
<button type="button" role="tab" data-m="pct" class="is-active">PAR %</button>
<button type="button" role="tab" data-m="amt" data-i18n="creditreport.pf.amount">PAR amount</button>
</div>
</div>
<div class="pf-chart"><canvas id="pfChart"></canvas></div>
<div class="pi-table-wrap"><table class="pi-table" id="pfTable"></table></div>
</section>

<section class="pi-card" id="pfGroupsCard" hidden>
<h2 class="pi-card-title" id="pfGroupsTitle"></h2>
<div class="pf-groups" id="pfGroups"></div>
</section>

<section class="pi-card" aria-labelledby="pfBtTitle" id="pfBtCard" hidden>
<h2 class="pi-card-title" id="pfBtTitle" data-i18n="creditreport.pf.backtest">Backtest — how accurate has this model been?</h2>
<p class="pi-note" data-i18n="creditreport.pf.backtestNote">For every past month with enough history, the model was fitted on data up to that month only and compared with what really happened.</p>
<div class="pi-table-wrap"><table class="pi-table" id="pfBt"></table></div>
</section>

<section class="pi-card" aria-labelledby="pfFlowTitle">
<h2 class="pi-card-title" id="pfFlowTitle" data-i18n="creditreport.pf.flows">PAR inflow, exits and migration</h2>
<p class="pi-note" id="pfFlowNote"></p>
<div class="pi-table-wrap"><table class="pi-table" id="pfFlows"></table></div>
<div class="pi-table-wrap"><table class="pi-table" id="pfMig"></table></div>
</section>

<details class="pi-card" open>
<summary class="pi-card-title" data-i18n="creditreport.pf.assumptions">Assumptions and method</summary>
<div id="pfAssumptions" class="pf-assume"></div>
</details>

<details class="pi-card" id="pfAdmin" hidden>
<summary class="pi-card-title" data-i18n="creditreport.pf.adminTitle">Saved assumptions (admin)</summary>
<div class="pf-controls" id="pfAdminFields"></div>
<button type="button" class="pi-btn-ghost" id="pfAdminSave" data-i18n="creditreport.growth.save">Save</button>
</details>

</div>

<div id="bottomnav-container"></div>

<script src="/CM_Pro/assets/js/notification-badge.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<script src="../../assets/js/multi-select.js"></script>
<script src="../../assets/js/creditreport/ParForecast-loader.js"></script>
<script src="../../assets/js/creditreport/ci-filters.js"></script>
<script src="../../assets/js/ci-explain.js"></script>
<script src="../../assets/js/creditreport/ParForecast.js"></script>

</body>

</html>
