<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Customer Risk</title>

<meta
name="theme-color"
content="#0e1b3c">

<script>
  document.documentElement.setAttribute(
    "data-theme",
    (function(){var t=localStorage.getItem("cm_theme")||"auto";return t==="auto"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;})()
  );
</script>

<link rel="stylesheet" href="../../assets/css/main.css">
<link rel="stylesheet" href="../../assets/css/multi-select.css">
<link rel="stylesheet" href="../../assets/css/creditreport/creditreport.css">
<link rel="stylesheet" href="../../assets/css/creditreport/PortfolioIntelligence.css">
<link rel="stylesheet" href="../../assets/css/creditreport/cr-icons.css">
<link rel="stylesheet" href="../../assets/css/creditreport/CustomerRisk.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/global-splash.css">
<link rel="stylesheet" href="/CM_Pro/assets/css/toast.css">
<link rel="stylesheet" href="/CM_Pro/assets/css/loading.css">

<!-- Hold the first paint until the whole page is parsed (its scripts,
     translations and header), so a page transition slides in a finished
     page instead of one still filling itself in. -->
<link rel="expect" href="#cm-pt-parsed" blocking="render">
<link rel="preload" href="/CM_Pro/assets/fonts/Krasar-Regular.ttf" as="font" type="font/ttf" crossorigin>
<script src="/CM_Pro/shared/page-transition.js"></script>
<script src="/CM_Pro/shared/sw-register.js"></script>
</head>

<body>

<div id="offlineBanner" data-i18n="common.offline">
No Internet Connection
</div>

<script src="../../config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>
<script src="../../config/auth.js"></script>
<script src="../../config/session.js"></script>

<script src="/CM_Pro/shared/topbar.js"></script>
<script src="/CM_Pro/shared/theme.js"></script>
<script src="/CM_Pro/shared/language.js"></script>
<script src="/CM_Pro/shared/i18n.js"></script>
<script src="/CM_Pro/shared/i18n/common.js"></script>
<script src="/CM_Pro/shared/i18n/core.js"></script>
<script src="/CM_Pro/shared/i18n/creditreport.js"></script>
<script src="/CM_Pro/shared/i18n/explain.js"></script>
<script src="/CM_Pro/shared/loading.js"></script>
<script src="/CM_Pro/assets/js/global-splash.js"></script>
<script src="/CM_Pro/assets/js/toast.js"></script>

<div id="topbar-container"></div>

<div class="page-container pi-page">

<section id="ciFilters" aria-label="Filters"></section>

<!-- One-line answer: how much of the PAR the largest customers hold -->
<section class="pi-card ci-summary" id="crkSummary" hidden aria-live="polite"></section>

<section aria-labelledby="crkTitle">
<h2 class="pi-section-title" id="crkTitle" data-i18n="creditreport.crk.title">Customer Risk</h2>
<p class="pi-note" data-i18n="creditreport.crk.scopeNote">Today's NBC Overdue loans (PAR, all classes), added up per customer.</p>
<div class="pi-kpis" id="crkKpis"></div>
</section>

<section class="pi-card" aria-labelledby="crkConcTitle">
<h2 class="pi-card-title" id="crkConcTitle" data-i18n="creditreport.crk.concentration">PAR concentration</h2>
<div class="pi-bars" id="crkConc"></div>
<p class="pi-note" id="crkHalf"></p>
</section>

<section class="pi-card" aria-labelledby="crkMoveTitle">
<h2 class="pi-card-title" id="crkMoveTitle" data-i18n="creditreport.crk.movement">Since the comparison day</h2>
<p class="pi-note" id="crkCompareNote"></p>
<div class="crk-moves" id="crkMoves"></div>
</section>

<section class="pi-card" aria-labelledby="crkListTitle">
<div class="pi-card-head">
<h2 class="pi-card-title" id="crkListTitle" data-i18n="creditreport.crk.ranking">Ranking</h2>
<button type="button" class="pi-btn-ghost" id="crkExport" data-i18n="creditreport.npl.export">Export Excel</button>
</div>
<div class="pi-tabs" role="tablist" id="crkUnitTabs">
<button type="button" role="tab" data-unit="customer" data-i18n="creditreport.crk.byCustomer">By customer (CIF)</button>
<button type="button" role="tab" data-unit="loan" data-i18n="creditreport.crk.byLoan">By loan account</button>
</div>
<div class="ci-table-tools crk-tools">
<label class="crk-pick"><span data-i18n="creditreport.crk.top">Top</span>
<select id="crkTop" class="pi-top-pick"><option>10</option><option selected>20</option><option>50</option><option>100</option></select></label>
<label class="crk-pick"><span data-i18n="creditreport.crk.rankBy">Rank by</span>
<select id="crkSort" class="pi-top-pick">
<option value="par" data-i18n="creditreport.crk.sortPar">PAR amount</option>
<option value="os" data-i18n="creditreport.crk.sortOs">Outstanding</option>
<option value="dpd" data-i18n="creditreport.crk.sortDpd">Days past due</option>
<option value="score" data-i18n="creditreport.crk.sortScore">Risk score</option>
</select></label>
<input type="search" id="crkSearch" class="ci-search" data-i18n-placeholder="creditreport.crk.search" placeholder="Search name, CIF, loan…">
</div>
<div class="pi-chipset" id="crkStatus" role="group"></div>
<p class="pi-note" id="crkCount"></p>
<p class="pi-note crk-quality" id="crkQuality" role="status" hidden></p>
<div class="crk-list" id="crkList"></div>
<p class="pi-note" id="crkDefs"></p>
</section>

</div>

<!-- One customer: its loans, documented reason and saved history -->
<dialog class="crk-dialog" id="crkDialog" aria-labelledby="crkDlgTitle">
<div class="crk-dlg-head">
<h2 class="pi-card-title" id="crkDlgTitle"></h2>
<button type="button" class="crk-dlg-x" id="crkDlgClose" data-i18n-aria-label="common.close" aria-label="Close">✕</button>
</div>
<div class="crk-dlg-body" id="crkDlgBody"></div>
</dialog>

<div id="bottomnav-container"></div>

<script src="/CM_Pro/assets/js/notification-badge.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="../../assets/js/multi-select.js"></script>
<script src="../../assets/js/creditreport/CustomerRisk-loader.js"></script>
<script src="../../assets/js/creditreport/ci-filters.js"></script>
<script src="../../assets/js/ci-explain.js"></script>
<script src="../../assets/js/creditreport/CustomerRisk.js"></script>

</body>

</html>
