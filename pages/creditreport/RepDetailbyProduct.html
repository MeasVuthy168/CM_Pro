<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Daily Monitoring by Product</title>

<meta
name="theme-color"
content="#032d73">

<script>
  document.documentElement.setAttribute(
    "data-theme",
    localStorage.getItem("cm_theme") || "light"
  );
</script>

<link
rel="stylesheet"
href="../../assets/css/main.css">

<link
rel="stylesheet"
href="../../assets/css/creditreport/RepDetailbyProduct.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/global-splash.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/toast.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/loading.css">

</head>

<body>

<div id="offlineBanner">
⚠️ No Internet Connection
</div>

<script src="../../config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>
<script src="../../config/auth.js"></script>
<script src="../../config/session.js"></script>

<script src="/CM_Pro/shared/topbar.js"></script>
<script src="/CM_Pro/shared/theme.js"></script>
<script src="/CM_Pro/shared/loading.js"></script>
<script src="/CM_Pro/assets/js/global-splash.js"></script>
<script src="/CM_Pro/assets/js/toast.js"></script>

<div id="topbar-container"></div>

<div class="page-container">

<div class="print-only-title">របាយការណ៍ត្រួតពិនិត្យប្រចាំថ្ងៃតាមផលិតផល</div>

<!-- ========================= -->
<!-- REPORT INFO + FILTERS -->
<!-- ========================= -->

<div class="filter-card">

<div class="cr-info-block">

<div class="cr-info-row">
<span class="cr-info-label"><span class="cr-info-icon">💵</span>Loan Disbursement from</span>
<span class="cr-info-value" id="crDisbPeriod">-</span>
</div>

<div class="cr-info-row">
<span class="cr-info-label"><span class="cr-info-icon">✂️</span>Write Off from</span>
<span class="cr-info-value" id="crWoPeriod">-</span>
</div>

<div class="cr-info-row">
<span class="cr-info-label"><span class="cr-info-icon">📊</span>NBC Loan Outstanding Grid Merge</span>
<span class="cr-info-value" id="crOsGridMerge">-</span>
</div>

<div class="cr-info-row">
<span class="cr-info-label"><span class="cr-info-icon">⚠️</span>NBC Overdue Loan Grid Merge</span>
<span class="cr-info-value" id="crOverdueGridMerge">-</span>
</div>

<div class="cr-info-row">
<span class="cr-info-label"><span class="cr-info-icon">⏱️</span>Payment in Arears with Penalty</span>
<span class="cr-info-value" id="crArrearsPenalty">-</span>
</div>

<div class="cr-info-row">
<span class="cr-info-label"><span class="cr-info-icon">📦</span>Products</span>
<span class="cr-info-value" id="crProductCount">-</span>
</div>

</div>

<button id="btnCrToggleDates" class="cr-setdate-btn" aria-expanded="false">
<span>Set Report Date</span>
<span class="cr-setdate-caret">▾</span>
</button>

<div class="cr-date-panel" id="crDatePanel">

<div class="filter-grid">

<div class="filter-group">
<label for="crFromDate">ចាប់ផ្តើមផ្តល់ឥណទាន</label>
<input type="date" id="crFromDate">
</div>

<div class="filter-group">
<label for="crToDate">ដល់</label>
<input type="date" id="crToDate">
</div>

<div class="filter-group">
<label for="crWoFromDate">ចាប់ផ្តើម (Write Off)</label>
<input type="date" id="crWoFromDate">
</div>

<div class="filter-group">
<label for="crWoToDate">ដល់</label>
<input type="date" id="crWoToDate">
</div>

</div>

<button id="btnCrRun" class="cr-run-btn">View Report</button>

</div>

<!-- Section picker — no Branch/Team here: a product isn't scoped to
     either the way an officer row is (see RepDetailbyProduct.js's own
     header comment). -->
<div class="cr-view-controls">

<div class="cr-mode-row">
<button type="button" id="crModeCurrentBtn" class="cr-mode-btn active">ថ្ងៃនេះ / Current</button>
<button type="button" id="crModeHistoryBtn" class="cr-mode-btn">ប្រវត្តិប្រចាំថ្ងៃ / Daily History</button>
</div>

<div class="cr-date-panel" id="crHistoryPanel" style="display:none">
<div class="filter-grid">
<div class="filter-group">
<label for="crHistFromDate">ពីថ្ងៃ / From</label>
<input type="date" id="crHistFromDate">
</div>
<div class="filter-group">
<label for="crHistToDate">ដល់ថ្ងៃ / To</label>
<input type="date" id="crHistToDate">
</div>
</div>
<button id="btnCrHistRun" class="cr-run-btn">មើលប្រវត្តិ / View History</button>
<button id="btnCrHistSnapshot" class="cr-run-btn cr-snapshot-btn" style="display:none">📸 Snapshot Now</button>
</div>

<div class="cr-select-row">
<label for="crSection" class="cr-select-label">Showing</label>
<select id="crSection" class="cr-select">
<option value="all">All Sections</option>
<option value="outstanding">Loan Outstanding — សមតុល្យឥណទាន</option>
<option value="disburse">Loan Disburse</option>
<option value="parT24">Balance Loan at Risk (T24)</option>
<option value="nbcOverdue">Balance Loan at Risk (NBC Overdue)</option>
<option value="writeOff">Write Off</option>
</select>
</div>

<div class="cr-select-row" id="crClassRow" style="display:none;">
<label for="crClass" class="cr-select-label">Loan Class</label>
<select id="crClass" class="cr-select">
<option value="">All</option>
<option value="Normal_to_SpecialMention">Normal → Special Mention</option>
<option value="SubStandard_to_Loss">Sub Standard → Loss</option>
<option value="Normal">Normal</option>
<option value="Special Mention">Special Mention</option>
<option value="Sub Standard">Sub Standard</option>
<option value="Doubtful">Doubtful</option>
<option value="Loss">Loss</option>
</select>
</div>

<div class="cr-select-row" id="crProductRow" style="display:none;">
<label for="crProduct" class="cr-select-label">Product Type</label>
<select id="crProduct" class="cr-select">
<option value="">All</option>
<option value="Digital Products">Digital Products</option>
<option value="Non-Digital Products">Non-Digital Products</option>
</select>
</div>

<div class="cr-select-row" id="crNbcClassRow" style="display:none;">
<label for="crNbcClass" class="cr-select-label">Loan Class</label>
<select id="crNbcClass" class="cr-select">
<option value="">All</option>
<option value="minor">Minor Default</option>
<option value="specialMention">Special Mention</option>
<option value="subStandard">Sub-Standard</option>
<option value="doubtful">Doubtful</option>
<option value="loss">Loss</option>
<option value="majorDefault">Major Default</option>
<option value="nonPerformingLoan">Non Performing Loan</option>
</select>
</div>

<div class="cr-select-row" id="crNbcProductRow" style="display:none;">
<label for="crNbcProduct" class="cr-select-label">Product Type</label>
<select id="crNbcProduct" class="cr-select">
<option value="">All</option>
<option value="Digital Products">Digital Products</option>
<option value="Non-Digital Products">Non-Digital Products</option>
</select>
</div>

</div>

</div>

<!-- ========================= -->
<!-- MENU (relocated into topbar by the loader) -->
<!-- ========================= -->
<div id="crMenuWrap" class="arrears-menu-wrap">
<button id="btnCrMenu" class="arrears-menu-toggle" aria-label="More actions">⋮</button>
<div id="crMenuDropdown" class="arrears-menu-dropdown">
<button id="btnCrExport"><img src="/CM_Pro/assets/icons/arrear/export_excel.png" alt="" class="menu-icon"><span>Export Excel</span></button>
<button id="btnCrExportPdf"><img src="/CM_Pro/assets/icons/arrear/export_pdf.png" alt="" class="menu-icon"><span>Export PDF</span></button>
<button id="btnCrPrint"><img src="/CM_Pro/assets/icons/arrear/print.png" alt="" class="menu-icon"><span>Print</span></button>
<button id="btnCrLandscape"><img src="/CM_Pro/assets/icons/arrear/landscape.png" alt="" class="menu-icon"><span>Landscape</span></button>
<button id="btnCrRefreshData"><img src="/CM_Pro/assets/icons/arrear/refresh.png" alt="" class="menu-icon"><span>Refresh Data</span></button>
</div>
</div>

<!-- ========================= -->
<!-- TABLE -->
<!-- ========================= -->

<div class="table-card">

<div id="landscapeTopBar" class="landscape-bar landscape-top-bar">
<button id="btnCrExitLandscape" aria-label="Exit landscape">✕ ត្រឡប់ក្រោយ</button>
<span id="crLandscapeRowCount" class="landscape-row-count"></span>
</div>

<div id="landscapeBottomBar" class="landscape-bar landscape-bottom-bar">
<span class="landscape-hint">ចុចអេក្រង់ដើម្បីបង្ហាញ/លាក់ម៉ឺនុយ</span>
</div>

<div id="crSkeleton" class="cr-skeleton">
<div class="cr-skel-row cr-skel-head"></div>
<div class="cr-skel-row"></div>
<div class="cr-skel-row"></div>
<div class="cr-skel-row"></div>
<div class="cr-skel-row"></div>
</div>

<!-- Filters the already-loaded table rows client-side by name — see
     crApplySearchFilter() in RepDetailbyProduct.js. Shown/hidden
     alongside #crTableScroll below. -->
<div class="cr-search-wrap" id="crSearchWrap" style="display:none">
<span class="cr-search-icon">🔍</span>
<input
type="text"
class="cr-search-input"
id="crSearchInput"
placeholder="Search product..."
autocomplete="off">
<button type="button" class="cr-search-clear" id="crSearchClear" aria-label="Clear search" hidden>✕</button>
</div>

<div class="table-scroll" id="crTableScroll" style="display:none">
<table id="crTable">
<thead id="crThead"></thead>
<tbody id="crTbody"></tbody>
</table>
</div>

<div class="cr-empty" id="crEmptyMsg" style="display:none"></div>

</div>

</div>

<div id="bottomnav-container"></div>

<script src="/CM_Pro/assets/js/notification-badge.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="../../assets/js/creditreport/RepDetailbyProduct.js"></script>
<script src="../../assets/js/creditreport/RepDetailbyProduct-loader.js"></script>

</body>

</html>
