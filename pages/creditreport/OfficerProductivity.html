content="#032d73">

</script>

<link
rel="stylesheet"
href="../../assets/css/main.css">

<link
rel="stylesheet"
href="../../assets/css/creditreport/OfficerProductivity.css">

<script src="../../config/auth.js"></script>

<!-- ========================= -->

     OP_CATEGORIES — see that file for the field mapping per category.

<div class="op-cards" id="opCards" style="display:none"></div>

</div>

<div id="bottomnav-container"></div>
