<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Customer Risk Prediction</title>

<meta
name="theme-color"
content="#0e1b3c">

<script>
  document.documentElement.setAttribute(
    "data-theme",
    (function(){var t=localStorage.getItem("cm_theme")||"auto";return t==="auto"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;})()
  );
</script>

<link rel="stylesheet" href="../../assets/css/main.css">
<link rel="stylesheet" href="../../assets/css/multi-select.css">
<link rel="stylesheet" href="../../assets/css/creditreport/creditreport.css">
<link rel="stylesheet" href="../../assets/css/creditreport/PortfolioIntelligence.css">
<link rel="stylesheet" href="../../assets/css/creditreport/cr-icons.css">
<link rel="stylesheet" href="../../assets/css/creditreport/CustomerRisk.css">
<link rel="stylesheet" href="../../assets/css/creditreport/CustomerPrediction.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/global-splash.css">
<link rel="stylesheet" href="/CM_Pro/assets/css/toast.css">
<link rel="stylesheet" href="/CM_Pro/assets/css/loading.css">

<!-- Hold the first paint until the whole page is parsed (its scripts,
     translations and header), so a page transition slides in a finished
     page instead of one still filling itself in. -->
<link rel="expect" href="#cm-pt-parsed" blocking="render">
<link rel="preload" href="/CM_Pro/assets/fonts/Krasar-Regular.ttf" as="font" type="font/ttf" crossorigin>
<script src="/CM_Pro/shared/page-transition.js"></script>
<script src="/CM_Pro/shared/sw-register.js"></script>
</head>

<body>

<div id="offlineBanner" data-i18n="common.offline">
No Internet Connection
</div>

<script src="../../config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>
<script src="../../config/auth.js"></script>
<script src="../../config/session.js"></script>

<script src="/CM_Pro/shared/topbar.js"></script>
<script src="/CM_Pro/shared/theme.js"></script>
<script src="/CM_Pro/shared/language.js"></script>
<script src="/CM_Pro/shared/i18n.js"></script>
<script src="/CM_Pro/shared/i18n/common.js"></script>
<script src="/CM_Pro/shared/i18n/core.js"></script>
<script src="/CM_Pro/shared/i18n/creditreport.js"></script>
<script src="/CM_Pro/shared/i18n/explain.js"></script>
<script src="/CM_Pro/shared/loading.js"></script>
<script src="/CM_Pro/assets/js/global-splash.js"></script>
<script src="/CM_Pro/assets/js/toast.js"></script>

<div id="topbar-container"></div>

<div class="page-container pi-page">

<section id="ciFilters" aria-label="Filters"></section>

<!-- One-line answer: how much PAR is likely to roll, or why nothing is shown -->
<section class="pi-card ci-summary" id="cpSummary" hidden aria-live="polite"></section>

<section aria-labelledby="cpTitle">
<h2 class="pi-section-title" id="cpTitle" data-i18n="creditreport.cp.title">Customer Risk Prediction</h2>
<p class="pi-note" id="cpTarget"></p>
<div class="pi-kpis" id="cpKpis"></div>
</section>

<section class="pi-card" aria-labelledby="cpListTitle">
<div class="pi-card-head">
<h2 class="pi-card-title" id="cpListTitle" data-i18n="creditreport.cp.ranking">Who is likely to roll</h2>
<button type="button" class="pi-btn-ghost" id="cpExport" data-i18n="creditreport.npl.export">Export Excel</button>
</div>
<div class="pi-tabs" role="tablist" id="cpUnitTabs">
<button type="button" role="tab" data-unit="customer" data-i18n="creditreport.crk.byCustomer">By customer (CIF)</button>
<button type="button" role="tab" data-unit="loan" data-i18n="creditreport.crk.byLoan">By loan account</button>
</div>
<div class="ci-table-tools crk-tools">
<label class="crk-pick"><span data-i18n="creditreport.crk.top">Top</span>
<select id="cpTop" class="pi-top-pick"><option selected>20</option><option>50</option><option>100</option><option>200</option></select></label>
<label class="crk-pick"><span data-i18n="creditreport.crk.rankBy">Rank by</span>
<select id="cpSort" class="pi-top-pick">
<option value="expected" data-i18n="creditreport.cp.sortExpected">Expected PAR rolling</option>
<option value="p" data-i18n="creditreport.cp.sortP">Probability</option>
<option value="par" data-i18n="creditreport.crk.sortPar">PAR amount</option>
<option value="day" data-i18n="creditreport.crk.sortDpd">Days past due</option>
</select></label>
<input type="search" id="cpSearch" class="ci-search" data-i18n-placeholder="creditreport.crk.search" placeholder="Search name, CIF, loan…">
</div>
<p class="pi-note" id="cpCount"></p>
<div class="crk-list" id="cpList"></div>
</section>

<section class="pi-card" aria-labelledby="cpValTitle">
<div class="pi-card-head">
<h2 class="pi-card-title" id="cpValTitle" data-i18n="creditreport.cp.validation">Validation — how right has the model been?</h2>
<span id="cpGate"></span>
</div>
<p class="pi-note" id="cpValNote"></p>
<div class="pi-kpis cp-val-kpis" id="cpValKpis"></div>
<div class="cp-two">
<div>
<h3 class="cp-sub" data-i18n="creditreport.cp.calibration">Calibration: predicted vs actual roll rate</h3>
<div class="cp-chart"><canvas id="cpCalChart"></canvas></div>
<div class="pi-table-wrap"><table class="pi-table" id="cpCal"></table></div>
</div>
<div>
<h3 class="cp-sub" data-i18n="creditreport.cp.byOrigin">Each test day</h3>
<div class="pi-table-wrap"><table class="pi-table" id="cpOrigins"></table></div>
</div>
</div>
</section>

<section class="pi-card" aria-labelledby="cpModelTitle">
<h2 class="pi-card-title" id="cpModelTitle" data-i18n="creditreport.cp.model">The model: roll rate by segment</h2>
<p class="pi-note" id="cpModelNote"></p>
<div class="pi-table-wrap"><table class="pi-table" id="cpTable"></table></div>
</section>

<details class="pi-card" open>
<summary class="pi-card-title" data-i18n="creditreport.cp.method">Method, settings and limits</summary>
<div id="cpMethod" class="cp-method"></div>
</details>

<details class="pi-card" id="cpAdmin" hidden>
<summary class="pi-card-title" data-i18n="creditreport.cp.adminTitle">Model settings (admin)</summary>
<div class="cp-controls" id="cpAdminFields"></div>
<button type="button" class="pi-btn-ghost" id="cpAdminSave" data-i18n="creditreport.growth.save">Save</button>
</details>

</div>

<div id="bottomnav-container"></div>

<script src="/CM_Pro/assets/js/notification-badge.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<script src="../../assets/js/multi-select.js"></script>
<script src="../../assets/js/creditreport/CustomerPrediction-loader.js"></script>
<script src="../../assets/js/creditreport/ci-filters.js"></script>
<script src="../../assets/js/ci-explain.js"></script>
<script src="../../assets/js/creditreport/CustomerPrediction.js"></script>

</body>

</html>
