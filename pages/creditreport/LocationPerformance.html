<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Location Performance</title>

<meta
name="theme-color"
content="#032d73">

<script>
  document.documentElement.setAttribute(
    "data-theme",
    (function(){var t=localStorage.getItem("cm_theme")||"auto";return t==="auto"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;})()
  );
</script>

<link
rel="stylesheet"
href="../../assets/css/main.css">

<link
rel="stylesheet"
href="../../assets/css/creditreport/OfficerProductivity.css">

<link
rel="stylesheet"
href="../../assets/css/creditreport/BranchProductivity.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/global-splash.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/toast.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/loading.css">

</head>

<body>

<div id="offlineBanner">
⚠️ No Internet Connection
</div>

<script src="../../config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>
<script src="../../config/auth.js"></script>
<script src="../../config/session.js"></script>

<script src="/CM_Pro/shared/topbar.js"></script>
<script src="/CM_Pro/shared/theme.js"></script>
<script src="/CM_Pro/shared/loading.js"></script>
<script src="/CM_Pro/assets/js/global-splash.js"></script>
<script src="/CM_Pro/assets/js/toast.js"></script>

<div id="topbar-container"></div>

<div class="page-container">

<!-- ========================= -->
<!-- LOCATION HEADER -->
<!-- Same markup/CSS classes as Officer/Branch/Product Performance's own
     header card (op-header-card etc.) — reuses those files' CSS, no
     location-only additions needed. -->
<!-- ========================= -->

<div class="op-header-card" id="lpHeaderCard" style="display:none">
<div class="op-avatar" id="lpAvatar">?</div>
<div class="op-header-text">
<div class="op-officer-name" id="lpLocationName">-</div>
<div class="op-officer-meta" id="lpLocationMeta"></div>
</div>
</div>

<!-- Skeleton while the location's summary is being resolved -->
<div class="op-page-skel" id="lpPageSkel">
<div class="op-skel-card"></div>
<div class="op-skel-card"></div>
<div class="op-skel-card"></div>
<div class="op-skel-card"></div>
<div class="op-skel-card"></div>
</div>

<div class="op-empty" id="lpEmpty" style="display:none"></div>

<!-- ========================= -->
<!-- CATEGORY CARDS -->
<!-- Each card is built the same way by LocationPerformance.js from
     LP_CATEGORIES — see that file for the field mapping per category.
     Markup here is just the empty shell (#lpCards is populated at
     runtime). -->
<!-- ========================= -->

<div class="op-cards" id="lpCards" style="display:none"></div>

</div>

<!-- ========================= -->
<!-- CHART FULLSCREEN OVERLAY -->
<!-- ========================= -->

<div class="op-chart-fs-overlay" id="lpChartFsOverlay" hidden>
<button type="button" class="op-chart-fs-close" id="lpChartFsClose" aria-label="Close fullscreen">✕</button>
<div class="op-chart-fs-body-wrap" id="lpChartFsBody"></div>
</div>

<div id="bottomnav-container"></div>

<script src="/CM_Pro/assets/js/notification-badge.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="../../assets/js/creditreport/LocationPerformance.js"></script>
<script src="../../assets/js/creditreport/LocationPerformance-loader.js"></script>

</body>

</html>
