<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Action Tracking</title>

<meta
name="theme-color"
content="#0e1b3c">

<script>
  document.documentElement.setAttribute(
    "data-theme",
    (function(){var t=localStorage.getItem("cm_theme")||"auto";return t==="auto"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;})()
  );
</script>

<link rel="stylesheet" href="../../assets/css/main.css">
<link rel="stylesheet" href="../../assets/css/multi-select.css">
<link rel="stylesheet" href="../../assets/css/creditreport/creditreport.css">
<link rel="stylesheet" href="../../assets/css/creditreport/PortfolioIntelligence.css">

<link rel="stylesheet" href="/CM_Pro/assets/css/global-splash.css">
<link rel="stylesheet" href="/CM_Pro/assets/css/toast.css">
<link rel="stylesheet" href="/CM_Pro/assets/css/loading.css">

<!-- Hold the first paint until the whole page is parsed (its scripts,
     translations and header), so a page transition slides in a finished
     page instead of one still filling itself in. -->
<link rel="expect" href="#cm-pt-parsed" blocking="render">
<link rel="preload" href="/CM_Pro/assets/fonts/Krasar-Regular.ttf" as="font" type="font/ttf" crossorigin>
<script src="/CM_Pro/shared/page-transition.js"></script>
<script src="/CM_Pro/shared/sw-register.js"></script>
</head>

<body>

<div id="offlineBanner" data-i18n="common.offline">
No Internet Connection
</div>

<script src="../../config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>
<script src="../../config/auth.js"></script>
<script src="../../config/session.js"></script>

<script src="/CM_Pro/shared/topbar.js"></script>
<script src="/CM_Pro/shared/theme.js"></script>
<script src="/CM_Pro/shared/language.js"></script>
<script src="/CM_Pro/shared/i18n.js"></script>
<script src="/CM_Pro/shared/i18n/common.js"></script>
<script src="/CM_Pro/shared/i18n/core.js"></script>
<script src="/CM_Pro/shared/i18n/creditreport.js"></script>
<script src="/CM_Pro/shared/loading.js"></script>
<script src="/CM_Pro/assets/js/global-splash.js"></script>
<script src="/CM_Pro/assets/js/toast.js"></script>

<div id="topbar-container"></div>

<div class="page-container pi-page">


<section aria-labelledby="actTitle">
<div class="pi-card-head">
<h2 class="pi-section-title" id="actTitle" data-i18n="creditreport.act.title">Management Action Tracking</h2>
<button type="button" class="ci-btn-primary" id="actNewBtn" hidden data-i18n="creditreport.act.new">+ New action</button>
</div>
<div class="ci-act-counts" id="actCounts"></div>
</section>

<!-- Create -->
<section class="pi-card" id="actForm" hidden aria-labelledby="actFormTitle">
<h2 class="pi-card-title" id="actFormTitle" data-i18n="creditreport.act.new">+ New action</h2>
<form id="actCreate" class="ci-act-form" novalidate>
<div class="pi-filter-grid">
<label class="pi-field"><span data-i18n="creditreport.pi.branch">Branch</span><select id="afBranch" required></select></label>
<label class="pi-field"><span data-i18n="creditreport.act.responsible">Responsible officer</span><select id="afOfficer"></select></label>
<label class="pi-field"><span data-i18n="creditreport.act.priority">Priority</span>
<select id="afPriority">
<option value="low" data-i18n="creditreport.act.p.low">Low</option>
<option value="medium" selected data-i18n="creditreport.act.p.medium">Medium</option>
<option value="high" data-i18n="creditreport.act.p.high">High</option>
<option value="urgent" data-i18n="creditreport.act.p.urgent">Urgent</option>
</select></label>
<label class="pi-field"><span data-i18n="creditreport.act.dueDate">Due date</span><input type="date" id="afDue" required></label>
<label class="pi-field"><span data-i18n="creditreport.act.loanId">Loan ID (optional)</span><input type="text" id="afLoan" maxlength="60"></label>
<label class="pi-field"><span data-i18n="creditreport.npl.colCustomer">Customer</span><input type="text" id="afCustomer" maxlength="200"></label>
</div>
<label class="pi-field ci-act-desc"><span data-i18n="creditreport.act.description">Action description</span><textarea id="afDesc" rows="3" maxlength="2000" class="ci-textarea" required></textarea></label>
<p class="pi-note" id="afSource" hidden></p>
<div class="ci-act-buttons">
<button type="submit" class="ci-btn-primary" data-i18n="creditreport.act.create">Create action</button>
<button type="button" class="pi-btn-ghost" id="afCancel" data-i18n="creditreport.act.close">Close</button>
</div>
</form>
</section>

<!-- List -->
<section class="pi-card" aria-labelledby="actListTitle">
<div class="pi-card-head">
<h2 class="pi-card-title" id="actListTitle" data-i18n="creditreport.act.list">Actions</h2>
<label class="ci-check"><input type="checkbox" id="actMine"> <span data-i18n="creditreport.act.mine">Mine only</span></label>
</div>
<div class="pi-tabs ci-tabs-wide" role="tablist" id="actTabs">
<button type="button" role="tab" data-status="active" data-i18n="creditreport.act.s.active">Active</button>
<button type="button" role="tab" data-status="overdue" data-i18n="creditreport.act.s.overdue">Overdue</button>
<button type="button" role="tab" data-status="pending_review" data-i18n="creditreport.act.s.pending_review">Pending review</button>
<button type="button" role="tab" data-status="completed" data-i18n="creditreport.act.s.completed">Completed</button>
<button type="button" role="tab" data-status="cancelled" data-i18n="creditreport.act.s.cancelled">Cancelled</button>
</div>
<div class="ci-table-tools">
<input type="search" id="actSearch" class="ci-search" data-i18n-placeholder="creditreport.act.search" placeholder="Search action, loan, officer…">
<span class="pi-note" id="actCount"></span>
</div>
<div class="ci-toolbar" id="actTools">
<select id="actFPriority" aria-label="Priority" data-i18n-aria-label="creditreport.act.priority"></select>
<select id="actFBranch" aria-label="Branch" data-i18n-aria-label="creditreport.pi.branch"></select>
<select id="actFSource" aria-label="From" data-i18n-aria-label="creditreport.act.source"></select>
<select id="actSortSel" aria-label="Sort" data-i18n-aria-label="creditreport.list.sort"></select>
<span class="ci-seg" id="actView" role="group">
<button type="button" data-view="card" data-i18n="creditreport.list.cards">▦ Cards</button>
<button type="button" data-view="list" data-i18n="creditreport.list.list">☰ List</button>
</span>
<button type="button" class="pi-btn-ghost ci-clear" id="actClear" hidden data-i18n="creditreport.list.clear">Clear filters</button>
</div>
<ul class="ci-cards" id="actList"></ul>
<div class="pi-table-wrap ci-table-scroll" id="actTableWrap" hidden><table class="pi-table ci-table ci-act-table" id="actTable"></table></div>
</section>

<!-- Detail -->
<dialog class="ci-dialog" id="actDialog" aria-labelledby="adTitle">
<div class="ci-dialog-head">
<h2 class="pi-card-title" id="adTitle"></h2>
<button type="button" class="pi-btn-ghost" id="adClose" data-i18n-aria-label="creditreport.act.close" aria-label="Close">✕</button>
</div>
<div id="adBody"></div>
</dialog>

</div>

<div id="bottomnav-container"></div>

<script src="/CM_Pro/assets/js/notification-badge.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="../../assets/js/multi-select.js"></script>
<script src="../../assets/js/creditreport/ActionTracking-loader.js"></script>
<script src="../../assets/js/creditreport/ci-filters.js"></script>
<script src="../../assets/js/creditreport/ActionTracking.js"></script>

</body>

</html>
