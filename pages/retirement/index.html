<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ការគណនាចំនួនខែចូលនិវត្តន៍</title>
<meta
name="theme-color"
content="#0e1b3c">

<!-- Applied before any CSS loads, so there's no flash of the wrong
     theme on page load. Keep this as the very first thing in <head>. -->
<script>
  document.documentElement.setAttribute(
    "data-theme",
    (function(){var t=localStorage.getItem("cm_theme")||"auto";return t==="auto"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):t;})()
  );
</script>

<link
rel="stylesheet"
href="../../assets/css/main.css">
<link
rel="stylesheet"
href="../../assets/css/retirement.css">
<link
rel="stylesheet"
href="/CM_Pro/assets/css/global-splash.css">
</head>
<body>
<!-- ========================= -->
<!-- OFFLINE -->
<!-- ========================= -->
<div id="offlineBanner" data-i18n="common.offline">
No Internet Connection
</div>
<!-- ========================= -->
<!-- CONFIG -->
<!-- ========================= -->
<script src="../../config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>
<script src="../../config/auth.js"></script>
<script src="../../config/session.js"></script>
<!-- ========================= -->
<!-- COMPONENT -->
<!-- ========================= -->
<script src="/CM_Pro/shared/topbar.js"></script>
<script src="/CM_Pro/shared/theme.js"></script>
<script src="/CM_Pro/shared/language.js"></script>
<script src="/CM_Pro/shared/i18n.js"></script>
<script src="/CM_Pro/shared/i18n/common.js"></script>
<script src="/CM_Pro/shared/i18n/core.js"></script>
<script src="/CM_Pro/shared/i18n/features.js"></script>
<script src="/CM_Pro/assets/js/global-splash.js"></script>
<script src="/CM_Pro/assets/js/toast.js"></script>
<!-- ========================= -->
<!-- TOPBAR -->
<!-- ========================= -->
<div id="topbar-container"></div>
<!-- ========================= -->
<!-- PAGE -->
<!-- ========================= -->
<div class="page-container">

<!-- RESULT (top, so every change is visible without scrolling) -->

<div class="result-card" id="resultCard" data-state="ok">

<div class="result-top">
<div class="result-title" data-i18n="retirement.monthsLeftTitle">ចំនួនខែដែលនៅសល់</div>
<span class="result-badge" id="resultBadge"></span>
</div>

<div class="months-row">
<div id="monthsLeft" class="months-big">—</div>
<button type="button" class="copy-btn" id="btnCopyMonths" aria-label="Copy" data-i18n-aria-label="retirement.copy">
<span class="ui-ico ui-ico-copy" aria-hidden="true"></span>
</button>
</div>

<div class="ymd" id="ymd">
<div class="ymd-cell"><b id="ymdY">0</b><span data-i18n="retirement.unitYears">ឆ្នាំ</span></div>
<div class="ymd-cell"><b id="ymdM">0</b><span data-i18n="retirement.unitMonths">ខែ</span></div>
<div class="ymd-cell"><b id="ymdD">0</b><span data-i18n="retirement.unitDays">ថ្ងៃ</span></div>
</div>

<div id="description" class="desc"></div>

<div class="progress" aria-hidden="true">
<div class="progress-bar"><i id="progressFill"></i></div>
<div class="progress-legend">
<span><span data-i18n="retirement.ageNow">អាយុបច្ចុប្បន្ន</span> <b id="ageNow">—</b></span>
<span><span data-i18n="retirement.retireOn">ចូលនិវត្តន៍</span> <b id="retireDate">—</b></span>
</div>
</div>

</div>

<!-- INPUTS -->

<div class="form-card">

<div class="form-group">
<label for="dob" data-i18n="retirement.dobLabel">ថ្ងៃខែឆ្នាំកំណើត</label>
<div class="box">
<span class="ui-ico ui-ico-calendar box-ico" aria-hidden="true"></span>
<input type="date" id="dob">
</div>
</div>

<div class="form-group">
<label for="retirementAge" data-i18n="retirement.retirementAgeLabel">អាយុចូលនិវត្តន៍</label>
<div class="age-wrap">
<input id="retirementAge" class="age-slider" type="range" min="0" max="60" value="55" step="1">
<div class="age-num">
<button type="button" class="age-step" data-step="-1" aria-label="-1">−</button>
<input type="number" id="ageInput" min="0" max="60" value="55" inputmode="numeric">
<button type="button" class="age-step" data-step="1" aria-label="+1">+</button>
</div>
</div>
<div class="age-presets">
<button type="button" class="age-chip" data-age="55">55</button>
<button type="button" class="age-chip" data-age="58">58</button>
<button type="button" class="age-chip" data-age="60">60</button>
<span class="units"><span data-i18n="retirement.yearsSuffix">ឆ្នាំ</span> (0–60)</span>
</div>
</div>

<div class="form-group">
<div class="label-row">
<label for="currentDate" data-i18n="retirement.currentDateLabel">ថ្ងៃខែឆ្នាំបច្ចុប្បន្ន</label>
<button type="button" class="today-btn" id="btnToday" data-i18n="retirement.today">ថ្ងៃនេះ</button>
</div>
<div class="box">
<span class="ui-ico ui-ico-calendar box-ico" aria-hidden="true"></span>
<input type="date" id="currentDate">
</div>
</div>

</div>

<div class="foot-note"><span class="ui-ico ui-ico-bulb" aria-hidden="true"></span> <span data-i18n="retirement.footNote">គោលបំណង៖ កំណត់រយៈពេលផ្តល់ឥណទានឲ្យបានត្រឹមត្រូវតាមគោលការណ៍
សម្រាប់ឥណទានប្រើប្រាស់ផ្ទាល់ខ្លួន ដែលធានាដោយប្រាក់បៀវត្ស៕</span>
</div>

</div>

<!-- ========================= -->
<!-- LOADING -->
<!-- ========================= -->
<div
id="loadingBox"
class="loading-box"
style="display:none;">
<div class="spinner"></div>
</div>
<!-- ========================= -->
<!-- BOTTOM -->
<!-- ========================= -->
<div id="bottomnav-container"></div>
<!-- NOTIFICATION BADGE -->
<script src="/CM_Pro/assets/js/notification-badge.js"></script>
<!-- RETIREMENT LOGIC -->
<script src="../../assets/js/retirement.js"></script>
<!-- PAGE LOADER (component loader, offline, notification badge) -->
<script src="../../assets/js/retirement-loader.js"></script>
</body>
</html>
