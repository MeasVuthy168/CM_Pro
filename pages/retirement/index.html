name="theme-color"
content="#032d73">

rel="stylesheet"
href="../../assets/css/main.css">

rel="stylesheet"
href="../../assets/css/retirement.css">

rel="stylesheet"
href="/CM_Pro/assets/css/global-splash.css">

<body>

</div>

<!-- ========================= -->

<!-- ========================= -->

<script src="../../config/api.js"></script>

<script src="../../config/auth.js"></script>

<script src="../../config/session.js"></script>

<!-- ========================= -->

<script src="/CM_Pro/assets/js/toast.js"></script>

<!-- ========================= -->
<!-- TOPBAR -->
<!-- ========================= -->

<div id="topbar-container"></div>

<!-- ========================= -->
<!-- PAGE -->
<!-- ========================= -->

<div class="page-container">

<div class="form-card">

<div class="form-group">

<label for="customerName">ឈ្មោះអតិថិជន</label>

<input type="text" id="customerName" placeholder="ឧ. ACB">

</div>

<div class="form-group">

<label for="dob">ថ្ងៃខែឆ្នាំកំណើត</label>

<div class="box">

<input type="date" id="dob">

</div>

</div>

<div class="form-group">

<label for="retirementAge">អាយុចូលនិវត្តន៍</label>

<div class="age-wrap">

<input id="retirementAge" class="age-slider" type="range" min="0" max="60" value="55" step="1">

<div class="age-num">

<input type="number" id="ageInput" min="0" max="60" value="55"> ឆ្នាំ

</div>

</div>

<div class="units">(0–60)</div>

</div>

<div class="form-group">

<label for="currentDate">ថ្ងៃខែឆ្នាំបច្ចុប្បន្ន</label>

<div class="box">

<input type="date" id="currentDate">

</div>

</div>

<div class="export-buttons">

<button id="btnPDF">

<img src="https://img.icons8.com/color/48/pdf.png" alt="PDF" width="32">

</button>

<button id="btnExcel">

<img src="https://img.icons8.com/color/48/ms-excel.png" alt="Excel" width="32">

</button>

</div>

</div>

<div id="exportSection"></div>

<div class="foot-note">

💡 គោលបំណង៖ កំណត់រយៈពេលផ្តល់ឥណទានឲ្យបានត្រឹមត្រូវតាមគោលការណ៍
សម្រាប់ឥណទានប្រើប្រាស់ផ្ទាល់ខ្លួន ដែលធានាដោយប្រាក់បៀវត្សា៕

</div>

</div>

<!-- ========================= -->
<!-- LOADING -->
<!-- ========================= -->

<div
id="loadingBox"
class="loading-box"
style="display:none;">

<div class="spinner"></div>

</div>

<!-- ========================= -->
<!-- BOTTOM -->
<!-- ========================= -->

<div id="bottomnav-container"></div>

<!-- ========================= -->
<!-- COMPONENT LOADER -->
<!-- ========================= -->

<script>

let loaded=0;

async function loadComponent(id,file){

try{

const useCache=

id!=="topbar-container";

const cached=

useCache

?

sessionStorage.getItem(

"comp_"+id

)

:

null;

if(cached){

document.getElementById(id).innerHTML=

cached;

}else{

const response=

await fetch(file);

const html=

await response.text();

document.getElementById(id).innerHTML=

html;

if(useCache){

sessionStorage.setItem(

"comp_"+id,

html

);

}

}

if(id==="topbar-container"){

initTopbar({

title:"ចំនួនខែចូលនិវត្តន៍",

showBack:true,

showLogo:false,

showProfile:false

});

}

}catch(error){

console.error(error);

}finally{

loaded++;

if(loaded>=2){

setTimeout(()=>{

if(typeof hideGlobalSplash==="function"){

hideGlobalSplash();

}

},300);

}

}

}

function updateOnlineStatus(){

document.getElementById(

"offlineBanner"

).style.display=

navigator.onLine

?

"none"

:

"block";

}

window.addEventListener(

"online",

updateOnlineStatus

);

window.addEventListener(

"offline",

updateOnlineStatus

);

updateOnlineStatus();

loadComponent(

"topbar-container",

"/CM_Pro/components/topbar.html"

);

loadComponent(

"bottomnav-container",

"/CM_Pro/components/bottomnav.html"

);

// =========================
// Notification Badge
// =========================

setTimeout(()=>{

if(typeof loadNotificationBadge==="function"){

loadNotificationBadge();

}

},500);

</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

<!-- NOTIFICATION BADGE -->

<script src="/CM_Pro/assets/js/notification-badge.js"></script>
<script src="../../assets/js/retirement.js"></script>

</body>

</html>
