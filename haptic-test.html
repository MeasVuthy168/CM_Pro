<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haptic test</title>
<!-- Not linked from the app: a quick way to see which haptic method an
     iPhone plays (20/11/2026). Open /CM_Pro/haptic-test.html. -->
<style>
  body{ font-family:-apple-system, system-ui, sans-serif; margin:0; padding:16px; background:#0E1B3C; color:#EAF0FF; }
  h1{ font-size:18px; }
  .t{ background:#131C2E; border:1px solid #223055; border-radius:14px; padding:14px; margin:12px 0; }
  .t b{ display:block; margin-bottom:8px; }
  .t small{ display:block; color:#8FA0C7; margin-top:6px; }
  button, .hit{ position:relative; display:block; width:100%; min-height:52px; border-radius:12px; border:0;
    background:#FFD700; color:#0E1B3C; font-size:16px; font-weight:700; }
  .hit label{ position:absolute; inset:0; opacity:0.011; }
  .hit label input{ position:absolute; inset:0; width:100%; height:100%; margin:0; }
  .hit span{ position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; }
  input[switch]{ transform:scale(1.4); margin:6px; }
  #log{ font-size:13px; color:#8FA0C7; white-space:pre-wrap; }
</style>
</head>
<body>
<h1>តេស្តការញ័រ (Haptic)</h1>
<p>ចុចម្តងមួយៗ ហើយប្រាប់ថាលេខណាខ្លះញ័រ។</p>

<div class="t"><b>1. Switch ពិត (មើលឃើញ)</b>
  <label><input type="checkbox" switch> ចុច Switch នេះ</label>
  <small>វិធីរបស់ iOS ផ្ទាល់។</small></div>

<div class="t"><b>2. ចុច Switch តាមកូដ (កំណែ v881)</b>
  <button id="b2">ចុចទីនេះ</button></div>

<div class="t"><b>3. Switch មើលមិនឃើញ ពីលើប៊ូតុង (កំណែថ្មី)</b>
  <div class="hit"><label><input type="checkbox" switch id="i3"></label><span>ចុចទីនេះ</span></div></div>

<div class="t"><b>4. navigator.vibrate</b>
  <button id="b4">ចុចទីនេះ</button></div>

<div id="log"></div>
<script>
  const log = m => { document.getElementById("log").textContent += m + "\n"; };
  log("UA: " + navigator.userAgent);
  log("standalone: " + (navigator.standalone || matchMedia("(display-mode: standalone)").matches));
  document.getElementById("b2").addEventListener("click", () => {
    const label = document.createElement("label");
    label.style.display = "none";
    const input = document.createElement("input");
    input.type = "checkbox"; input.setAttribute("switch", "");
    label.appendChild(input); document.head.appendChild(label);
    label.click(); document.head.removeChild(label);
    log("2: clicked (" + input.checked + ")");
  });
  document.getElementById("i3").addEventListener("change", e => log("3: toggled (" + e.target.checked + ")"));
  document.getElementById("b4").addEventListener("click", () => {
    log("4: vibrate " + (navigator.vibrate ? navigator.vibrate(30) : "not available"));
  });
</script>
</body>
</html>
