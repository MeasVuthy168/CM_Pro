<!DOCTYPE html>
<html>
<head>

    <title>CM_Pro</title>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <link
        rel="manifest"
        href="/CM_Pro/manifest.json"
    >

    <meta
        name="theme-color"
        content="#032d73"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="CM_Pro"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <link
        rel="apple-touch-icon"
        href="/CM_Pro/assets/images/icon-192.png"
    >

    <!-- MAIN CSS -->
    <link
        rel="stylesheet"
        href="./assets/css/main.css"
    >

    <!-- GLOBAL SPLASH -->
    <link
        rel="stylesheet"
        href="/CM_Pro/assets/css/global-splash.css"
    >

    <style>

        /* OFFLINE */
        #offlineBanner{
            position:fixed;
            top:10px;
            left:50%;
            transform:translateX(-50%);
            background:#d90429;
            color:#fff;
            padding:10px 18px;
            border-radius:14px;
            font-size:14px;
            font-weight:600;
            z-index:999999;
            display:none;
            box-shadow:0 4px 15px rgba(0,0,0,.2);
        }

    </style>

</head>

<body>

    <!-- OFFLINE -->
    <div id="offlineBanner">
        ⚠️ No Internet Connection
    </div>

    <!-- API -->
    <script src="./config/api.js"></script>

    <!-- AUTH -->
    <script src="./config/auth.js"></script>

    <!-- SESSION -->
    <script src="./config/session.js"></script>

    <!-- PUSH -->
    <script src="./config/push.js"></script>

    <!-- TOPBAR -->
    <script src="/CM_Pro/shared/topbar.js"></script>

    <!-- GLOBAL SPLASH -->
    <script src="/CM_Pro/assets/js/global-splash.js"></script>

    <!-- LOGOUT -->
    <script>

        function logout(){

            if(confirm("Logout CM_Pro ?")){

                localStorage.removeItem("token");

                localStorage.removeItem("loggedInUser");

                sessionStorage.clear();

                window.location.replace(
                    "/CM_Pro/login.html"
                );

            }

        }

    </script>

    <!-- TOPBAR -->
    <div id="topbar-container"></div>

    <!-- DASHBOARD -->
    <div class="dashboard-container">

        <div class="dashboard-grid">

            <a
                href="./pages/customers/index.html"
                class="dashboard-card"
            >

                <img src="./assets/icons/customer.PNG">

                <div class="dashboard-card-title">
                    Customer Search
                </div>

            </a>

            <a
                href="./pages/arrears/index.html"
                class="dashboard-card"
            >

                <img src="./assets/icons/arrears.PNG">

                <div class="dashboard-card-title">
                    Daily Arrears
                </div>

            </a>

            <a
                href="./pages/turnover/index.html"
                class="dashboard-card"
            >

                <img src="./assets/icons/turnover.PNG">

                <div class="dashboard-card-title">
                    Average Turnover
                </div>

            </a>

            <a
                href="./pages/spotcheck/index.html"
                class="dashboard-card"
            >

                <img src="./assets/icons/spotcheck.PNG">

                <div class="dashboard-card-title">
                    Spot Check
                </div>

            </a>

        </div>

        <!-- ASSISTANT -->
        <div class="assistant-box">

            <img
                src="./assets/images/robot.svg"
                class="assistant-icon"
            >

            <div class="assistant-text">
                សូមស្វាគមន៍ មកកាន់ប្រព័ន្ធតាមដានឥណទាន CM_Pro 🎉
            </div>

        </div>

    </div>

    <!-- BOTTOM NAV -->
    <div id="bottomnav-container"></div>

    <!-- MAIN SCRIPT -->
    <script>

        // =========================
        // COMPONENT LOADER
        // =========================
        let loaded = 0;

        async function loadComponent(id,file){

            try{

                const response = await fetch(file);

                const html = await response.text();

                document.getElementById(id).innerHTML = html;

if(id === "topbar-container"){

    loadTopbarUser();

    const user = JSON.parse(

        localStorage.getItem(
            "loggedInUser"
        ) || "{}"

    );

    initTopbar({

        dashboardMode:true,

        userName:

            user.fullname ||

            user.username ||

            "User",

        showLogo:true,

        showProfile:true,

        showBack:false

    });

}

            }catch(error){

                console.error(
                    "Component load error:",
                    error
                );

            }finally{

                loaded++;

                // BOTH COMPONENTS READY
                if(loaded >= 2){

                    setTimeout(()=>{

                        if(
                            typeof hideGlobalSplash
                            === "function"
                        ){

                            hideGlobalSplash();

                        }

                    },300);

                }

            }

        }

        // =========================
        // LOAD USER
        // =========================
        function loadTopbarUser(){

    try{

        const loggedInUser = JSON.parse(

            localStorage.getItem(
                "loggedInUser"
            ) || "{}"

        );

        const fullname =

            loggedInUser.fullname ||

            loggedInUser.username ||

            "User";

        // PROFILE IMAGE

        const profile =

            document.getElementById(
                "topbarProfile"
            );

        if(

            profile &&

            loggedInUser.image

        ){

            profile.src =
                loggedInUser.image;

        }

        // USER NAME

        const userName =

            document.getElementById(
                "topbarUserName"
            );

        if(userName){

            userName.innerText =
                fullname;

        }

    }catch(error){

        console.error(
            "Topbar user error:",
            error
        );

    }

}
        // =========================
        // OFFLINE DETECT
        // =========================
        function updateOnlineStatus(){

            const banner =

                document.getElementById(
                    "offlineBanner"
                );

            banner.style.display =

                navigator.onLine
                ? "none"
                : "block";

        }

        window.addEventListener(
            "online",
            updateOnlineStatus
        );

        window.addEventListener(
            "offline",
            updateOnlineStatus
        );

        updateOnlineStatus();

        // =========================
        // CARD VIBRATION
        // =========================
        document.addEventListener(
            "click",
            (e)=>{

                if(

                    e.target.closest(
                        ".dashboard-card"
                    )

                    &&

                    navigator.vibrate

                ){

                    navigator.vibrate(20);

                }

            }
        );

        // =========================
        // LOAD COMPONENTS
        // =========================
loadComponent(
    "topbar-container",
    "./components/topbar.html"
);

loadComponent(
    "bottomnav-container",
    "./components/bottomnav.html"
);

        // =========================
        // PUSH INIT
        // =========================
        PushNotification.init();

        // =========================
        // FAILSAFE SPLASH
        // =========================
        window.addEventListener(
            "load",
            ()=>{

                setTimeout(()=>{

                    if(
                        typeof hideGlobalSplash
                        === "function"
                    ){

                        hideGlobalSplash();

                    }

                },2500);

            }
        );

    </script>

</body>
</html>
