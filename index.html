    <!-- LOGOUT -->
    <script>

        function logout(){

            if(confirm("Logout CM_Pro ?")){

                localStorage.removeItem("token");

                localStorage.removeItem("loggedInUser");

                sessionStorage.clear();

                window.location.replace(
                    "/CM_Pro/login.html"
                );

            }

        }

    <!-- BOTTOM NAV -->

    <!-- MAIN SCRIPT -->
    <script>

        // =========================
        // COMPONENT LOADER
        // =========================
        let loaded = 0;

        async function loadComponent(id,file){

            try{

                const response = await fetch(file);

                const html = await response.text();

                document.getElementById(id).innerHTML = html;

if(id === "topbar-container"){

    const user = JSON.parse(

        localStorage.getItem("loggedInUser") || "{}"

    );

    initTopbar({

        dashboardMode:true,

        userName:
            user.fullname ||
            user.username ||
            "User",

        showLogo:true,
        showProfile:true,
        showBack:false

    });

    loadTopbarUser();

    loadTopbarPhoto();

}
            }catch(error){

                console.error(
                    "Component load error:",
                    error
                );

            }finally{

                loaded++;

                // BOTH COMPONENTS READY
                if(loaded >= 2){

                    setTimeout(()=>{

                        if(
                            typeof hideGlobalSplash
                            === "function"
                        ){

                            hideGlobalSplash();

                        }

                    },300);

                }

            }

        }

        // =========================
        // LOAD USER
        // =========================
   function loadTopbarUser(){

    try{

        const user = JSON.parse(
            localStorage.getItem("loggedInUser") || "{}"
        );

        const fullname =
            user.fullname ||
            user.username ||
            "User";

        const userName =
            document.getElementById("topbarUserName");

        if(userName){
            userName.innerText = fullname;
        }

    }catch(error){

        console.error(error);

    }

}     
      
        // =========================
        // OFFLINE DETECT
        // =========================
        function updateOnlineStatus(){

            const banner =

                document.getElementById(
                    "offlineBanner"
                );

            banner.style.display =

                navigator.onLine
                ? "none"
                : "block";

        }

        window.addEventListener(
            "online",
            updateOnlineStatus
        );

        window.addEventListener(
            "offline",
            updateOnlineStatus
        );

        updateOnlineStatus();

        // =========================
        // CARD VIBRATION
        // =========================
        document.addEventListener(
            "click",
            (e)=>{

                if(

                    e.target.closest(
                        ".dashboard-card"
                    )

                    &&

                    navigator.vibrate

                ){

                    navigator.vibrate(20);

                }

            }
        );

        // =========================
        // LOAD COMPONENTS
        // =========================
loadComponent(
    "topbar-container",
    "./components/topbar.html"
);

loadComponent(
    "bottomnav-container",
    "./components/bottomnav.html"
);










        
        


        


    async function testPermission(){

    try{

        const result =
            await Notification.requestPermission();

        alert(
            "Permission = " + result
        );

    }catch(err){

        alert(
            "ERROR = " + err.message
        );

    }

}

async function testPush(){

    try{

        const reg =
            await navigator
                .serviceWorker
                .ready;

        const sub =
            await reg
                .pushManager
                .subscribe({

                    userVisibleOnly:true,

                    applicationServerKey:

                        PushNotification
                        .urlBase64ToUint8Array(

"BJKtfYLpS5SGXyuAcM3kR7wt_1dHcg1apVIrT8lQ5fXJDDxNml6acZD4PAheC5j36xc3qlDg0L8C7p3kiuydrQo"

                        )

                });

        alert(
            JSON.stringify(sub)
        );

    }catch(err){

        alert(
            "SUB ERROR:\n" +
            err.message
        );

    }

}
        
        
        
        
        
        
        // =========================
        // PUSH INIT
        // =========================
        PushNotification.init();






// =========================
// IOS PUSH DEBUG
// =========================
window.addEventListener(

    "load",

    async ()=>{

        try{

            const reg =

                await navigator
                    .serviceWorker
                    .ready;

            const sub =

                await reg
                    .pushManager
                    .getSubscription();

            alert(

                "Permission: "

                + Notification.permission

                + "\nStandalone: "

                + navigator.standalone

                + "\nSubscribed: "

                + !!sub

            );

        }catch(err){

            alert(
                "ERROR:\n" + err.message
            );

        }

    }

);










        
        // =========================

        window.addEventListener(
            "load",
            ()=>{

                setTimeout(()=>{

                    if(
                        typeof hideGlobalSplash
                        === "function"
                    ){

                        hideGlobalSplash();

                    }

                },2500);

            }
        );

    </script>
