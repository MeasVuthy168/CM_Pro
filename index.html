<!DOCTYPE html>
<html>
<head>
<title>CM_Pro</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="manifest" href="/CM_Pro/manifest.json">

<meta name="theme-color" content="#032d73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CM_Pro">
<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="/CM_Pro/assets/images/icon-192.png">

<!-- Applied before any CSS loads, so there's no flash of the wrong
     theme on page load. Keep this as the very first thing in <head>. -->
<script>
  document.documentElement.setAttribute(
    "data-theme",
    localStorage.getItem("cm_theme") || "light"
  );
</script>

<!-- ========================= -->
<!-- STYLES -->
<!-- ========================= -->

<link rel="stylesheet" href="./assets/css/main.css">
<link rel="stylesheet" href="/CM_Pro/assets/css/global-splash.css">
<link rel="stylesheet" href="/CM_Pro/assets/css/toast.css">
<link rel="stylesheet" href="./assets/css/assistant.css">
<link rel="stylesheet" href="./assets/css/dashboard.css">

</head>

<body>

<div id="offlineBanner">
⚠️ No Internet Connection
</div>

<!-- ========================= -->
<!-- CONFIG -->
<!-- ========================= -->

<script src="./config/api.js"></script>
<script src="/CM_Pro/shared/touch-polish.js"></script>
<script src="./config/auth.js"></script>
<script src="./config/session.js"></script>
<script src="./config/push.js"></script>

<!-- ========================= -->
<!-- COMPONENT -->
<!-- ========================= -->

<script src="/CM_Pro/shared/topbar.js"></script>
<script src="/CM_Pro/shared/theme.js"></script>
<script src="/CM_Pro/shared/logout.js"></script>
<script src="/CM_Pro/assets/js/global-splash.js"></script>
<script src="/CM_Pro/assets/js/toast.js"></script>
<script src="./assets/js/assistant-box.js"></script>
<script src="./assets/js/voice-command.js"></script>
<script src="./assets/js/robot-animator.js"></script>
<script src="./assets/js/robot-embed.js"></script>

<!-- ========================= -->
<!-- TOPBAR -->
<!-- ========================= -->

<div id="topbar-container"></div>

<!-- ========================= -->
<!-- PAGE -->
<!-- ========================= -->

<div class="dashboard-container">

<div class="dashboard-grid">

<!-- Row 1 -->

<a href="./pages/customers/index.html" class="dashboard-card">
<img src="./assets/icons/customer.PNG">
<div class="dashboard-card-title">
Customer Search
</div>
</a>

<a href="./pages/arrears/index.html" class="dashboard-card">
<img src="./assets/icons/arrears.PNG">
<div class="dashboard-card-title">
Daily Arrears
</div>
</a>

<a href="./pages/turnover/index.html" class="dashboard-card">
<img src="./assets/icons/turnover.PNG">
<div class="dashboard-card-title">
Average Turnover
</div>
</a>

<!-- Row 2 -->

<a href="./pages/spotcheck/index.html" class="dashboard-card">
<img src="./assets/icons/spotcheck.PNG">
<div class="dashboard-card-title">
Spot Check
</div>
</a>

<a href="./pages/officertask/index.html" class="dashboard-card">
<img src="./assets/icons/officer.PNG">
<div class="dashboard-card-title">
Officer Task
</div>
</a>

<a href="./pages/landClassisfy/index.html" class="dashboard-card">
<img src="./assets/icons/landClassisfy.PNG">
<div class="dashboard-card-title">
ចំណាត់ថ្នាក់ដីធ្លី
</div>
</a>

<!-- Row 3 -->

<a href="./pages/creditreport/index.html" class="dashboard-card">
<img src="./assets/icons/creditreport.PNG">
<div class="dashboard-card-title">
របាយការណ៍ឥណទាន
</div>
</a>

<a href="./pages/loanCalculate/index.html" class="dashboard-card">
<img src="./assets/icons/loan.PNG">
<div class="dashboard-card-title">
គណនាឥណទាន
</div>
</a>

<a href="./pages/retirement/index.html" class="dashboard-card">
<img src="./assets/icons/retirement.PNG">
<div class="dashboard-card-title">
ចំនួនខែចូលនិវត្តន៍
</div>
</a>

</div>

<div class="assistant-box">

<div class="assistant-icon-wrap">
<div id="assistantRobotSlot" class="assistant-icon"></div>
</div>

<div class="assistant-text" id="assistantText">
សូមស្វាគមន៍ មកកាន់ប្រព័ន្ធតាមដានឥណទាន CM_Pro 🎉
</div>

<button id="assistantMicBtn" class="assistant-mic-btn" aria-label="Voice command" type="button">🎤</button>

</div>

</div>

<!-- ========================= -->
<!-- VOICE COMMAND SHEET -->
<!-- ========================= -->

<div id="voiceModal" class="voice-modal">

<div class="voice-sheet">

<div class="voice-sheet-greeting" id="voiceGreeting">Hi,</div>

<div class="voice-sheet-status" id="voiceStatus">What can I do for you?</div>

<div class="voice-sheet-btn-wrap" id="voiceBtnWrap">
<div class="voice-sheet-ring"></div>
<button class="voice-sheet-btn" id="voiceStopBtn" type="button" aria-label="Stop listening">⏹</button>
</div>

<div class="voice-sheet-hint">Try saying "Open Customer Search"</div>

</div>

</div>

<!-- ========================= -->
<!-- VOICE "NOT FOUND" SNACKBAR -->
<!-- ========================= -->

<div id="voiceSnackbar" class="voice-snackbar">
<div class="voice-snackbar-icon">i</div>
<div class="voice-snackbar-text">Voice command not found</div>
<button id="voiceSnackbarHelp" class="voice-snackbar-help" type="button">HELP</button>
</div>

<!-- ========================= -->
<!-- BOTTOM -->
<!-- ========================= -->

<div id="bottomnav-container"></div>

<!-- ========================= -->
<!-- NOTIFICATION BADGE -->
<!-- ========================= -->

<script src="/CM_Pro/assets/js/notification-badge.js"></script>

<!-- ========================= -->
<!-- DASHBOARD LOGIC -->
<!-- ========================= -->

<script src="./assets/js/dashboard.js"></script>

<script>
  // fullname is read automatically from the loggedInUser object in
  // storage (set at login, cleared by session.js's autoLogout).
  initAssistantBox();

  // The robot is inlined (not an <img>) specifically so it can be
  // driven from JS — see assets/js/robot-embed.js for why. Once the
  // greeting card has loaded, starts the continuous welcome loop
  // (waist -> welcome -> wave -> waist -> pause -> welcome again -> ...)
  // rather than a one-shot greet() that would only play once.
  embedCMProRobot(document.getElementById("assistantRobotSlot"), {
    src: "./assets/images/robot.svg",
  }).then((robot) => {
    if (robot) robot.startWelcomeLoop();
  });
</script>

</body>
</html>
