<!DOCTYPE html>
<html>

<head>

    <title>CM_Pro</title>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="./assets/css/main.css"
    >

</head>

<body>

    <!-- DEBUG -->
    <div
        id="debugBox"
        style="
            position:fixed;
            top:120px;
            left:10px;
            right:10px;
            z-index:99999;
            background:#fff;
            color:#000;
            padding:15px;
            border-radius:12px;
            font-size:12px;
            word-break:break-word;
            box-shadow:0 0 10px rgba(0,0,0,0.3);
        "
    ></div>

    <!-- DEBUG SCRIPT -->
    <script>

        const debugUser =
            localStorage.getItem(
                "loggedInUser"
            );

        const debugToken =

            localStorage.getItem(
                "token"
            ) ||

            sessionStorage.getItem(
                "token"
            );

        document.getElementById(
            "debugBox"
        ).innerHTML = `

            <b>loggedInUser:</b><br>
            ${debugUser}<br><br>

            <b>token exists:</b><br>
            ${debugToken ? "YES" : "NO"}

        `;

        console.log(
            "loggedInUser:",
            debugUser
        );

    </script>

    <!-- Auth Guard -->
    <script src="./config/auth.js"></script>

    <!-- Logout -->
    <script>

        function logout(){

            const confirmLogout =
                confirm("Logout CM_Pro ?");

            if(confirmLogout){

                // REMOVE LOGIN ONLY

                localStorage.removeItem(
                    "token"
                );

                localStorage.removeItem(
                    "loggedInUser"
                );

                sessionStorage.clear();

                // KEEP remember_login

                window.location.replace(
                    "/CM_Pro/login.html"
                );

            }

        }

    </script>

    <!-- Topbar -->
    <div id="topbar-container"></div>

    <!-- Dashboard -->
    <div class="dashboard-container">

        <!-- Dashboard Grid -->
        <div class="dashboard-grid">

            <!-- Customer -->
            <a
                href="./pages/customers/index.html"
                class="dashboard-card"
            >

                <img
                    src="./assets/icons/customer.PNG"
                >

                <div class="dashboard-card-title">
                    Customer Search
                </div>

            </a>

            <!-- Arrears -->
            <a
                href="./pages/arrears/index.html"
                class="dashboard-card"
            >

                <img
                    src="./assets/icons/arrears.PNG"
                >

                <div class="dashboard-card-title">
                    Daily Arrears
                </div>

            </a>

            <!-- Turnover -->
            <a
                href="./pages/turnover/index.html"
                class="dashboard-card"
            >

                <img
                    src="./assets/icons/turnover.PNG"
                >

                <div class="dashboard-card-title">
                    Average Turnover
                </div>

            </a>

            <!-- Spot Check -->
            <a
                href="./pages/spotcheck/index.html"
                class="dashboard-card"
            >

                <img
                    src="./assets/icons/spotcheck.PNG"
                >

                <div class="dashboard-card-title">
                    Spot Check
                </div>

            </a>

        </div>

        <!-- Assistant -->
        <div class="assistant-box">

            <img
                src="./assets/images/robot.svg"
                class="assistant-icon"
            >

            <div class="assistant-text">

                សូមស្វាគមន៍ មកកាន់ប្រព័ន្ធតាមដានឥណទាន
                CM_Pro 🎉

            </div>

        </div>

    </div>

    <!-- Bottom Navigation -->
    <div id="bottomnav-container"></div>

    <!-- Component Loader -->
    <script>

        async function loadComponent(id, file){

            try{

                const response =
                    await fetch(file);

                const html =
                    await response.text();

                document
                    .getElementById(id)
                    .innerHTML = html;

                // =========================
                // AFTER TOPBAR LOAD
                // =========================

                if(id === "topbar-container"){

                    loadTopbarUser();

                }

            }catch(error){

                console.error(
                    "Component load error:",
                    error
                );

            }

        }

        // =========================
        // LOAD USER TO TOPBAR
        // =========================

        function loadTopbarUser(){

            try{

                const loggedInUser = JSON.parse(

                    localStorage.getItem(
                        "loggedInUser"
                    ) || "{}"

                );

                console.log(
                    "TOPBAR USER:",
                    loggedInUser
                );

                const fullname =

                    loggedInUser.fullname ||

                    loggedInUser.username ||

                    "User";

                const topbarName =
                    document.getElementById(
                        "topbarName"
                    );

                if(topbarName){

                    topbarName.innerText =
                        `សួស្តី, ${fullname}`;

                }

                // PROFILE IMAGE

                if(loggedInUser.image){

                    const profile =
                        document.getElementById(
                            "topbarProfile"
                        );

                    if(profile){

                        profile.src =
                            loggedInUser.image;

                    }

                }

            }catch(error){

                console.error(
                    "Topbar user error:",
                    error
                );

            }

        }

        // =========================
        // LOAD COMPONENTS
        // =========================

        loadComponent(
            "topbar-container",
            "./components/topbar.html"
        );

        loadComponent(
            "bottomnav-container",
            "./components/bottomnav.html"
        );

    </script>

</body>

</html>
