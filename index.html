<!DOCTYPE html>
<html>

<head>

    <title>CM_Pro</title>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="./assets/css/main.css"
    >

</head>

<body>

    <!-- Auth Guard -->
    <script src="./config/auth.js"></script>

    <!-- Logout Function -->
    <script>

        function logout(){

    const confirmLogout =
        confirm("Logout CM_Pro ?");

    if(confirmLogout){

        localStorage.clear();
        sessionStorage.clear();

        window.location.replace(
            "/login.html"
        );

    }

}
    </script>

    <!-- Topbar -->
    <div id="topbar-container"></div>

    <!-- Dashboard -->
    <div class="dashboard-container">

        <!-- Dashboard Grid -->
        <div class="dashboard-grid">

            <!-- Customer -->
            <a
                href="./pages/customers/index.html"
                class="dashboard-card"
            >

                <img
                    src="./assets/icons/customer.PNG"
                >

                <div class="dashboard-card-title">

                    Customer Search

                </div>

            </a>

            <!-- Arrears -->
            <a
                href="./pages/arrears/index.html"
                class="dashboard-card"
            >

                <img
                    src="./assets/icons/arrears.PNG"
                >

                <div class="dashboard-card-title">

                    Daily Arrears

                </div>

            </a>

            <!-- Turnover -->
            <a
                href="./pages/turnover/index.html"
                class="dashboard-card"
            >

                <img
                    src="./assets/icons/turnover.PNG"
                >

                <div class="dashboard-card-title">

                    Average Turnover

                </div>

            </a>

            <!-- Spot Check -->
            <a
                href="./pages/spotcheck/index.html"
                class="dashboard-card"
            >

                <img
                    src="./assets/icons/spotcheck.PNG"
                >

                <div class="dashboard-card-title">

                    Spot Check

                </div>

            </a>

        </div>

        <!-- Assistant Box -->
        <div class="assistant-box">

            <img
                src="./assets/images/robot.svg"
                class="assistant-icon"
            >

            <div class="assistant-text">

                សូមស្វាគមន៍ មកកាន់ប្រព័ន្ធតាមដានឥណទាន
                CM_Pro 🎉

            </div>

        </div>

    </div>

    <!-- Bottom Navigation -->
    <div id="bottomnav-container"></div>

    <!-- Component Loader -->
    <script>

        async function loadComponent(id, file){

            try{

                const response =
                    await fetch(file);

                const html =
                    await response.text();

                document
                    .getElementById(id)
                    .innerHTML = html;

            }catch(error){

                console.error(
                    "Component load error:",
                    error
                );

            }

        }

        loadComponent(
            "topbar-container",
            "./components/topbar.html"
        );

        loadComponent(
            "bottomnav-container",
            "./components/bottomnav.html"
        );

    </script>

</body>

</html>
