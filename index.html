<!-- DASHBOARD LOGIC -->
<!-- ========================= -->

<script src="./assets/js/dashboard.js"></script>

<script>
  // fullname is read automatically from the loggedInUser object in
  // storage (set at login, cleared by session.js's autoLogout).
  initAssistantBox();

  // The robot is inlined (not an <img>) specifically so it can be
  // driven from JS — see assets/js/robot-embed.js for why. Once the
  // greeting card has loaded, starts the continuous welcome loop
  // (waist -> welcome -> wave -> waist -> pause -> welcome again -> ...)
  // rather than a one-shot greet() that would only play once.
  embedCMProRobot(document.getElementById("assistantRobotSlot"), {
    src: "./assets/images/robot.svg",
  }).then((robot) => {
    if (!robot) return;
    robot.startWelcomeLoop();
    // Tapping the robot: a wave, then the chat.
    const slot = document.getElementById("assistantRobotSlot");
    slot.setAttribute("role", "button");
    slot.setAttribute("tabindex", "0");
    slot.setAttribute("aria-label", (window.CMI18n && CMI18n.t("assistant.openChat")) || "Chat with CM Pro AI");
    const tap = () => {
      Promise.resolve(robot.wave()).catch(() => {}).finally(() => robot.startWelcomeLoop());
      setTimeout(() => window.CMAssistantChat && CMAssistantChat.open(), 450);
    };
    slot.addEventListener("click", tap);
    // Back from the chat with an answer: a thumbs-up.
    document.addEventListener("cm-assistant-close", (e) => {
      if (!e.detail || !e.detail.answered) return;
      Promise.resolve(robot.thumbsUp()).catch(() => {}).finally(() => robot.startWelcomeLoop());
    });
    slot.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tap(); } });
  });
</script>
