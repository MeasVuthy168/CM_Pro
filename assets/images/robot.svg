<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -20 860 860" width="100%" height="100%">
    <defs>
        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f2f5f9"/>
            <stop offset="50%" stop-color="#d5dee9"/>
            <stop offset="100%" stop-color="#9aaec4"/>
        </linearGradient>
        <linearGradient id="darkMetal" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3a4454"/>
            <stop offset="50%" stop-color="#222831"/>
            <stop offset="100%" stop-color="#11141a"/>
        </linearGradient>
        <linearGradient id="accentGold" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffe066"/>
            <stop offset="100%" stop-color="#f59f00"/>
        </linearGradient>
        <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a5f3fc"/>
            <stop offset="100%" stop-color="#06b6d4"/>
        </linearGradient>
        <linearGradient id="speedLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
            <stop offset="80%" stop-color="#06b6d4" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#ffe066" stop-opacity="1"/>
        </linearGradient>
        <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#0a0e14" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#0a0e14" stop-opacity="0"/>
        </radialGradient>

        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="intenseGlow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="12" result="blur1"/>
            <feGaussianBlur stdDeviation="4" result="blur2"/>
            <feMerge>
                <feMergeNode in="blur1"/>
                <feMergeNode in="blur2"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- ground shadow for grounding -->
    <ellipse cx="410" cy="815" rx="230" ry="28" fill="url(#shadowGrad)"/>

    <g opacity="0.85">
        <path d="M 50 400 L 250 410 M 80 430 L 220 435 M 40 370 L 190 380" stroke="url(#speedLineGrad)" stroke-width="4" stroke-linecap="round"/>
        <path d="M 100 200 Q 200 180 300 220" fill="none" stroke="url(#cyanGlow)" stroke-width="3" stroke-dasharray="10 15" stroke-linecap="round"/>
        <path d="M 150 600 Q 250 630 400 580" fill="none" stroke="url(#cyanGlow)" stroke-width="2" stroke-dasharray="5 10"/>

        <circle cx="280" cy="180" r="4" fill="#a5f3fc" filter="url(#glow)"/>
        <circle cx="220" cy="250" r="6" fill="#ffe066" filter="url(#glow)"/>
        <circle cx="190" cy="520" r="5" fill="#06b6d4" filter="url(#glow)"/>
        <polygon points="650,150 660,170 640,165" fill="#ffe066" opacity="0.7"/>
        <polygon points="700,280 708,295 695,292" fill="#a5f3fc" opacity="0.6"/>

        <path d="M 580 160 C 660 180 720 250 710 330 C 700 390 640 430 590 440" fill="none" stroke="url(#cyanGlow)" stroke-width="6" stroke-linecap="round" filter="url(#intenseGlow)" stroke-dasharray="300" stroke-dashoffset="50"/>
    </g>

    <g transform="translate(40, 20)">

        <g id="left-leg">
            <circle cx="310" cy="520" r="22" fill="url(#darkMetal)"/>
            <circle cx="310" cy="520" r="12" fill="url(#cyanGlow)" filter="url(#glow)"/>
            <path d="M 295 535 L 270 640 L 315 640 L 325 535 Z" fill="url(#bodyGrad)" stroke="#78909c" stroke-width="2"/>
            <path d="M 285 545 L 268 630 L 285 630 Z" fill="#fff" opacity="0.6"/>
            <circle cx="292" cy="650" r="18" fill="url(#darkMetal)"/>
            <circle cx="292" cy="650" r="8" fill="#ffe066"/>
            <path d="M 275 660 L 250 750 L 310 750 L 310 660 Z" fill="url(#bodyGrad)" stroke="#78909c" stroke-width="2"/>
            <path d="M 240 740 L 260 720 L 300 720 L 315 740 Z" fill="url(#darkMetal)"/>
            <path d="M 245 750 L 210 780 L 315 780 L 310 750 Z" fill="url(#darkMetal)"/>
            <path d="M 215 775 L 235 755 L 270 755 L 260 775 Z" fill="url(#cyanGlow)" opacity="0.8"/>
        </g>

        <g id="right-leg">
            <circle cx="430" cy="520" r="22" fill="url(#darkMetal)"/>
            <circle cx="430" cy="520" r="12" fill="url(#cyanGlow)" filter="url(#glow)"/>
            <path d="M 408 538 L 430 645 L 468 640 L 452 538 Z" fill="url(#bodyGrad)" stroke="#78909c" stroke-width="2"/>
            <path d="M 415 548 L 432 636 L 448 634 L 435 546 Z" fill="#fff" opacity="0.4"/>
            <circle cx="449" cy="643" r="18" fill="url(#darkMetal)"/>
            <circle cx="449" cy="643" r="8" fill="#ffe066"/>
            <path d="M 430 650 L 455 760 L 500 755 L 468 650 Z" fill="url(#bodyGrad)" stroke="#78909c" stroke-width="2"/>
            <path d="M 449 762 L 470 748 L 500 752 L 486 768 Z" fill="url(#darkMetal)"/>
            <path d="M 455 765 L 500 795 L 560 785 L 500 752 Z" fill="url(#darkMetal)"/>
            <path d="M 505 775 L 545 765 L 552 778 L 512 788 Z" fill="url(#accentGold)"/>
        </g>

        <g id="left-arm">
            <circle cx="260" cy="330" r="26" fill="url(#darkMetal)"/>
            <circle cx="260" cy="330" r="14" fill="url(#cyanGlow)" filter="url(#glow)"/>
            <path d="M 240 340 L 170 390 L 195 420 L 255 355 Z" fill="url(#bodyGrad)" stroke="#78909c" stroke-width="2"/>
            <circle cx="185" cy="405" r="16" fill="url(#darkMetal)"/>
            <path d="M 175 415 L 120 490 L 155 510 L 200 425 Z" fill="url(#bodyGrad)" stroke="#78909c" stroke-width="2"/>
            <circle cx="130" cy="505" r="18" fill="url(#darkMetal)"/>
            <path d="M 115 495 Q 95 500 110 520 Q 130 530 140 515 Z" fill="url(#darkMetal)"/>
        </g>

        <g id="torso">
            <path d="M 300 460 L 440 460 L 460 510 L 280 510 Z" fill="url(#darkMetal)" stroke="#2c3e50" stroke-width="2"/>
            <path d="M 320 470 L 420 470 L 430 495 L 310 495 Z" fill="#1e293b"/>
            <rect x="350" y="445" width="40" height="45" rx="6" fill="url(#cyanGlow)" filter="url(#glow)"/>
            <path d="M 270 320 L 470 320 L 450 460 L 290 460 Z" fill="url(#bodyGrad)" stroke="#78909c" stroke-width="3"/>
            <path d="M 275 330 L 310 330 L 310 450 L 295 450 Z" fill="#9aaec4" opacity="0.5"/>
            <path d="M 465 330 L 430 330 L 430 450 L 445 450 Z" fill="#9aaec4" opacity="0.5"/>

            <rect x="312" y="335" width="116" height="96" rx="48" fill="url(#darkMetal)" stroke="url(#accentGold)" stroke-width="3" filter="url(#glow)"/>

            <g id="logo-text">
                <rect x="318" y="341" width="104" height="84" rx="42" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="6 4"/>
                <text x="370" y="380" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="3">CM PRO</text>
                <text x="370" y="402" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#ffe066" text-anchor="middle" letter-spacing="1">AUTOMATION</text>
                <circle cx="370" cy="353" r="3" fill="#06b6d4" filter="url(#glow)"/>
                <path d="M 340 388 L 348 388 M 392 388 L 400 388" stroke="#ffe066" stroke-width="2"/>
            </g>

            <path d="M 320 300 L 420 300 L 440 320 L 300 320 Z" fill="url(#darkMetal)"/>
            <rect x="355" y="270" width="30" height="35" fill="url(#darkMetal)"/>
            <rect x="365" y="270" width="10" height="35" fill="url(#cyanGlow)"/>
        </g>

        <g id="head" transform="translate(370, 260) rotate(8)">
            <path d="M -50 -70 L -70 -110" stroke="url(#darkMetal)" stroke-width="6" stroke-linecap="round"/>
            <circle cx="-70" cy="-110" r="8" fill="url(#accentGold)" filter="url(#glow)"/>
            <path d="M 50 -70 L 80 -120" stroke="url(#darkMetal)" stroke-width="6" stroke-linecap="round"/>
            <circle cx="80" cy="-120" r="10" fill="url(#cyanGlow)" filter="url(#intenseGlow)"/>
            <rect x="-95" y="-40" width="15" height="50" rx="5" fill="url(#darkMetal)"/>
            <rect x="80" y="-40" width="15" height="50" rx="5" fill="url(#darkMetal)"/>
            <rect x="-85" y="-85" width="170" height="135" rx="40" fill="url(#bodyGrad)" stroke="#78909c" stroke-width="3"/>
            <path d="M -60 -75 Q 0 -85 60 -75 L 50 -60 Q 0 -70 -50 -60 Z" fill="#fff" opacity="0.5"/>
            <rect x="-70" y="-65" width="140" height="95" rx="25" fill="#1e293b" stroke="#475569" stroke-width="2"/>
            <rect x="-65" y="-60" width="130" height="85" rx="20" fill="#0b0f19"/>
            <path d="M -45 -20 Q -30 -40 -15 -20" fill="none" stroke="url(#cyanGlow)" stroke-width="10" stroke-linecap="round" filter="url(#intenseGlow)"/>
            <circle cx="30" cy="-22" r="16" fill="none" stroke="url(#cyanGlow)" stroke-width="8" filter="url(#intenseGlow)"/>
            <circle cx="30" cy="-22" r="6" fill="url(#accentGold)"/>
            <circle cx="-50" cy="12" r="4" fill="#4ade80" filter="url(#glow)"/>
            <path d="M -55 -5 L -40 5 M 55 -5 L 40 5" stroke="#334155" stroke-width="2"/>
        </g>

        <g id="right-arm-welcome">
            <circle cx="480" cy="340" r="26" fill="url(#darkMetal)"/>
            <circle cx="480" cy="340" r="14" fill="url(#cyanGlow)" filter="url(#glow)"/>
            <path d="M 495 325 L 580 250 L 605 275 L 515 355 Z" fill="url(#bodyGrad)" stroke="#78909c" stroke-width="2"/>
            <path d="M 508 332 L 575 265 L 585 275 L 520 345 Z" fill="#fff" opacity="0.4"/>
            <circle cx="590" cy="260" r="18" fill="url(#darkMetal)"/>
            <circle cx="590" cy="260" r="10" fill="url(#accentGold)" filter="url(#glow)"/>
            <path d="M 605 250 L 690 170 L 720 198 L 625 275 Z" fill="url(#bodyGrad)" stroke="#78909c" stroke-width="2"/>
            <rect x="695" y="165" width="22" height="28" rx="4" transform="rotate(-25 695 165)" fill="url(#darkMetal)"/>

            <g transform="translate(710, 160) rotate(-15)">
                <path d="M 0 0 C 15 -15 35 -5 30 15 C 25 25 10 25 0 10 Z" fill="url(#darkMetal)"/>
                <circle cx="15" cy="5" r="10" fill="url(#cyanGlow)" filter="url(#intenseGlow)"/>
                <path d="M -2 -2 Q -15 -10 -22 2 Q -15 10 2 6" fill="url(#darkMetal)"/>
                <path d="M 12 -10 Q 20 -35 32 -30 Q 35 -15 22 0" fill="url(#darkMetal)"/>
                <path d="M 22 -5 Q 38 -28 46 -20 Q 40 -2 28 8" fill="url(#darkMetal)"/>
                <path d="M 28 5 Q 45 -12 50 -3 Q 42 12 30 15" fill="url(#darkMetal)"/>
                <path d="M 28 15 Q 42 5 44 14 Q 35 26 24 20" fill="url(#darkMetal)"/>
                <circle cx="35" cy="-35" r="3" fill="#ffe066" filter="url(#glow)"/>
                <circle cx="52" cy="-25" r="2" fill="#a5f3fc"/>
                <circle cx="56" cy="-5" r="3" fill="#ffe066" filter="url(#glow)"/>
            </g>
        </g>
    </g>
</svg>
