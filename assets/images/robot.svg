<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">

<style>

:root{
    --brand-gold:#D4AF37;
    --brand-navy:#003B8B;
    --brand-dark:#0C1B3A;
}

/* =========================
   Simple flat/idle-icon style, three lightweight animations
   instead of the previous full-rig dance: a gentle float bob on
   the whole body, a small back-and-forth wiggle on the raised
   hand, and an occasional blink. transform-origin is in viewBox
   units (SVG's default transform-box is the view-box), so each
   value below is a literal coordinate in this 200x220 canvas.
========================= */

.anim-float{
    animation:float-body 2.6s ease-in-out infinite;
}

@keyframes float-body{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-6px); }
}

.anim-wave{
    animation:wave-hand 1.3s ease-in-out infinite;
    transform-origin:0 0;
}

@keyframes wave-hand{
    0%,100%{ transform:rotate(0deg); }
    50%{ transform:rotate(22deg); }
}

.anim-eyes{
    animation:blink-eyes 4s ease-in-out infinite;
    transform-origin:100px 56px;
}

@keyframes blink-eyes{
    0%,88%,100%{ transform:scaleY(1); }
    92%{ transform:scaleY(0.15); }
}

</style>

<!-- floor shadow -->
<ellipse cx="100" cy="206" rx="44" ry="8" fill="var(--brand-navy)" opacity="0.15"/>

<g class="anim-float">

<!-- legs / feet -->
<rect x="78" y="166" width="16" height="26" rx="6" fill="var(--brand-dark)"/>
<rect x="106" y="166" width="16" height="26" rx="6" fill="var(--brand-dark)"/>
<rect x="72" y="188" width="26" height="10" rx="5" fill="var(--brand-gold)"/>
<rect x="102" y="188" width="26" height="10" rx="5" fill="var(--brand-gold)"/>

<!-- body -->
<rect x="58" y="98" width="84" height="72" rx="20" fill="#FFFFFF" stroke="var(--brand-navy)" stroke-width="4"/>

<!-- chest emblem -->
<circle cx="100" cy="130" r="15" fill="var(--brand-gold)"/>
<text x="100" y="135" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="var(--brand-navy)" text-anchor="middle">CM</text>

<!-- left arm (static, resting) -->
<rect x="38" y="110" width="18" height="46" rx="9" fill="var(--brand-navy)"/>
<circle cx="47" cy="158" r="11" fill="var(--brand-gold)"/>

<!-- right arm (raised, gently waving) -->
<g transform="translate(144 108) rotate(-35)">
<g class="anim-wave">
<rect x="-9" y="-9" width="18" height="46" rx="9" fill="var(--brand-navy)"/>
<circle cx="0" cy="46" r="11" fill="var(--brand-gold)"/>
</g>
</g>

<!-- neck -->
<rect x="92" y="84" width="16" height="16" fill="var(--brand-dark)"/>

<!-- head -->
<rect x="58" y="18" width="84" height="68" rx="24" fill="#FFFFFF" stroke="var(--brand-navy)" stroke-width="4"/>

<!-- antenna -->
<rect x="97" y="2" width="6" height="18" fill="var(--brand-dark)"/>
<circle cx="100" cy="4" r="7" fill="var(--brand-gold)"/>

<!-- eyes -->
<g class="anim-eyes">
<rect x="76" y="44" width="16" height="20" rx="8" fill="var(--brand-navy)"/>
<rect x="108" y="44" width="16" height="20" rx="8" fill="var(--brand-navy)"/>
</g>

<!-- smile -->
<path d="M84 74 Q100 84 116 74" stroke="var(--brand-navy)" stroke-width="4" fill="none" stroke-linecap="round"/>

</g>

</svg>
