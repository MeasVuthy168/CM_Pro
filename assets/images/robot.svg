<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" width="500" height="620">

  <!-- =====================================================================
       CM_Pro ROBOT MASCOT — humanoid "field robot" redesign
       =====================================================================
       Redesigned to read as a real segmented humanoid robot (white/silver
       plated shell over dark metal joints, black gloves/boots, a
       blue-glass visor helmet) standing in a relaxed idle pose, rather
       than the earlier business-suit character. Brand tie-in is kept
       intentionally subtle now — a faint engraved "CM PRO" wordmark on
       the chest plate and a thin gold ring around the neck status light
       — the same understated way a real product robot would carry a
       manufacturer mark, instead of a bright applied logo patch.

       QUICK EDIT GUIDE:
       MATERIALS    -> <defs> below. bodyGrad = white/silver shell plates,
                        jointGrad = dark metal joints/waist/neck,
                        blackLimbs = gloves + boots, visorGrad = the
                        blue-glass face visor, statusGlow = the small
                        cyan "power on" neck light halo.
       HEAD/VISOR   -> search "HEAD" — helmet shell + tinted visor +
                        pale mouth-vent cutout.
       TORSO        -> search "TORSO" — chest shell + engraved wordmark.
       HIP/WAIST    -> search "WAIST JOINT" / "HIP" — the dark rotating
                        waist collar and the two white hip pivot disks.
       ARMS         -> search "LEFT ARM" (idle sway only, stays resting
                        at the side) / "RIGHT ARM" (the one that
                        periodically raises to wave, then returns to
                        resting at the side like the reference photo).
       LEGS         -> search "LEFT LEG" / "RIGHT LEG".
       ACTIONS      -> every @keyframes is named after what it moves.
                        The rest pose (arms hanging straight at the
                        sides) matches the reference photo; the wave is
                        a periodic gesture layered on top, not a
                        constant animation, so it reads as an occasional
                        greeting rather than nonstop waving.

       NO RASTER FILTERS: deliberately no <feGaussianBlur>/<feDropShadow>
       and no filter:drop-shadow()/filter:blur() anywhere, even though a
       soft filtered glow would look nice on the visor/status light.
       Applying a filter to an SVG element forces the renderer to
       rasterize that element into an offscreen bitmap sized for the
       small ~100px on-screen icon — with body parts wrapped in filters,
       the whole character effectively becomes one fixed-resolution
       bitmap that iOS Safari just scales (not re-rasterizes) on
       pinch-zoom, which is what made an earlier version look soft/
       blurry when zoomed in. Every glow/halo here is instead a plain
       radial-gradient shape fading to transparent (see visorHalo,
       statusGlow) — real vector fills, crisp at any zoom level. -->

  <defs>

    <!-- ============ MATERIAL GRADIENTS ============ -->

    <!-- Helmet shell — cool white/silver plastic-composite look -->
    <radialGradient id="headShellGrad" cx="38%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e2e5ea"/>
      <stop offset="100%" stop-color="#b7bcc4"/>
    </radialGradient>

    <!-- Body shell plates — arms/torso/legs. Cooler + slightly bluer
         than a warm "skin" gray, to read as painted composite armor. -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbfcfe"/>
      <stop offset="42%" stop-color="#e4e7ec"/>
      <stop offset="78%" stop-color="#c3c8d0"/>
      <stop offset="100%" stop-color="#98a0ab"/>
    </linearGradient>

    <!-- Dark metal joints — shoulders/elbows/knees/neck/waist -->
    <linearGradient id="jointGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#565b64"/>
      <stop offset="50%" stop-color="#2f333b"/>
      <stop offset="100%" stop-color="#151719"/>
    </linearGradient>

    <!-- Blue-glass face visor -->
    <linearGradient id="visorGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#a9e6f2"/>
      <stop offset="35%" stop-color="#4fb8d8"/>
      <stop offset="75%" stop-color="#1f6fa8"/>
      <stop offset="100%" stop-color="#0e3f68"/>
    </linearGradient>

    <!-- Soft glow behind the visor — a gradient halo, not a blur filter -->
    <radialGradient id="visorHalo" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7fd8ef" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#7fd8ef" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7fd8ef" stop-opacity="0"/>
    </radialGradient>

    <!-- Black material — gloves + boots -->
    <linearGradient id="blackLimbs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#43454a"/>
      <stop offset="30%" stop-color="#202226"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>

    <!-- Small cyan "power on" status light + its halo -->
    <radialGradient id="statusCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eafeff"/>
      <stop offset="60%" stop-color="#4fd8ec"/>
      <stop offset="100%" stop-color="#1c9cbf"/>
    </radialGradient>
    <radialGradient id="statusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fd8ec" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#4fd8ec" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4fd8ec" stop-opacity="0"/>
    </radialGradient>

    <style>

      /* ============ ANIMATION KEYFRAMES ============
         None of these animate `filter` — see the NO RASTER FILTERS
         note above for why that matters on iOS. */

      @keyframes float-body {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes idle-head-look {
        /* A wandering look-around rather than a metronomic tilt. */
        0%, 100% { transform: rotate(-5deg); }
        30%      { transform: rotate(3deg); }
        60%      { transform: rotate(6deg); }
        80%      { transform: rotate(-2deg); }
      }
      @keyframes visor-blink {
        /* Brief brightness dip standing in for an eye-blink, since the
           face is one glass visor rather than a pair of eyes. */
        0%, 90%, 100% { opacity: 1; }
        94% { opacity: 0.5; }
        97% { opacity: 1; }
      }
      @keyframes neck-status-pulse {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.2); }
      }
      @keyframes right-arm-greet-cycle {
        /* Rests hanging at the side (matching the reference pose) for
           most of the cycle, then swings up to wave, then returns. */
        0%, 55%  { transform: rotate(0deg); }
        66%      { transform: rotate(-150deg); }
        84%      { transform: rotate(-150deg); }
        100%     { transform: rotate(0deg); }
      }
      @keyframes right-forearm-wag-cycle {
        /* Stays straight (following the upper arm) while resting, then
           bends/wags at the elbow only during the wave window. */
        0%, 60%  { transform: rotate(0deg); }
        66%      { transform: rotate(-30deg); }
        71%      { transform: rotate(-8deg); }
        76%      { transform: rotate(-32deg); }
        81%      { transform: rotate(-8deg); }
        86%      { transform: rotate(-25deg); }
        92%, 100% { transform: rotate(0deg); }
      }
      @keyframes right-hand-flutter-cycle {
        0%, 62%  { transform: rotate(0deg); }
        68%      { transform: rotate(16deg); }
        74%      { transform: rotate(-12deg); }
        80%      { transform: rotate(16deg); }
        88%, 100% { transform: rotate(0deg); }
      }
      @keyframes idle-arm-sway {
        /* Continuous small idle sway for the resting (non-waving) arm. */
        0%, 100% { transform: rotate(0deg); }
        25%      { transform: rotate(-3deg); }
        50%      { transform: rotate(1deg); }
        75%      { transform: rotate(-2deg); }
      }
      @keyframes idle-hand-flex {
        0%, 100% { transform: rotate(0deg) scale(1); }
        50%      { transform: rotate(6deg) scale(1.05); }
      }
      @keyframes idle-foot-rock {
        0%, 100% { transform: rotate(0deg); }
        50%      { transform: rotate(3deg); }
      }
      @keyframes floor-shadow {
        0%, 100% { transform: scale(1); opacity: 0.3; }
        50%      { transform: scale(0.95); opacity: 0.23; }
      }

      /* ============ ANIMATION ASSIGNMENTS ============
         transform-origin values match each part's actual joint/pivot
         point in the markup below — if you move a part, update the
         matching transform-origin here too. */

      .anim-body { animation: float-body 4s ease-in-out infinite; transform-origin: 250px 605px; }
      .anim-head { animation: idle-head-look 5.5s ease-in-out infinite; transform-origin: 250px 168px; }
      .anim-visor { animation: visor-blink 4.5s ease-in-out infinite; }
      .anim-neck-status { animation: neck-status-pulse 2.4s ease-in-out infinite; transform-origin: center; }

      .anim-right-arm { animation: right-arm-greet-cycle 7s ease-in-out infinite; transform-origin: 322px 200px; }
      .anim-right-forearm { animation: right-forearm-wag-cycle 7s ease-in-out infinite; transform-origin: 322px 292px; }
      .anim-right-hand { animation: right-hand-flutter-cycle 7s ease-in-out infinite; transform-origin: 322px 374px; }

      .anim-left-arm { animation: idle-arm-sway 3.4s ease-in-out infinite; transform-origin: 178px 200px; }
      .anim-left-hand { animation: idle-hand-flex 2.2s ease-in-out infinite; transform-origin: 178px 396px; }
      .anim-right-hand-flex { animation: idle-hand-flex 2.4s ease-in-out infinite 0.4s; transform-origin: 322px 396px; }

      .anim-foot-left { animation: idle-foot-rock 2.8s ease-in-out infinite; transform-origin: 225px 562px; }
      .anim-foot-right { animation: idle-foot-rock 2.8s ease-in-out infinite 1.4s; transform-origin: 275px 562px; }

      .anim-shadow { animation: floor-shadow 4s ease-in-out infinite; transform-origin: 250px 605px; }
    </style>
  </defs>

  <!-- Ground contact shadow -->
  <ellipse class="anim-shadow" cx="250" cy="605" rx="92" ry="14" fill="#000000" opacity="0.3"/>

  <g id="robot-full-body">

    <!-- Everything below is inside .anim-body, including the legs — the
         whole character floats as one rigid unit. -->
    <g class="anim-body">

      <!-- ============ LEFT LEG ============ -->
      <g id="left-leg">
        <rect x="205" y="352" width="40" height="112" rx="18" fill="url(#bodyGrad)"/>
        <rect x="212" y="360" width="8" height="88" rx="4" fill="#ffffff" opacity="0.32"/>
        <circle cx="225" cy="464" r="17" fill="url(#jointGrad)"/>
        <rect x="207" y="474" width="36" height="92" rx="16" fill="url(#bodyGrad)"/>
        <rect x="213" y="480" width="7" height="76" rx="3.5" fill="#ffffff" opacity="0.32"/>
        <circle cx="225" cy="562" r="14" fill="url(#jointGrad)"/>
        <g id="left-foot" class="anim-foot-left">
          <rect x="196" y="560" width="62" height="40" rx="15" fill="url(#blackLimbs)"/>
          <rect x="210" y="566" width="30" height="7" rx="3.5" fill="#7a7f88" opacity="0.55"/>
          <rect x="191" y="598" width="72" height="15" rx="7.5" fill="#141416"/>
          <rect x="191" y="598" width="72" height="5" rx="2.5" fill="#ffffff" opacity="0.28"/>
          <ellipse cx="225" cy="574" rx="22" ry="6" fill="#ffffff" opacity="0.12"/>
        </g>
      </g>

      <!-- ============ RIGHT LEG ============ -->
      <g id="right-leg">
        <rect x="255" y="352" width="40" height="112" rx="18" fill="url(#bodyGrad)"/>
        <rect x="280" y="360" width="8" height="88" rx="4" fill="#ffffff" opacity="0.32"/>
        <circle cx="275" cy="464" r="17" fill="url(#jointGrad)"/>
        <rect x="257" y="474" width="36" height="92" rx="16" fill="url(#bodyGrad)"/>
        <rect x="280" y="480" width="7" height="76" rx="3.5" fill="#ffffff" opacity="0.32"/>
        <circle cx="275" cy="562" r="14" fill="url(#jointGrad)"/>
        <g id="right-foot" class="anim-foot-right">
          <rect x="242" y="560" width="62" height="40" rx="15" fill="url(#blackLimbs)"/>
          <rect x="260" y="566" width="30" height="7" rx="3.5" fill="#7a7f88" opacity="0.55"/>
          <rect x="237" y="598" width="72" height="15" rx="7.5" fill="#141416"/>
          <rect x="237" y="598" width="72" height="5" rx="2.5" fill="#ffffff" opacity="0.28"/>
          <ellipse cx="275" cy="574" rx="22" ry="6" fill="#ffffff" opacity="0.12"/>
        </g>
      </g>

      <!-- ============ HIP ============
           Dark separator band across the hips with two white pivot
           disks, like the reference photo's hip yoke. Drawn after the
           legs so it cleanly bridges the torso down to both thigh
           tops — keep it wide enough to reach x=198..302 or a gap will
           reappear between the waist and the legs. -->
      <g id="hip">
        <rect x="198" y="312" width="104" height="42" rx="13" fill="url(#jointGrad)"/>
        <circle cx="206" cy="333" r="10" fill="url(#bodyGrad)"/>
        <circle cx="206" cy="333" r="4" fill="url(#jointGrad)"/>
        <circle cx="294" cy="333" r="10" fill="url(#bodyGrad)"/>
        <circle cx="294" cy="333" r="4" fill="url(#jointGrad)"/>
      </g>

      <!-- ============ LEFT ARM (idle sway, rests at the side) ============ -->
      <g id="left-arm" class="anim-left-arm">
        <circle cx="178" cy="200" r="17" fill="url(#jointGrad)"/>
        <rect x="163" y="200" width="30" height="92" rx="15" fill="url(#bodyGrad)"/>
        <rect x="168" y="208" width="6" height="72" rx="3" fill="#ffffff" opacity="0.3"/>
        <circle cx="178" cy="292" r="13" fill="url(#jointGrad)"/>
        <rect x="165" y="292" width="26" height="82" rx="13" fill="url(#bodyGrad)"/>
        <circle cx="178" cy="374" r="12" fill="url(#jointGrad)"/>
        <g id="left-hand" class="anim-left-hand">
          <circle cx="178" cy="397" r="20" fill="url(#blackLimbs)"/>
          <ellipse cx="159" cy="392" rx="8" ry="11" fill="url(#blackLimbs)" transform="rotate(-24 159 392)"/>
          <circle cx="172" cy="390" r="4" fill="#ffffff" opacity="0.25"/>
        </g>
      </g>

      <!-- ============ TORSO ============
           Plain armor shell (no shirt/jacket) with a faint engraved
           wordmark, the way a real product robot carries its
           manufacturer's mark. -->
      <g id="torso">
        <rect x="184" y="176" width="132" height="122" rx="36" fill="url(#bodyGrad)"/>
        <ellipse cx="220" cy="200" rx="30" ry="16" fill="#ffffff" opacity="0.3"/>
        <!-- 3D touch: shadow crescent opposite the highlight -->
        <path d="M 196 278 Q 250 300 304 278 L 300 294 Q 250 312 200 294 Z" fill="#000000" opacity="0.1"/>
        <!-- center seam -->
        <path d="M 250 188 L 250 286" stroke="#ffffff" stroke-width="1.5" opacity="0.12"/>
        <!-- engraved "CM PRO" wordmark — subtle pressed-in look via a
             lighter offset above and a darker offset below the main
             fill, no bright colored patch. -->
        <text x="250" y="230" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" fill-opacity="0.55" text-anchor="middle" letter-spacing="2">CM PRO</text>
        <text x="250" y="232.5" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" fill="#5b6068" fill-opacity="0.4" text-anchor="middle" letter-spacing="2">CM PRO</text>
      </g>

      <!-- ============ WAIST JOINT ============
           Dark rotating collar bridging the chest shell down to the
           hip — visible in the reference just below the torso. -->
      <g id="waist-joint">
        <rect x="228" y="294" width="44" height="24" rx="9" fill="url(#jointGrad)"/>
        <rect x="236" y="299" width="28" height="3" rx="1.5" fill="#0b0c0e" opacity="0.6"/>
        <rect x="236" y="306" width="28" height="3" rx="1.5" fill="#0b0c0e" opacity="0.6"/>
      </g>

      <!-- ============ NECK ============ -->
      <g id="neck">
        <rect x="234" y="150" width="32" height="30" rx="7" fill="url(#jointGrad)"/>
        <rect x="241" y="157" width="18" height="2.5" rx="1.25" fill="#0b0c0e" opacity="0.6"/>
        <rect x="241" y="164" width="18" height="2.5" rx="1.25" fill="#0b0c0e" opacity="0.6"/>
        <rect x="241" y="171" width="18" height="2.5" rx="1.25" fill="#0b0c0e" opacity="0.6"/>
        <!-- small "power on" status light, thin gold ring for the one
             remaining brand accent -->
        <circle cx="222" cy="165" r="8" fill="url(#statusGlow)"/>
        <circle class="anim-neck-status" cx="222" cy="165" r="4" fill="url(#statusCore)"/>
        <circle cx="222" cy="165" r="4.8" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.8"/>
      </g>

      <!-- ============ HEAD ============ -->
      <g class="anim-head">
        <rect x="194" y="34" width="112" height="124" rx="44" fill="url(#headShellGrad)"/>
        <!-- top gloss -->
        <ellipse cx="222" cy="54" rx="34" ry="16" fill="#ffffff" opacity="0.4"/>
        <!-- chin shadow crescent -->
        <path d="M 202 148 Q 250 162 298 148 L 298 156 Q 250 170 202 156 Z" fill="#000000" opacity="0.1"/>

        <!-- visor -->
        <g class="anim-visor">
          <circle cx="250" cy="90" r="58" fill="url(#visorHalo)"/>
          <rect x="204" y="50" width="92" height="80" rx="32" fill="url(#visorGrad)"/>
          <!-- glossy diagonal streak -->
          <path d="M 214 66 L 252 98" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.22"/>
          <!-- pale mouth-vent cutout -->
          <rect x="231" y="114" width="38" height="15" rx="7.5" fill="#eef3f6" opacity="0.92"/>
          <rect x="231" y="114" width="38" height="15" rx="7.5" fill="none" stroke="#9aa1ab" stroke-width="1" opacity="0.4"/>
        </g>

        <!-- forehead sensor -->
        <circle cx="250" cy="44" r="3" fill="#4fd8ec"/>
      </g>

      <!-- ============ RIGHT ARM (periodic wave, rests at the side) ============
           Mirrors the left arm's geometry at rest — .anim-right-arm
           rotates the whole arm about the shoulder, .anim-right-forearm
           bends the elbow, .anim-right-hand flutters the wrist, all
           nested so a shoulder rotation carries the rest with it. -->
      <g id="right-arm" class="anim-right-arm">
        <circle cx="322" cy="200" r="17" fill="url(#jointGrad)"/>
        <rect x="307" y="200" width="30" height="92" rx="15" fill="url(#bodyGrad)"/>
        <rect x="326" y="208" width="6" height="72" rx="3" fill="#ffffff" opacity="0.3"/>
        <circle cx="322" cy="292" r="13" fill="url(#jointGrad)"/>
        <g id="right-forearm" class="anim-right-forearm">
          <rect x="309" y="292" width="26" height="82" rx="13" fill="url(#bodyGrad)"/>
          <circle cx="322" cy="374" r="12" fill="url(#jointGrad)"/>
          <g id="right-hand" class="anim-right-hand">
            <g class="anim-right-hand-flex">
              <circle cx="322" cy="397" r="20" fill="url(#blackLimbs)"/>
              <ellipse cx="341" cy="392" rx="8" ry="11" fill="url(#blackLimbs)" transform="rotate(24 341 392)"/>
              <circle cx="328" cy="390" r="4" fill="#ffffff" opacity="0.25"/>
            </g>
          </g>
        </g>
      </g>

    </g>
  </g>
</svg>
