<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <radialGradient id="headGlow" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#dedede"/>
      <stop offset="100%" stop-color="#b5b5b5"/>
    </radialGradient>
    
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e6e6e6"/>
      <stop offset="80%" stop-color="#cccccc"/>
      <stop offset="100%" stop-color="#a3a3a3"/>
    </linearGradient>

    <radialGradient id="screenGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="85%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    
    <linearGradient id="jointGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b0b0b5"/>
      <stop offset="50%" stop-color="#787880"/>
      <stop offset="100%" stop-color="#48484a"/>
    </linearGradient>

    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="70%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#cc9900"/>
    </radialGradient>

    <linearGradient id="blackLimbs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444444"/>
      <stop offset="30%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    
    <radialGradient id="emblemGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes float-body {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes tilt-head {
        0%, 100% { transform: rotate(7deg); }
        50% { transform: rotate(3deg) translateY(-1px); }
      }
      @keyframes wave-hand {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-22deg); }
      }
      @keyframes pulse-eyes {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(255,204,0,0.6)); }
        50% { transform: scale(1.04); filter: drop-shadow(0 0 6px rgba(255,204,0,0.9)); }
      }
      @keyframes floor-shadow {
        0%, 100% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(0.95); opacity: 0.23; }
      }

      .anim-body {
        animation: float-body 4s ease-in-out infinite;
        transform-origin: 250px 420px;
      }
      .anim-head {
        animation: tilt-head 4s ease-in-out infinite;
        transform-origin: 250px 185px;
      }
      .anim-wave {
        animation: wave-hand 1.8s ease-in-out infinite;
        transform-origin: 185px 210px;
      }
      .anim-eye {
        animation: pulse-eyes 2s ease-in-out infinite;
        transform-origin: center;
      }
      .anim-shadow {
        animation: floor-shadow 4s ease-in-out infinite;
        transform-origin: 250px 530px;
      }
    </style>
  </defs>

  <ellipse class="anim-shadow" cx="250" cy="530" rx="90" ry="14" fill="#000000" opacity="0.3"/>

  <g id="robot-full-body">
    
    <g id="legs-group">
      <g filter="url(#shadow)">
        <rect x="180" y="320" width="30" height="130" rx="15" fill="url(#blackLimbs)"/>
        <rect x="175" y="390" width="40" height="70" rx="20" fill="url(#bodyGrad)"/>
        <rect x="150" y="485" width="70" height="45" rx="20" fill="url(#blackLimbs)"/>
        <ellipse cx="185" cy="495" rx="25" ry="8" fill="#ffffff" opacity="0.2"/>
      </g>

      <g filter="url(#shadow)">
        <rect x="290" y="320" width="30" height="130" rx="15" fill="url(#blackLimbs)"/>
        <rect x="285" y="390" width="40" height="70" rx="20" fill="url(#bodyGrad)"/>
        <rect x="280" y="485" width="70" height="45" rx="20" fill="url(#blackLimbs)"/>
        <ellipse cx="315" cy="495" rx="25" ry="8" fill="#ffffff" opacity="0.2"/>
      </g>
    </g>

    <g class="anim-body">
      
      <g filter="url(#shadow)">
        <rect x="210" y="325" width="80" height="40" rx="18" fill="url(#bodyGrad)"/>
        <rect x="230" y="310" width="40" height="25" rx="6" fill="url(#blackLimbs)"/>
      </g>

      <g id="left-arm-hip" filter="url(#shadow)">
        <circle cx="315" cy="210" r="16" fill="url(#jointGrad)"/>
        <path d="M 320 215 Q 360 240 330 290" fill="none" stroke="url(#blackLimbs)" stroke-width="20" stroke-linecap="round"/>
        <path d="M 330 290 L 310 310" fill="none" stroke="url(#bodyGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="330" cy="290" r="11" fill="url(#jointGrad)"/>
        <circle cx="305" cy="312" r="15" fill="url(#blackLimbs)"/>
      </g>

      <g filter="url(#shadow)">
        <circle cx="250" cy="240" r="52" fill="url(#bodyGrad)"/>
        <ellipse cx="235" cy="210" rx="25" ry="15" fill="#ffffff" opacity="0.4"/>
      </g>
      
      <g id="cmpro-emblem" filter="url(#shadow)">
        <circle cx="250" cy="240" r="32" fill="url(#emblemGrad)"/>
        <circle cx="250" cy="240" r="30" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
        <text x="250" y="236" 
              font-family="'Arial Black', 'Impact', sans-serif" 
              font-size="14" 
              font-weight="900" 
              fill="#ffffff" 
              text-anchor="middle"
              letter-spacing="0.5"
              filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.5))">CM</text>
        <text x="250" y="252" 
              font-family="'Arial Black', 'Impact', sans-serif" 
              font-size="13" 
              font-weight="900" 
              fill="#ffffff" 
              text-anchor="middle"
              letter-spacing="0.5"
              filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.5))">Pro</text>
      </g>

      <rect x="240" y="165" width="20" height="30" rx="5" fill="url(#jointGrad)" filter="url(#shadow)"/>

      <g class="anim-head">
        <rect x="185" y="70" width="130" height="110" rx="30" fill="url(#headGlow)" filter="url(#shadow)"/>
        <path d="M 210 75 L 290 75 Q 305 75 305 90 L 195 90 Q 195 75 210 75 Z" fill="#ffffff" opacity="0.4"/>
        
        <rect x="197" y="82" width="106" height="86" rx="18" fill="url(#screenGrad)"/>
        
        <g class="anim-eye">
          <circle cx="227" cy="125" r="19" fill="none" stroke="#ffcc00" stroke-width="4" filter="url(#glow)"/>
          <circle cx="227" cy="125" r="14" fill="url(#eyeGlow)"/>
          <circle cx="223" cy="120" r="4" fill="#ffffff" opacity="0.8"/>
          
          <circle cx="273" cy="125" r="19" fill="none" stroke="#ffcc00" stroke-width="4" filter="url(#glow)"/>
          <circle cx="273" cy="125" r="14" fill="url(#eyeGlow)"/>
          <circle cx="269" cy="120" r="4" fill="#ffffff" opacity="0.8"/>
        </g>
      </g>

      <g class="anim-wave">
        <circle cx="185" cy="210" r="16" fill="url(#jointGrad)" filter="url(#shadow)"/>
        <path d="M 185 210 L 140 170" fill="none" stroke="url(#blackLimbs)" stroke-width="22" stroke-linecap="round" filter="url(#shadow)"/>
        <circle cx="140" cy="170" r="13" fill="url(#jointGrad)"/>
        <path d="M 140 170 L 105 110" fill="none" stroke="url(#bodyGrad)" stroke-width="26" stroke-linecap="round" filter="url(#shadow)"/>
        <circle cx="105" cy="110" r="16" fill="url(#blackLimbs)" filter="url(#shadow)"/>
        <circle cx="101" cy="105" r="5" fill="#ffffff" opacity="0.3"/>
      </g>

    </g> </g> </svg>
