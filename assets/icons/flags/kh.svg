<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" width="60" height="40">
  <rect width="60" height="40" fill="#032EA1"/>
  <rect y="10" width="60" height="20" fill="#E00025"/>
  <!-- Angkor Wat (simplified): base, terraces and five towers -->
  <g fill="#fff" stroke="#000" stroke-width="0.35" stroke-linejoin="round">
    <rect x="17" y="26" width="26" height="2.2"/>
    <rect x="18.5" y="24" width="23" height="2"/>
    <rect x="20" y="22.2" width="20" height="1.8"/>
    <!-- outer towers -->
    <path d="M18.6,24 v-4 h2.6 v4 z M19.1,20 L19.9,16 L20.7,20 z"/>
    <path d="M38.8,24 v-4 h2.6 v4 z M39.3,20 L40.1,16 L40.9,20 z"/>
    <!-- inner towers -->
    <path d="M23.2,22.2 v-4.6 h3 v4.6 z M23.7,17.6 L24.7,13 L25.7,17.6 z"/>
    <path d="M33.8,22.2 v-4.6 h3 v4.6 z M34.3,17.6 L35.3,13 L36.3,17.6 z"/>
    <!-- central tower -->
    <path d="M27.6,22.2 v-6 h4.8 v6 z M28.2,16.2 L30,10.6 L31.8,16.2 z"/>
    <!-- galleries -->
    <rect x="21.2" y="20.4" width="2" height="1.8"/>
    <rect x="26.2" y="19.6" width="1.4" height="2.6"/>
    <rect x="32.4" y="19.6" width="1.4" height="2.6"/>
    <rect x="36.8" y="20.4" width="2" height="1.8"/>
  </g>
</svg>
